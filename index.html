  /* ---- Views ---- */
  function renderExplore(notes, keepAll) {
    for (const k in TSTATE) { TSTATE[k].all = false; TSTATE[k].limit = 0; }
    for (const k of keepAll || []) (TSTATE[k] || (TSTATE[k] = {})).all = true;
    for (const k in TABLES) delete TABLES[k];
    negNoted = false;
    const nActive = renderChips(notes);
    syncPanel(nActive);
    for (const b of document.querySelectorAll('.seg button')) b.setAttribute('aria-pressed', String(b.dataset.g === S.g));
    const m = Core.tableModel(ix, S);
    // Summary sentence
    const sum = m.sum;
    let s;
    if (S.agency == null && !m.peers.size) s = 'No agencies match the agency filters.';
    else {
      s = S.agency != null
        ? money(sum.spend) + ' paid by ' + esc(agName(S.agency)) + ' to ' + plural(sum.ve.size, 'vendor', 'vendors')
        : money(sum.spend) + ' paid to ' + plural(sum.ve.size, 'vendor', 'vendors') + ' by ' +
          (m.peers.size === 1 ? esc(agName([...m.peers][0])) : agOf(sum.ag.size, m.peers.size));
      s += ', ' + esc(yearSpan(S)) + (S.cat ? ', in ' + catsText(S.cat, true) : '') + (m.onlyPurch ? '; purchasing categories only.' : '.');
    }
    $('summary').innerHTML = s;
    renderContext();
    renderMain(m);
    renderMore();
    const h1 = S.g === 'none' ? 'Yearly totals by payee' : 'Payments by ' + GNAME[S.g];
    $('page-h').textContent = h1;
    const named = [S.cat && catsText(S.cat), S.vendor && vendorOf(S.vendor).name, S.agency != null && agName(S.agency)].filter(Boolean);
    document.title = (named.length ? named.join(', ') + ' – ' : '') + (S.g === 'category' && !named.length ? SITE : h1 + ' – ' + SITE);
    $('explore').hidden = false;
    $('page').hidden = true;
    $('page').innerHTML = '';
    fitRegions($('area'));
  }

  function viewAbout() {
    const meta = ix.meta;
    const share = meta.purchasing_classified_share;
    const gh = p => A(BLOB + p, esc(p));
    const py = (meta.partial_years || []).map(y => 'FY' + y);
    let h = '<div class="prose"><h1 tabindex="-1">About</h1>';
    h += '<p>This prototype shows what Utah fire districts and interlocal fire agencies paid to vendors. It is for a fire chief or purchasing officer who wants to see, for one kind of purchase, which vendors similar agencies use, how many agencies use each, and what they paid.</p>';
    h += '<p>Pick filters and a grouping for the table. Selecting a row adds it as a filter and moves to the next grouping. Yearly totals shows the rows every number is built from: what one agency paid one payee name in one fiscal year.</p>';
    h += '<h2>Sources</h2><ul>';
    h += '<li>' + A(LINKS.tu, 'Transparent Utah') + ', for ' + int(meta.counts.agencies) + ' agencies, FY' + meta.years[0] + ' to FY' + meta.years[meta.years.length - 1] + '. Fetched ' + esc(dateText(meta.fetched)) + '. Raw files: ' + A(REPO + '/tree/main/' + meta.raw_path, esc(meta.raw_path)) + '.<ul>';
    h += '<li>Vendor payments: net yearly totals per payee name.</li>';
    h += '<li>Total expenses per year, and revenue in each agency\'s own account names. Revenue totals leave out borrowing, transfers between the agency\'s own funds and donated infrastructure (' + A(REPO + '/blob/main/config/revenue_exclusions.csv', 'config/revenue_exclusions.csv') + ').</li>';
    h += '<li>Largest single payments: each agency\'s 100 largest payments per fiscal year, without dates or descriptions. Kept here: ' +
      (meta.counts.payments != null ? 'the ' + int(meta.counts.payments) : 'those') + ' of $1,000 or more to vendors in purchasing categories. ' +
      'The lists include payments later voided or entered twice; a payment is left out when it would push the total past the net amount paid to that vendor that year.</li>';
    h += '<li>Compensation reports: wages, benefits and job title per employee. Employee names are replaced by numbers in the raw files.</li>';
    h += '</ul></li>';
    h += '<li>' + A(LINKS.usfa, 'USFA National Fire Department Registry') + ': department type, stations and firefighter counts.</li>';
    h += '<li>' + A(LINKS.grants, 'OpenFEMA firefighter grants') + ': Assistance to Firefighters, SAFER and Fire Prevention and Safety awards, matched to agencies by recipient name (' + gh('config/grant_recipients.csv') + ').</li>';
    h += '<li>' + A(LINKS.neris, 'NERIS integration partners') + ': vendors listed by FSRI as integrated with NERIS, the national fire incident reporting system replacing NFIRS.</li>';
    h += '<li>' + A(LINKS.ael, 'FEMA Authorized Equipment List') + ': codes shown when a category with an AEL section is selected. The list governs Homeland Security Grant Program awards, not AFG; FEMA limits many fire and medical items to surge or CBRN use.</li>';
    h += '</ul>';
    h += '<h2>How vendors are named and categorized</h2>';
    h += '<p>Payee names are normalized: upper case, punctuation removed, and words such as Inc, LLC, Corp and The dropped. Payee names that normalize to the same text are one vendor. Each vendor gets one category, in this order:</p><ol>';
    h += '<li>' + gh('config/vendor_map.csv') + ': normalized name to vendor name and category, set by hand.</li>';
    h += '<li>' + gh('config/keyword_rules.csv') + ': the first pattern that matches the normalized name sets the category.</li>';
    h += '<li>Otherwise the vendor is Unclassified.</li></ol>';
    h += '<p>Payee names that look like a person (Last, First) are combined into one entry, Individuals (names withheld). The category list is ' + gh('config/categories.csv') + '. Categories marked as not purchasing (payroll and benefits, debt and card payments, payments to other governments, placeholder names, individuals) are left out unless Include non-purchasing payments is checked. The build script is ' + gh('pipeline/build.py') + '.</p>';
    if (share != null) {
      h += '<p>Share of purchasing spend in a named category: ' + pct(share) + ' of ' + money(meta.purchasing_total) + ' (all agencies, all years). The rest is Unclassified.</p>';
    }
    h += '<h2>How agencies and vendors are counted</h2>';
    h += '<p>Amounts are net: refunds and credits are subtracted. An agency counts as using a vendor when its net payment to that vendor is positive in at least one fiscal year in the selected range. Last year paid is the latest such year. An agency or vendor with only refunds or credits in the range is listed with its net amount but not counted.</p>';
    h += '<h2>Filters and agency columns</h2>';
    h += '<p>Category takes one or more categories; a payment is included when it is in any of them. Annual expenses uses total expenses in the latest fully reported fiscal year, from Transparent Utah; agencies without that figure are left out when a range is selected. Selecting one agency sets the county and annual expenses filters aside.</p>';
    h += '<p>Staffing in the agency table is the USFA registry department type: Career, Mostly career, Mostly volunteer or Volunteer. Mostly career and Mostly volunteer are combination departments. Agencies not found in the registry are shown as Not listed. FEMA grants in the agency grouping count awards with a federal fiscal year in the selected range.</p>';
    h += '<h2>Limitations</h2><ul>';
    h += '<li>Amounts are net yearly totals per agency and payee name, not invoices or line items. Refunds and corrections can make a total negative.</li>';
    h += '<li>There are no item descriptions, so categories are assigned per vendor. A distributor that sells many kinds of goods sits in one category.</li>';
    h += '<li>Purchasing card payments show the card company as the payee, so the actual merchant is hidden.</li>';
    h += '<li>City and county fire departments are not included yet. Their fire spending is not separable by vendor in the public data.</li>';
    const fs = Core.fyStarts(ix);
    const fyParts = [];
    if (fs.January) fyParts.push(plural(fs.January, 'agency runs its', 'agencies run their') + ' fiscal year January to December');
    if (fs.July) fyParts.push(plural(fs.July, 'runs', 'run') + ' July to June');
    if (fs['']) fyParts.push(plural(fs[''], 'does', 'do') + ' not report when theirs starts');
    h += '<li>FY is each agency\'s own fiscal year as reported to Transparent Utah. ' +
      cap(fyParts.length > 1 ? fyParts.slice(0, -1).join(', ') + ' and ' + fyParts[fyParts.length - 1] : fyParts.join('')) +
      (py.length ? '; ' + py.join(' and ') + ' may be incomplete for any agency (calendar-year agencies are mid-year) and ' +
        (py.length === 1 ? 'is' : 'are') + ' marked partial throughout.' : '.') + '</li>';
    h += '<li>People paid counts employee numbers in the compensation reports. Unified Fire Authority reports several of its fire investigations staff under one employee number each year, so its count is a few people low and they appear under one job title.</li>';
    h += '<li>Payee names written like a person (Last, First) are withheld. Names of people written another way may still appear.</li>';
    h += '<li>The USFA registry is self-reported and some agencies are missing from it.</li>';
    h += '<li>Some agencies fund others. For example, Unified Fire Service Area pays Unified Fire Authority. Those transfers are under Payments to other governments, which is not counted as purchasing.</li>';
    h += '</ul>';
    h += '<h2>Code</h2><p>' + A(REPO, 'github.com/pasha594/utah-fire-procurement') + '. Data built ' + esc(dateText(meta.built)) + '.</p>';
    h += '</div>';
    return h;
  }

  /* ---- Router ---- */
  // Focus after a change: the summary, unless Back or Forward restored a position further down the
  // table; then the first row in view. In the fixed layout the summary is always on screen, so what
  // counts is whether the table region is scrolled past the start of the table.
  function focusMain() {
    const sum = $('summary');
    const tb = $('tb-main-' + S.g);
    const sc = fixed() ? $('scroller') : null;
    let top = 0, bottom = window.innerHeight;
    if (sc) {
      top = sc.getBoundingClientRect().top + sc.clientTop;
      bottom = top + sc.clientHeight;
    }
    const r = sum.getBoundingClientRect();
    const sumOn = r.top >= 0 && r.top < window.innerHeight;
    if (!tb || (sumOn && (!sc || tb.getBoundingClientRect().top >= top - 1))) { sum.focus({ preventScroll: true }); return; }
    // Rows under the sticky header row are hidden (its cells stick; the thead box itself does not move)
    const hc = sc && tb.querySelector('thead th');
    const from = hc ? Math.max(top, hc.getBoundingClientRect().bottom - 1) : top;
    for (const b of tb.querySelectorAll('button.drill')) {
      const q = b.getBoundingClientRect();
      if (q.top > bottom) break;
      if (q.top >= from) { b.focus({ preventScroll: true }); return; }
    }
    // No row button in view: the table itself when it is in view (rows without buttons), otherwise
    // the summary when it is on screen (the region is scrolled to the sections below the table)
    const t = tb.getBoundingClientRect();
    if (sumOn && (t.bottom <= from || t.top >= bottom)) { sum.focus({ preventScroll: true }); return; }
    tb.tabIndex = -1;
    tb.focus({ preventScroll: true });
  }
  // own: the change came from the page (a control, a row or a link); otherwise Back, Forward or a typed URL
  function route(own) {
    const { parts, params } = parseHash();
    const L = Core.fromPath(parts, params);
    const prevView = view;
    const active = document.activeElement;
    const activeId = active && active !== document.body ? active.id : '';
    const inArea = !!(active && $('area').contains(active));
    clearTimeout(scrollTimer);
    try {
      if (L.page === 'about') {
        view = 'about';
        $('explore').hidden = true;
        $('page').hidden = false;
        $('page').innerHTML = viewAbout();
        document.title = 'About – ' + SITE;
      } else {
        view = 'explore';
        S = Core.normState(ix, L.p);
        const notes = S.bad.slice();
        if (L.unknown) notes.unshift('page "' + L.unknown + '"');
        const canon = stateHash(S);
        if (location.hash !== canon) history.replaceState(history.state, '', canon);   // older URL forms
        exploreHash = canon;
        $('home-link').href = canon;                     // the site title returns to this table
        const st = history.state;
        renderExplore(notes, !own && st && Array.isArray(st.all) ? st.all : null);   // Back/Forward: tables shown in full stay so
      }
    } catch (err) {
      console.error(err);
      for (const k in TABLES) delete TABLES[k];
      view = 'error';
      $('explore').hidden = true;
      $('page').hidden = false;
      $('page').innerHTML = '<div class="prose"><h1 tabindex="-1">Something went wrong</h1><p>This view could not be shown. ' + A('#/', 'Start over') + '.</p></div>';
      document.title = 'Error – ' + SITE;
    }
    rendered = location.hash;
    const about = $('about-link');
    if (view === 'about') about.setAttribute('aria-current', 'page'); else about.removeAttribute('aria-current');
    if (view !== 'explore') catPanel(false);

    // Scroll: Back and Forward return to the saved position; other changes show the new table from its
    // start (the table region in the fixed layout; otherwise the page, when it is scrolled past the table)
    const box = scrollBox();
    if (!own && prevView !== null) {
      const st = history.state;
      box.scrollTop = st && typeof st.y === 'number' ? st.y : 0;
      box.scrollLeft = st && typeof st.x === 'number' ? st.x : 0;
    } else if (own && view === 'explore') {
      if (fixed()) { box.scrollTop = 0; box.scrollLeft = 0; }
      else {
        const top = $('area').getBoundingClientRect().top;
        if (top < 0) window.scrollBy(0, top - 8);
      }
    } else if (own && view !== prevView) {
      box.scrollTop = 0;
      box.scrollLeft = 0;
    }
    // Focus: stay on the control that made the change when it is still there; otherwise the summary
    if (view !== 'explore') {
      if (prevView !== view && prevView !== null) { const h1 = $('page').querySelector('h1'); if (h1) h1.focus({ preventScroll: true }); }
    } else if (prevView !== null) {
      const again = activeId && $(activeId);
      if (prevView !== 'explore') focusMain();
      else if (again && document.activeElement !== again && $('area').contains(again)) again.focus({ preventScroll: true });
      else if (inArea && !document.contains(active)) focusMain();
      else if (own && (!active || active === document.body || active === $('main') || active === $('scroller'))) focusMain();   // e.g. a click on a row cell
      else if (!own && inArea) focusMain();
    }
  }

  // Remember the scroll position of each history entry (of the page, or of the table region)
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  document.addEventListener('scroll', e => {
    const b = scrollBox();
    if (e.target !== b && !(e.target === document && b === (document.scrollingElement || document.documentElement))) return;
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(saveEntry, 200);
  }, { passive: true, capture: true });
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { fitRegions($('main')); placeCat(); }, 200);
  });
  // Fixed layout: the page itself does not scroll, so the scroll keys do nothing while focus is outside
  // the region (on the page, or on the summary after a change). They scroll the region instead.
  const SCROLL_KEYS = { PageDown: 1, PageUp: -1, ' ': 1, ArrowDown: 1, ArrowUp: -1, Home: -1, End: 1 };
  document.addEventListener('keydown', e => {
    if (!fixed() || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.isComposing) return;
    const dir = SCROLL_KEYS[e.key];
    if (!dir) return;
    const a = document.activeElement;
    if (a && a !== document.body && a !== $('main') && a !== $('summary')) return;
    const sc = scrollBox();
    if (sc === document.scrollingElement || sc === document.documentElement) return;
    const page = Math.max(40, sc.clientHeight - 40);
    let top;
    if (e.key === 'Home' || e.key === 'End') top = dir * sc.scrollHeight;
    else if (e.key.startsWith('Arrow')) top = dir * 40;
    else top = (e.key === ' ' && e.shiftKey ? -1 : dir) * page;
    e.preventDefault();
    sc.scrollBy({ top });
  });
  $('skip').addEventListener('click', e => {
    e.preventDefault();
    const target = view === 'explore' ? $('summary') : $('page').querySelector('h1');
    (target || $('main')).focus();
  });

  /* ---- Load ---- */
  function fail(err) {
    $('page').innerHTML = '<div class="prose"><h1 tabindex="-1">Data did not load</h1>' +
      '<p>Could not load the data' + (err && err.message ? ': ' + esc(err.message) : '') + '.</p>' +
      (location.protocol === 'file:'
        ? '<p>Opening index.html directly from disk does not work, because the browser blocks the data request. ' +
          'From the project folder run <code>python3 -m http.server</code> and open <a href="http://localhost:8000/">http://localhost:8000/</a>.</p>'
        : '') + '</div>';
  }
  fetch('data/data.json', { cache: 'no-cache' })                // revalidate, so a new page never runs on old cached data
    .then(r => { if (!r.ok) throw new Error('data/data.json returned HTTP ' + r.status); return r.json(); })
    .then(D => {
      ix = Core.buildIndex(D);
      $('asof').textContent = 'Prototype. Data as of ' + dateText(ix.meta.fetched) + '.';
      fillControls();
      bindControls();
      route(false);
      loaded = true;
      // Back and Forward; typed URLs and links outside the page's own handling (each change is rendered once)
      window.addEventListener('popstate', () => route(false));
      window.addEventListener('hashchange', () => { if (location.hash !== rendered) route(false); });
    })
    .catch(err => { console.error(err); if (!loaded) fail(err); });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire Agency Vendor Finances</title>
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Which vendors fire agencies use, by category: how many agencies pay each vendor, for what and how much, and each agency's own vendors. Fire districts and fire departments in Utah, Ohio, California, Idaho and Texas, from public spending data.">
<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --fg: #1b1b1b;
  --muted: #595959;
  --rule: #dddddd;
  --rule-strong: #8a8a8a;
  --shade: #f3f3f3;
  --hover: #eaf0f7;
  --accent: #1d4f91;
  --accent-fg: #ffffff;
  --bar: #c9d6e8;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
.skip { position: absolute; left: -9999px; top: 0; }
.skip:focus { left: 16px; top: 8px; background: var(--bg); padding: 4px 8px; z-index: 3; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
p { margin: 6px 0; }
.muted { color: var(--muted); }
.note { font-size: .8125rem; color: var(--muted); max-width: 64em; }
.nw { white-space: nowrap; }

/* Header */
.site { border-bottom: 1px solid var(--rule); }
.hdr { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; padding-top: 7px; padding-bottom: 7px; }
.site-title { margin: 0; font-size: 1.1rem; font-weight: 600; }
.site-title a { color: var(--fg); text-decoration: none; }
.asof { margin: 0; font-size: .85rem; color: var(--muted); }
.hnav { margin-left: auto; display: flex; gap: 14px; font-size: .9rem; }

/* Scope and search */
.sbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-top: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
.sbar label { font-weight: 600; font-size: .8125rem; margin-right: 6px; }
select, input[type=text], input[type=search] {
  font: inherit; font-size: .875rem; color: var(--fg); background: var(--bg);
  border: 1px solid var(--rule-strong); border-radius: 3px; padding: 4px 6px; max-width: 100%;
}
select:disabled { color: var(--muted); border-color: var(--rule); }
.search { position: relative; margin-left: auto; flex: 0 1 26em; min-width: 14em; }
.search input { width: 100%; }
.qlist {
  position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 2px); margin: 0; padding: 4px 0; list-style: none;
  background: var(--bg); border: 1px solid var(--rule-strong); border-radius: 3px; box-shadow: 0 4px 14px rgba(0, 0, 0, .14);
  max-height: 70vh; overflow-y: auto; font-size: .875rem;
}
.qlist[hidden] { display: none; }
.qlist .qh { padding: 4px 10px 2px; font-size: .75rem; font-weight: 600; color: var(--muted); }
.qlist [role=option] { display: flex; align-items: center; gap: 8px; padding: 4px 10px; cursor: pointer; }
.qlist [role=option][aria-selected=true], .qlist [role=option]:hover { background: var(--hover); }
.qlist .qm { margin-left: auto; color: var(--muted); font-size: .8125rem; white-space: nowrap; padding-left: 8px; }
.qlist .qnone { padding: 4px 10px; color: var(--muted); }

/* Page */
main { padding-top: 12px; padding-bottom: 48px; }
h1 { font-size: 1.35rem; font-weight: 600; margin: 4px 0 2px; }
h2 { font-size: 1.05rem; font-weight: 600; margin: 26px 0 6px; }
h3 { font-size: .9375rem; font-weight: 600; margin: 18px 0 6px; }
.crumbs { font-size: .8125rem; color: var(--muted); margin: 0 0 4px; }
.crumbs a { color: var(--muted); }
.lead { max-width: 62em; }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--rule-strong); margin: 4px 0 14px; }
.tabs a {
  padding: 6px 14px; text-decoration: none; color: var(--fg); border: 1px solid transparent; border-bottom: 0;
  margin-bottom: -1px; border-radius: 3px 3px 0 0; font-size: .9375rem;
}
.tabs a:hover { background: var(--shade); }
.tabs a[aria-current=page] { border-color: var(--rule-strong); background: var(--bg); font-weight: 600; }
.tabs .n { color: var(--muted); font-weight: 400; }
.vhead { display: flex; align-items: center; gap: 14px; }
.vhead h1 { margin: 0; }
.facts { font-size: .875rem; color: var(--muted); margin: 2px 0 0; }
.facts > span + span::before { content: " · "; }
details.other { margin-top: 26px; border-top: 1px solid var(--rule-strong); }
details.other > summary { cursor: pointer; font-size: 1.05rem; font-weight: 600; padding: 10px 0 4px; }
details.other > summary .muted { font-weight: 400; font-size: .875rem; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 8px 0; font-size: .875rem; }
.toolbar input { width: 18em; }
.toolbar .tcount { margin-left: auto; color: var(--muted); }
.btn {
  font: inherit; font-size: .8125rem; color: var(--fg); background: var(--bg);
  border: 1px solid var(--rule-strong); border-radius: 3px; padding: 3px 10px; cursor: pointer;
}
.btn:hover { background: var(--shade); }
.more { margin: 8px 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 0 32px; }

/* Tables */
.tw { overflow-x: auto; overflow-y: hidden; }
table { border-collapse: collapse; font-size: .875rem; width: 100%; }
th, td { padding: 5px 10px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; overflow-wrap: break-word; }
thead th {
  background: var(--shade); border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule-strong);
  font-weight: 600; vertical-align: bottom; overflow-wrap: normal;
}
tbody th { font-weight: 400; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; overflow-wrap: normal; }
thead th.num { white-space: normal; }
tr.grp th { background: var(--bg); font-weight: 600; font-size: .8125rem; color: var(--muted); padding-top: 14px; border-bottom: 1px solid var(--rule-strong); }
tfoot th, tfoot td { border-top: 1px solid var(--rule-strong); border-bottom: 0; font-weight: 600; }
th[aria-sort] button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
th[aria-sort] button::after { content: ""; display: inline-block; width: 1em; color: var(--muted); }
th[aria-sort=descending] button::after { content: " ↓"; }
th[aria-sort=ascending] button::after { content: " ↑"; }
.rank { color: var(--muted); width: 2.5em; }
td.bar { position: relative; }
td.bar::before {
  content: ""; position: absolute; right: 6px; bottom: 3px; height: 3px; width: calc(var(--w, 0) * (100% - 12px));
  background: var(--bar); border-radius: 1px;
}

/* Vendor names with a logo, or initials when there is none */
.vn { display: inline-flex; align-items: flex-start; gap: 8px; min-width: 0; }
.vn > a, .vn > span:last-child { min-width: 0; }
.lg {
  flex: none; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
  border: 1px solid var(--rule); border-radius: 4px; background: #fff; overflow: hidden; margin-top: -1px;
}
.lg img { width: 18px; height: 18px; object-fit: contain; display: block; }
.lg.mono { font-size: .625rem; font-weight: 600; color: var(--muted); background: var(--shade); letter-spacing: .02em; }
.lg.big { width: 52px; height: 52px; border-radius: 6px; }
.lg.big img { width: 44px; height: 44px; }
.lg.big.mono { font-size: 1.05rem; }
.st { color: var(--muted); font-size: .75rem; margin-left: 4px; white-space: nowrap; }
.tag { font-size: .75rem; border: 1px solid var(--rule-strong); border-radius: 3px; padding: 0 5px; color: var(--muted); white-space: nowrap; }

/* Home: one row per category, its most used vendors */
table.cats > tbody > tr > th { width: 15em; }
table.cats td.top { padding-top: 4px; padding-bottom: 4px; }
ul.chips { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0; padding: 0; list-style: none; }
ul.chips li { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; }
ul.chips .cnt { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .8125rem; }
.chipsm { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.chipsm a { display: inline-flex; }

/* Stack and agency rows that open: the vendor's years, payments and item lines */
button.exp {
  font: inherit; font-size: .75rem; color: var(--muted); background: none; border: 1px solid var(--rule); border-radius: 3px;
  width: 22px; height: 22px; padding: 0; cursor: pointer; line-height: 1;
}
button.exp:hover { background: var(--shade); color: var(--fg); }
button.exp[aria-expanded=true] { background: var(--shade); color: var(--fg); }
td.ex { width: 34px; padding-right: 0; }
tr.detail > td { background: #fafafa; padding: 8px 12px 14px 44px; }
tr.detail[hidden] { display: none; }
.dgrid { display: flex; flex-wrap: wrap; gap: 4px 28px; }
.dgrid h4 { font-size: .8125rem; font-weight: 600; margin: 6px 0 4px; }
.dgrid table { width: auto; font-size: .8125rem; background: var(--bg); }
.dgrid td, .dgrid th { padding: 3px 8px; }
.dgrid .wide { flex: 1 1 520px; min-width: 0; }
.dgrid .wide table { width: 100%; }
tr.cat th { font-weight: 600; padding-top: 12px; }
tr.cat td { padding-top: 12px; }
tr.sub td { color: var(--muted); font-size: .8125rem; }

/* Phones */
@media (max-width: 720px) {
  .search { margin-left: 0; flex: 1 1 100%; }
  .hnav { margin-left: 0; }
  table.cats thead { display: none; }
  table.cats, table.cats tbody, table.cats tr, table.cats th, table.cats td { display: block; width: auto; }
  table.cats tr { border-bottom: 1px solid var(--rule); padding: 6px 0; }
  table.cats tr.grp { border-bottom: 1px solid var(--rule-strong); }
  table.cats th, table.cats td { border: 0; padding: 2px 0; }
  table.cats td.num { text-align: left; display: inline-block; margin-right: 14px; color: var(--muted); }
  table.cats td.num::before { content: attr(data-l) " "; }
  tr.detail > td { padding-left: 12px; }
}
</style>

<a class="skip" href="#main">Skip to content</a>
<header class="site">
  <div class="wrap hdr">
    <p class="site-title"><a href="#/" id="home-link">Fire Agency Vendor Finances</a></p>
    <p class="asof" id="asof"></p>
    <nav class="hnav" aria-label="Other pages">

<main id="main" class="wrap" tabindex="-1">
  <div id="page"><p>Loading data...</p></div>
</main>

<script>
'use strict';

/* ==========================================================================
   VCore: the numbers of the vendor page, from data/index.json, data/stack.json and the files loaded later
   (data/stack-tail.json, data/<st>-payments.json, data/<st>-items.json). No DOM access, so it also runs in
   node (tests/stack_test.js). Amounts are net (refunds and credits subtract) in purchasing categories.
   ========================================================================== */
const VCore = (function () {
  const POS = 0.005;              // a positive year: net over half a cent in one fiscal year and category (as the table page)
  const NERIS = 1, OTHER = 2;     // vendor flags in data/stack.json; OTHER: card statements, banks, no vendor named...
  const ENT = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", '#39': "'" };
  const decode = s => (typeof s === 'string' && s.indexOf('&') >= 0 ? s.replace(/&(amp|lt|gt|quot|apos|#39);/g, (m, e) => ENT[e]) : s);
  const cleanText = s => decode(String(s)).replace(/[\u0000-\u001f\u007f]+/g, ' ').replace(/ {2,}/g, ' ').trim();
  // A vendor's id is the slug of its name (pipeline/build.py), unless data/stack.json gives it
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

  // Quartiles of amounts by linear interpolation; the median is q(.5)
  function stats(cells) {
    if (!cells.length) return null;
    const s = cells.slice().sort((a, b) => a - b);
    const q = f => { const p = (s.length - 1) * f, lo = Math.floor(p), hi = Math.ceil(p); return s[lo] + (s[hi] - s[lo]) * (p - lo); };
    return { n: s.length, median: q(0.5), q1: q(0.25), q3: q(0.75) };
  }
  // Sum of a line's years, and whether one year is positive. r = [agency, vendor, category, y, x, y, x, ...]
  function lineSum(r) {
    let sum = 0, pos = false;
    for (let k = 3; k < r.length; k += 2) { sum += r[k + 1]; if (r[k + 1] > POS) pos = true; }
    return [sum, pos];
  }

  function buildStore(I, S) {
    const meta = I && I.meta;
    if (!meta || !Array.isArray(meta.states_order) || !Array.isArray(I.agencies) || !Array.isArray(I.categories)) {
      throw new Error('data/index.json is missing meta, agencies or categories');
    }
    if (!S || !Array.isArray(S.vendors) || !Array.isArray(S.lines) || !Array.isArray(S.agencies) || !Array.isArray(S.sections)) {
      throw new Error('data/stack.json is not the vendor data file');
    }
    if (S.built !== meta.built) {
      throw new Error('data/stack.json (built ' + S.built + ') is not from the same build as data/index.json (built ' + meta.built + ')');
    }
    const cats = I.categories;
    const catPos = new Map(cats.map((c, i) => [c.id, i]));
    const agency = new Map(I.agencies.map(a => [a.id, a]));
    const partial = {};
    for (const s of meta.states_order) partial[s] = new Set(meta.states[s].partial_years || []);
    const sections = S.sections.map(([id, section]) => {
      if (!catPos.has(id)) throw new Error('data/stack.json names an unknown category ' + id);
      return { id, pos: catPos.get(id), section, cat: cats[catPos.get(id)] };
    });
    const ags = S.agencies.map(id => {
      const a = agency.get(id);
      if (!a) throw new Error('data/stack.json does not match data/index.json (agency ' + id + ')');
      return a;
    });
    const store = {
      I, meta, cats, catPos, agency, partial, sections, ags,
      order: meta.states_order.slice(),
      secOf: new Map(sections.map(s => [s.pos, s.section])),
      agPos: new Map(S.agencies.map((id, i) => [id, i])),
      vendors: [], vendorPos: new Map(),
      lines: [], byVendor: [], byAgency: [],
      tail: S.tail || null, tailLoaded: !S.tail,
      tailSums: new Map(),        // agency index -> Map(category index or -1 -> [merchants' net, merchants, others' net])
      vmap: null,                 // state -> state file vendor index -> vendor index (data/stack-tail.json)
      payments: {}, descriptions: [], items: {}, istrings: [],
      scopes: new Map(), version: 0,
    };
    for (const [ai, c, m, n, o] of S.tail_sums || []) {
      if (!store.tailSums.has(ai)) store.tailSums.set(ai, new Map());
      store.tailSums.get(ai).set(c, [m, n, o]);
    }
    addVendors(store, S.vendors, S.ids || {}, 'data/stack.json');
    addLines(store, S.lines, 'data/stack.json');
    return store;
  }
  function addVendors(store, list, ids, file) {
    const off = store.vendors.length;
    list.forEach((v, k) => {
      const i = off + k;
      if (!Array.isArray(v) || typeof v[0] !== 'string' || !store.catPos.has(v[1])) throw new Error(file + ' has a bad vendor at ' + i);
      const name = decode(v[0]);
      const id = ids[String(i)] || slug(v[0]);
      const logo = typeof v[4] === 'string' && /^logos\/[A-Za-z0-9._-]+$/.test(v[4]) ? v[4] : null;
      const domain = typeof v[3] === 'string' && /^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(v[3]) ? v[3] : null;
      store.vendors.push({ i, id, name, low: name.toLowerCase(), cat: v[1], neris: !!(v[2] & NERIS), merchant: !(v[2] & OTHER),
        domain, logo, px: v[5] > 0 ? v[5] : null, users: 0, tail: file !== 'data/stack.json' });
      if (!store.vendorPos.has(id)) store.vendorPos.set(id, i);
    });
  }
  // Lines come sorted by agency, vendor and category, so a vendor's lines for one agency follow each other
  function addLines(store, L, file) {
    const nA = store.ags.length, nV = store.vendors.length, last = new Map();
    for (const r of L) {
      if (!Array.isArray(r) || !(r[0] >= 0 && r[0] < nA) || !(r[1] >= 0 && r[1] < nV) || !store.secOf.has(r[2]) || r.length < 5 || r.length % 2 === 0) {
        throw new Error(file + ' does not match data/index.json');
      }
      const li = store.lines.length;
      store.lines.push(r);
      (store.byVendor[r[1]] || (store.byVendor[r[1]] = [])).push(li);
      (store.byAgency[r[0]] || (store.byAgency[r[0]] = [])).push(li);
      if (lineSum(r)[1] && last.get(r[1]) !== r[0]) { last.set(r[1], r[0]); store.vendors[r[1]].users++; }
    }
  }
  // data/stack-tail.json: vendors used by one agency, their lines, and the vendor map of the state files
  function addTail(store, T) {
    if (store.tailLoaded) return;
    if (!T || !Array.isArray(T.vendors) || !Array.isArray(T.lines) || !T.vmap) throw new Error('data/stack-tail.json is not the vendor data file');
    if (T.built !== store.meta.built) {
      throw new Error('data/stack-tail.json (built ' + T.built + ') is not from the same build as data/index.json (built ' + store.meta.built + ')');
    }
    if (store.tail && T.vendors.length !== store.tail.vendors) throw new Error('data/stack-tail.json does not match data/stack.json');
    addVendors(store, T.vendors, T.ids || {}, 'data/stack-tail.json');
    addLines(store, T.lines, 'data/stack-tail.json');
    store.vmap = T.vmap;
    store.tailLoaded = true;
    store.version++;
    store.scopes.clear();
  }

  /* ---- Scope: all states, a state, or a county of a state ---- */
  function scope(store, state, county) {
    state = store.meta.states[state] ? state : '';
    county = state && county ? county : '';
    const key = state + '|' + county;
    let sc = store.scopes.get(key);
    if (sc) return sc;
    const inS = a => (!state || a.state === state) && (!county || a.county === county);
    const mask = new Uint8Array(store.ags.length);
    store.ags.forEach((a, i) => { if (inS(a)) mask[i] = 1; });
    const withData = store.I.agencies.filter(a => inS(a) && a.coverage <= 2);
    const years = (state ? store.meta.states[state].years : store.meta.years).slice().sort((a, b) => a - b);
    sc = {
      state, county, key, mask, withData,
      all: store.I.agencies.filter(inS).length,
      years, partial: state ? store.partial[state] : new Set(store.meta.partial_years || []),
      cache: new Map(),
    };
    store.scopes.set(key, sc);
    return sc;
  }
  const cached = (sc, key, fn) => { if (!sc.cache.has(key)) sc.cache.set(key, fn()); return sc.cache.get(key); };

  /* ---- Categories of a scope, each with its vendors ranked by the agencies that paid them ----
     Vendors (merchants only) count where one of their years in the category is positive. Vendors of
     data/stack-tail.json add to the counts and totals (from tail_sums until the file loads), never to the
     ranked lists: those list the vendors more than one agency used, across all states. */
  function categories(store, sc) {
    return cached(sc, 'cats', () => {
      const out = new Map(store.sections.map(s => [s.pos, {
        sec: s, accs: new Map(), agencies: new Set(), paid: 0, others: 0, single: 0, singlePaid: 0, list: null,
      }]));
      const all = { agencies: new Set(), vendors: new Set(), single: 0, paid: 0, others: 0 };
      const L = store.lines;
      for (let li = 0; li < L.length; li++) {
        const r = L[li];
        if (!sc.mask[r[0]]) continue;
        const c = out.get(r[2]), v = store.vendors[r[1]];
        const [sum, pos] = lineSum(r);
        if (!v.merchant) { c.others += sum; all.others += sum; continue; }
        c.paid += sum;
        all.paid += sum;
        if (pos) { c.agencies.add(r[0]); all.agencies.add(r[0]); all.vendors.add(r[1]); }
        if (v.tail) { c.singlePaid += sum; if (pos) c.single++; continue; }
        let a = c.accs.get(r[1]);
        if (!a) c.accs.set(r[1], (a = { v, agencies: 0, paid: 0, cells: [], states: new Set(), last: 0 }));
        a.paid += sum;
        if (pos) { a.agencies++; a.states.add(store.ags[r[0]].state); }
        const P = store.partial[store.ags[r[0]].state];
        for (let k = 3; k < r.length; k += 2) {
          if (r[k + 1] > POS) { if (!P.has(r[k])) a.cells.push(r[k + 1]); if (r[k] > a.last) a.last = r[k]; }
        }
      }
      if (!store.tailLoaded) {
        for (const [ai, m] of store.tailSums) {
          if (!sc.mask[ai]) continue;
          for (const [ci, [net, n, others]] of m) {
            if (ci === -1) { all.paid += net; all.single += n; all.others += others; if (n) all.agencies.add(ai); continue; }
            const c = out.get(ci);

        html += '<tr><th scope="row">' + A(hCat(s.pos, sc), esc(catName(s.pos))) + '</th>' +

      '<div style="margin-top:18px">' + coverageNote(sc) + othersNote(C.others, 'in these categories') + '</div>';

  function crumbs(sc, tail) {

  /* ---- #/category/<id>: every vendor of a category, ranked ---- */

  /* ---- #/vendor/<id>: agencies that paid a vendor, what for and how much ---- */
  function viewVendor(sc, id) {
    const vi = store.vendorPos.get(id);
    if (vi == null) {
      if (!store.tailLoaded) return [loadingTail(), 'Vendor', () => tailThen(route)];
      return notFound('There is no vendor ' + esc(id) + ' with purchasing payments.');
    }
    const M = VCore.vendorModel(store, sc, vi), v = M.v;
    const site = v.domain ? '<span>' + A('https://' + v.domain, esc(v.domain)) + '</span>' : '';
    let html = crumbs(sc, A(hCat(store.catPos.get(v.cat), sc), esc(catShort(store.catPos.get(v.cat))))) +
      '<div class="vhead">' + logo(v, true) + '<div><h1>' + esc(v.name) + '</h1>' +
      '<p class="facts"><span>' + esc(catName(store.catPos.get(v.cat))) + '</span>' + site +

    if (!M.nAgencies) {
      const other = sc.state ? '<p>' + A(hVendor(v, null), 'See it in all states') + '.</p>' : '';
      return [html + '<p>No agency in ' + esc(scopeName(sc)) + ' paid ' + esc(v.name) + ' in a purchasing category.</p>' + other, v.name];
    }
    const s = M.stats;
    html += '<p class="lead">' + plural(M.nAgencies, 'agency', 'agencies') + (M.byState.length > 1 ? ' in ' + M.byState.length + ' states' : ' in ' + esc(scopeName(sc))) +
      ' paid ' + esc(v.name) + ' ' + money(M.paid) + ' in FY' + M.first + (M.last !== M.first ? '–FY' + M.last : '') + '. ' +
      (s ? 'In a fully reported year, an agency typically paid ' + dollars(s.median) + ' (median of ' + plural(s.n, 'agency-year', 'agency-years') +
        (s.n >= 4 ? '; the middle half paid ' + dollars(s.q1) + ' to ' + dollars(s.q3) : '') + ').' : '') +
      (sc.state ? ' ' + A(hVendor(v, null), 'All states') + '.' : '') + '</p>';
    // What for, and where
    html += '<div class="cols"><section><h2>What agencies bought</h2><div class="tw"><table><thead><tr><th scope="col">Category</th>' +
      '<th scope="col" class="num">Agencies</th><th scope="col" class="num">Typical yearly</th><th scope="col" class="num">Paid</th></tr></thead><tbody>' +
      M.byCat.map(c => '<tr><th scope="row">' + A(hCat(c.pos, sc), esc(catName(c.pos))) + '</th><td class="num">' + int(c.agencies) + '</td>' +
        '<td class="num">' + (c.stats ? money(c.stats.median) : '–') + '</td><td class="num">' + money(c.paid) + '</td></tr>').join('') +
      '</tbody></table></div></section>';
    if (!sc.state || M.byState.length > 1) {
      html += '<section><h2>By state</h2><div class="tw"><table><thead><tr><th scope="col">State</th><th scope="col" class="num">Agencies</th>' +
        '<th scope="col" class="num">Share of the state\'s agencies with vendor data</th><th scope="col" class="num">Paid</th></tr></thead><tbody>' +
        M.byState.map(b => '<tr><th scope="row">' + A(hVendor(v, VCore.scope(store, b.state, '')), esc(stName(b.state))) + '</th><td class="num">' + int(b.agencies) + '</td>' +
          '<td class="num">' + pct(b.agencies, b.withData) + ' <span class="muted">of ' + int(b.withData) + '</span></td><td class="num">' + money(b.paid) + '</td></tr>').join('') +
        '</tbody></table></div></section>';
    }
    html += '</div>';
    // The agencies
    const all = !sc.state, forCol = M.byCat.length > 1;
    const rows = M.list.map(r => '<tr data-name="' + esc(r.a.name.toLowerCase()) + '"><td class="ex">' + expBtn(r.ai, vi, r.a.name) + '</td>' +
      '<th scope="row">' + A(hAgency(r.a), esc(r.a.name)) + '</th>' +
      (all ? '<td>' + esc(r.a.state) + '</td>' : '') + '<td>' + esc(r.a.county || '') + '</td>' +

      '<td class="num">' + (r.stats ? money(r.stats.median) : '–') + '</td>' +
      '<td class="num">' + money(r.paid) + '</td></tr>' + detailRow(r.ai, vi, 6 + all + forCol));
    html += '<h2 id="h-ag">Agencies that paid ' + esc(v.name) + '</h2>' +
      '<div class="toolbar"><label for="t-q" class="vh">Find an agency</label><input type="search" id="t-q" placeholder="Find an agency" data-filter="t-ag">' +
      '<span class="tcount" id="t-ag-n"></span></div>' +
      '<div class="tw"><table id="t-ag" data-top="' + TOP + '"><thead><tr><th scope="col"><span class="vh">Details</span></th><th scope="col">Agency</th>' +
      (all ? '<th scope="col">State</th>' : '') + '<th scope="col">County</th>' + (forCol ? '<th scope="col">For</th>' : '') + '<th scope="col" class="num">Fiscal years</th>' +
      '<th scope="col" class="num">Typical yearly</th><th scope="col" class="num">Paid</th></tr></thead><tbody>' + rows.join('') + '</tbody></table></div>' +
      '<div class="more" id="t-ag-more"></div>' +
      '<p class="note">Open a row (▸) for the agency\'s amounts by fiscal year, its single payments to the vendor and any item lines. ' +
      (M.credits ? plural(M.credits, 'more agency has', 'more agencies have') + ' only refunds or credits from this vendor. ' : '') +
      'Typical yearly here: the median of the agency\'s own fully reported years.</p>' + typicalNote;
    // Single payments and item lines, as their files load
    html += '<section id="v-pay"></section><section id="v-items"></section>' +
      '<p class="note">' + A('explore.html#/?g=agency&vendor=' + encodeURIComponent(v.id) + (sc.state ? '&state=' + sc.state : '') + (sc.county ? '&county=' + encodeURIComponent(sc.county) : ''),
        'This vendor in All data') + ': payee names as reported, amounts to the cent, CSV download.</p>';
    const sts = M.byState.map(b => b.state);
    return [html, v.name, () => vendorExtras(sc, vi, sts)];
  }
  function vendorExtras(sc, vi, sts) {
    const box = $('v-pay'), ibox = $('v-items');
    if (!box) return;
    const big = sts.filter(st => store.meta.states[st].bytes_gz.payments > PAY_AUTO);
    const auto = sts.filter(st => !big.includes(st));
    const mask = ai => { const a = store.agency.get(ai); return a && (!sc.state || a.state === sc.state) && (!sc.county || a.county === sc.county); };
    const show = () => {
      if (!$('v-pay')) return;
      const have = sts.filter(st => store.payments[st]);
      const P = VCore.paymentsOf(store, have, { vi, mask }).sort((x, y) => y[4] - x[4]);
      const ask = big.filter(st => !store.payments[st]).map(st => '<button type="button" class="btn" data-loadpay="' + st + '">Load ' + esc(stName(st)) +
        ' payments (' + fileSize(store.meta.states[st].bytes_gz.payments) + ')</button>').join(' ');
      $('v-pay').innerHTML = '<h2>Largest single payments</h2>' +
        (P.length ? payTable(P, true, 'p-v') : '<p class="muted">' + (have.length ? 'No single payments of $1,000 or more' + (ask ? ' in the states loaded' : '') + '.' : '') + '</p>') +
        (ask ? '<p>' + ask + '</p>' : '') +
        '<p class="note">Payments of $1,000 or more in purchasing categories, with the date and description the agency reported.</p>';
    };
    box.innerHTML = '<h2>Largest single payments</h2><p class="muted">Loading payments...</p>';
    tailThen(() => Promise.all(auto.map(loadPayments)).then(show, err => { if ($('v-pay')) $('v-pay').innerHTML = '<p>Payments did not load: ' + esc(err.message) + '</p>'; }));
    box.onclick = e => {
      const b = e.target.closest('[data-loadpay]');
      if (!b) return;
      b.disabled = true;
      b.textContent = 'Loading...';
      loadPayments(b.dataset.loadpay).then(show, err => { b.textContent = 'Did not load: ' + err.message; });
    };
    const ists = sts.filter(st => store.meta.states[st].files.items);
    if (ists.length) {
      tailThen(() => Promise.all(ists.map(loadItems)).then(() => {
        if (!$('v-items')) return;
        const X = VCore.itemsOf(store, ists, { vi, mask }).sort((x, y) => (y[2] || '').localeCompare(x[2] || '') || y[9] - x[9]);
        if (X.length) $('v-items').innerHTML = '<h2>Item lines with unit prices</h2>' + itemTable(X, true, 'i-v') + itemsNote(ists);
      }, err => { if ($('v-items')) $('v-items').innerHTML = '<p>Item lines did not load: ' + esc(err.message) + '</p>'; }));
    }
  }
  const itemsNote = sts => '<p class="note">Item lines are published by ' + sts.map(st => st === 'TX' ? 'Texas DIR (cooperative contract sales, IT and telecom only)' :
    st === 'CA' ? 'California SCPRS (CAL FIRE purchase orders; lines before FY2021 shown with their own year)' : esc(stName(st))).join(' and ') + '.</p>';

  /* ---- #/agency/<id>: an agency's vendors by category ---- */
  function viewAgency(a, raw) {
    if (!a) return notFound('There is no agency ' + esc(raw) + '.');
    const sc = VCore.scope(store, a.state, a.county || '');
    const u = a.usfa || {};
    const people = [u.career ? int(u.career) + ' career' : '', u.volunteer ? int(u.volunteer) + ' volunteer' : '', u.paid_per_call ? int(u.paid_per_call) + ' paid per call' : ''].filter(Boolean);
    const lat = latestBudget(a);
    let html = crumbs(sc, esc(a.name)) + '<h1>' + esc(a.name) + '</h1>' +
      '<p class="facts"><span>' + esc(a.kind || 'Fire agency') + '</span>' + (a.city ? '<span>' + esc(a.city) + '</span>' : '') +
      (a.county ? '<span>' + esc(a.county) + ' County</span>' : '') + '<span>' + esc(stName(a.state)) + '</span>' +
      (a.staffing ? '<span>' + esc(a.staffing) + '</span>' : '') + (u.stations ? '<span>' + plural(u.stations, 'station', 'stations') + '</span>' : '') +
      (people.length ? '<span>' + esc(people.join(', ')) + '</span>' : '') +
      (lat ? '<span>Annual expenses ' + money(lat.amount) + ' (median of FY' + lat.years[0] + (lat.years.length > 1 ? '–FY' + lat.years[lat.years.length - 1] : '') + ')</span>' : '') + '</p>';
    const all = '<p class="note">' + A('explore.html#/?g=vendor&agency=' + encodeURIComponent(a.id), 'This agency in All data') +
      ': payee names as reported, FEMA grants, annual totals and sources.</p>';
    if (!(a.coverage <= 2)) {
      return [html + '<p><strong>No vendor data.</strong> ' + (a.coverage === 3
        ? esc(stName(a.state)) + ' publishes only annual totals for this agency, not the vendors it paid.'
        : 'This agency is in the national fire department registry, but no source publishes its spending.') + '</p>' + all, a.name];
    }
    const ai = store.agPos.get(a.id);
    if (ai == null) return [html + '<p>This agency reported no purchasing payments.</p>' + all, a.name];
    if (!store.tailLoaded) return [html + loadingTail(), a.name, () => tailThen(route)];
    const M = VCore.agencyModel(store, ai);
    html += '<p class="lead">Paid ' + plural(M.vendors, 'vendor', 'vendors') + ' ' + money(M.paid) + ' in ' + esc(span(sc)) + '. ' +
      'These are its vendors by category; the agencies column says how many agencies in all states use each one.' + '</p>' +
      (a.coverage === 2 ? '<p class="note">Only purchases through Texas DIR cooperative contracts (IT and telecom) are published for this agency.</p>' : '');
    const table = sec => {
      let body = '', group = null, any = false;
      for (const s of store.sections.filter(s => s.section === sec)) {
        const c = M.cats.get(s.pos);
        const vs = c.vendors.filter(x => x.pos || Math.abs(x.paid) >= 0.5);
        if (!vs.length) continue;
        any = true;
        if (s.cat.group !== group) { group = s.cat.group; body += '<tr class="grp"><th colspan="7" scope="colgroup">' + esc(group) + '</th></tr>'; }
        vs.forEach((x, k) => {
          const extra = k >= STACK_TOP;
          body += '<tr data-cat="' + s.pos + '"' + (k === 0 ? ' class="cat"' : extra ? ' class="xtra" hidden' : '') + '><td class="ex">' + expBtn(ai, x.v.i, x.v.name) + '</td>' +
            '<th scope="row">' + (k === 0 ? A(hCat(s.pos, sc), esc(catShort(s.pos))) : '') + '</th>' +
            '<td>' + vname(x.v, sc) + '</td>' +
            '<td class="num">' + (x.v.users > 1 ? int(x.v.users) : '<span class="muted">1</span>') + '</td>' +
            '<td class="num">' + yrs(x.first, x.last) + '</td>' +
            '<td class="num">' + (x.stats ? money(x.stats.median) : '–') + '</td><td class="num">' + money(x.paid) + '</td></tr>' + detailRow(ai, x.v.i, 7);
        });
        if (vs.length > STACK_TOP) {
          const rest = vs.slice(STACK_TOP);
          body += '<tr class="sub"><td></td><td></td><td colspan="5"><button type="button" class="btn" data-morecat="' + s.pos + '" aria-expanded="false">' +
            plural(rest.length, 'more vendor', 'more vendors') + ', ' + dollars(rest.reduce((t, x) => t + x.paid, 0)) + '</button></td></tr>';
        }
      }
      return any ? '<div class="tw"><table class="stack"><thead><tr><th scope="col"><span class="vh">Details</span></th><th scope="col">Category</th>' +
        '<th scope="col">Vendor</th><th scope="col" class="num">Agencies using it</th><th scope="col" class="num">Fiscal years</th>' +
        '<th scope="col" class="num">Typical yearly</th><th scope="col" class="num">Paid</th></tr></thead><tbody>' + body + '</tbody></table></div>' : '';
    };
    const fire = table('fire'), other = table('other');
    const otherPaid = store.sections.filter(s => s.section === 'other').reduce((t, s) => t + M.cats.get(s.pos).paid, 0);
    html += '<h2>Fire and EMS vendors</h2>' + (fire || '<p class="muted">None.</p>') +
      (other ? '<details class="other"><summary>Other spending <span class="muted">' + money(otherPaid) + '</span></summary>' + other + '</details>' : '') +
      '<div style="margin-top:18px"><p class="note">Open a row (▸) for the amounts by fiscal year, single payments and any item lines.</p>' +
      typicalNote.replace('one agency paid the vendor', 'the agency paid the vendor') + othersNote(M.others, 'of its spending') + all + '</div>';
    return [html, a.name];
  }
  // Annual expenses: the median of the last three fully reported fiscal years (as the table page)
  function latestBudget(a) {
    const P = store.partial[a.state] || new Set();
    const ys = Object.keys(a.budget || {}).map(Number).filter(y => !P.has(y) && a.budget[y] != null).sort((x, y) => x - y).slice(-3);
    if (!ys.length) return null;
    const v = ys.map(y => a.budget[y]).sort((x, y) => x - y), m = v.length >> 1;
    return { years: ys, amount: v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2 };
  }

  /* ---- #/agencies: agencies of a scope with vendor data ---- */
  function viewAgencies(sc) {
    const L = VCore.agenciesModel(store, sc);
    const all = !sc.state;
    const rows = L.map(o => '<tr data-name="' + esc(o.a.name.toLowerCase()) + '"><th scope="row">' + A(hAgency(o.a), esc(o.a.name)) + '</th>' +
      (all ? '<td>' + esc(o.a.state) + '</td>' : '') + '<td>' + esc(o.a.county || '') + '</td><td>' + esc(o.a.kind || '') + '</td>' +
      '<td><span class="chipsm">' + o.common.map(v => '<a href="' + esc(hVendor(v, sc)) + '" aria-label="' + esc(v.name) + '" title="' + esc(v.name + ' (' + plural(v.users, 'agency', 'agencies') + ')') + '">' + logo(v) + '</a>').join(' ') + '</span></td>' +
      '<td class="num">' + int(o.vendors) + '</td><td class="num">' + money(o.paid) + '</td></tr>');
    const html = crumbs(sc) + '<h1>Agencies' + (sc.state ? ' in ' + esc(scopeName(sc)) : '') + '</h1>' + tabs(sc, 'agencies') +
      '<p class="lead">Agencies with vendor data, by what they paid vendors in ' + esc(span(sc)) + '. Open one for its vendors by category.</p>' +
      '<div class="toolbar"><label for="t-q" class="vh">Find an agency</label><input type="search" id="t-q" placeholder="Find an agency" data-filter="t-ags">' +
      '<span class="tcount" id="t-ags-n"></span></div>' +
      '<div class="tw"><table id="t-ags" data-top="100"><thead><tr><th scope="col">Agency</th>' + (all ? '<th scope="col">State</th>' : '') +
      '<th scope="col">County</th><th scope="col">Kind</th><th scope="col">Common vendors they use</th><th scope="col" class="num">Vendors</th>' +
      '<th scope="col" class="num">Paid</th></tr></thead><tbody>' + rows.join('') + '</tbody></table></div><div class="more" id="t-ags-more"></div>' +
      '<p class="note">Common vendors: the agency\'s fire and EMS vendors that the most agencies use (up to five).</p>' + coverageNote(sc);
    return [html, 'Agencies' + (sc.state ? ' in ' + scopeName(sc) : '')];
  }

  /* ---- Rows that open: an agency's years, payments and item lines with one vendor ---- */
  const expBtn = (ai, vi, label) => '<button type="button" class="exp" aria-expanded="false" data-a="' + ai + '" data-v="' + vi + '" title="Details" aria-label="Details: ' + esc(label) + '">▸</button>';
  const detailRow = (ai, vi, n) => '<tr class="detail" id="d-' + ai + '-' + vi + '" hidden><td colspan="' + n + '"></td></tr>';
  function openDetail(btn) {
    const ai = Number(btn.dataset.a), vi = Number(btn.dataset.v);
    const row = $('d-' + ai + '-' + vi);
    if (!row) return;
    const open = btn.getAttribute('aria-expanded') !== 'true';
    btn.setAttribute('aria-expanded', String(open));
    btn.textContent = open ? '▾' : '▸';
    row.hidden = !open;
    if (!open || row.dataset.done) return;
    row.dataset.done = '1';
    const cell = row.firstElementChild;
    const a = store.ags[ai];
    // Amounts by fiscal year and category
    const lines = (store.byAgency[ai] || []).map(li => store.lines[li]).filter(r => r[1] === vi);
    const years = [...new Set([].concat(...lines.map(r => r.filter((x, k) => k >= 3 && k % 2 === 1))))].sort((x, y) => x - y);
    const P = store.partial[a.state];
    const yearTable = '<div><h4>By fiscal year</h4><table><thead><tr><th scope="col">Category</th>' +
      years.map(y => '<th scope="col" class="num">FY' + y + (P.has(y) ? '*' : '') + '</th>').join('') + '</tr></thead><tbody>' +
      lines.map(r => { const m = new Map(); for (let k = 3; k < r.length; k += 2) m.set(r[k], r[k + 1]); return '<tr><th scope="row">' + esc(catShort(r[2])) + '</th>' +
        years.map(y => '<td class="num">' + (m.has(y) ? money(m.get(y)) : '') + '</td>').join('') + '</tr>'; }).join('') + '</tbody></table>' +
      (years.some(y => P.has(y)) ? '<p class="note">* partly reported year</p>' : '') + '</div>';
    cell.innerHTML = '<div class="dgrid">' + yearTable + '<div class="wide" id="dp-' + ai + '-' + vi + '"><h4>Single payments</h4><p class="muted">Loading payments (' +
      fileSize(store.meta.states[a.state].bytes_gz.payments) + ')...</p></div></div>';
    const box = () => $('dp-' + ai + '-' + vi);
    const st = a.state;
    tailThen(() => Promise.all([loadPayments(st), store.meta.states[st].files.items ? loadItems(st) : null]).then(() => {
      if (!box()) return;
      const Ps = VCore.paymentsOf(store, [st], { vi, agency: a.id }).sort((x, y) => (y[1] || '').localeCompare(x[1] || ''));
      const X = store.meta.states[st].files.items ? VCore.itemsOf(store, [st], { vi, agency: a.id }).sort((x, y) => (y[2] || '').localeCompare(x[2] || '')) : [];
      box().innerHTML = '<h4>Single payments of $1,000 or more</h4>' + (Ps.length ? payTable(Ps, false, 'p-' + ai + '-' + vi) : '<p class="muted">None.</p>') +
        (X.length ? '<h4>Item lines</h4>' + itemTable(X, false, 'i-' + ai + '-' + vi) : '');
    }, err => { if (box()) box().innerHTML = '<p>Payments did not load: ' + esc(err.message) + '</p>'; }));
  }
  function payTable(P, withAgency, id) {
    const catCol = new Set(P.map(p => p[3])).size > 1;
    const rows = P.map(p => '<tr><td class="nw">' + esc(dateText(p[1])) + '</td>' +
      (withAgency ? '<td>' + A(hAgency(store.agency.get(p[0])), esc(store.agency.get(p[0]).name)) + '</td>' : '') +
      (catCol ? '<td>' + esc(catShort(p[3])) + '</td>' : '') + '<td>' + (esc(store.descriptions[p[5]]) || '<span class="muted">No description</span>') + '</td>' +
      '<td class="num">' + cents(p[4]) + '</td></tr>');
    return '<div class="tw"><table id="' + id + '" data-top="' + (withAgency ? 25 : 10) + '"><thead><tr><th scope="col">Date</th>' + (withAgency ? '<th scope="col">Agency</th>' : '') +
      (catCol ? '<th scope="col">Category</th>' : '') + '<th scope="col">Description</th><th scope="col" class="num">Amount</th></tr></thead><tbody>' + rows.join('') + '</tbody></table></div>' +
      '<div class="more" id="' + id + '-more"></div>';
  }
  function itemTable(X, withAgency, id) {
    const s = i => (i >= 0 ? esc(store.istrings[i]) : '');
    const rows = X.map(it => '<tr><td class="nw">' + esc(it[2] ? dateText(it[2]) : 'FY' + it[1]) + '</td>' +
      (withAgency ? '<td>' + A(hAgency(store.agency.get(it[0])), esc(store.agency.get(it[0]).name)) + '</td>' : '') +
      '<td>' + s(it[4]) + '</td><td>' + s(it[5]) + '</td><td>' + s(it[6]) + '</td>' +
      '<td class="num">' + (it[7] != null ? nf.format(it[7]) : '') + '</td><td class="num">' + (it[8] != null ? cents(it[8]) : '') + '</td>' +
      '<td class="num">' + cents(it[9]) + '</td></tr>');
    return '<div class="tw"><table id="' + id + '" data-top="' + (withAgency ? 25 : 10) + '"><thead><tr><th scope="col">Date</th>' + (withAgency ? '<th scope="col">Agency</th>' : '') +
      '<th scope="col">Brand</th><th scope="col">Product type</th><th scope="col">Description</th><th scope="col" class="num">Quantity</th>' +
      '<th scope="col" class="num">Unit price</th><th scope="col" class="num">Amount</th></tr></thead><tbody>' + rows.join('') + '</tbody></table></div>' +
      '<div class="more" id="' + id + '-more"></div>';
  }

  /* ---- Long tables: the first rows, "Show all", and a filter by name ---- */
  function limitTables(root) {
    for (const t of root.querySelectorAll('table[data-top]')) {
      if (t.dataset.lim) continue;
      t.dataset.lim = '1';
      applyLimit(t);
    }
  }
  // Rows of a table body: main rows (with their detail row following, if any)
  const mainRows = t => [...t.tBodies[0].rows].filter(r => !r.classList.contains('detail'));
  function applyLimit(t) {
    const top = Number(t.dataset.top), q = (t.dataset.q || '').trim().toLowerCase(), showAll = t.dataset.all === '1';
    const rows = mainRows(t);
    let shown = 0, match = 0;
    for (const r of rows) {
      const hit = !q || (r.dataset.name || r.textContent.toLowerCase()).includes(q);
      if (hit) match++;
      const vis = hit && (showAll || q || match <= top);
      r.hidden = !vis;
      const d = r.nextElementSibling;
      if (d && d.classList.contains('detail')) d.hidden = !vis || d.previousElementSibling.querySelector('button.exp[aria-expanded=true]') == null;
      if (vis) shown++;
    }
    const more = $(t.id + '-more'), n = $(t.id + '-n');
    if (more) more.innerHTML = !q && !showAll && rows.length > top ? '<button type="button" class="btn" data-showall="' + t.id + '">Show all ' + int(rows.length) + '</button>' : '';
    if (n) n.textContent = q ? int(match) + ' of ' + int(rows.length) : int(rows.length) + ' rows';
  }

  /* ---- Search box ---- */
  let qItems = [], qActive = -1;
  function qRender() {
    const box = $('q-list'), input = $('q');
    const text = input.value;
    if (!store || text.trim().length < 2) { qClose(); return; }
    const R = VCore.search(store, text, 7);
    const sc = current ? current.sc : null;
    qItems = [];
    let html = '';
    if (R.vendors.length) {
      html += '<li class="qh" role="presentation">Vendors</li>';
      for (const v of R.vendors) {
        qItems.push(hVendor(v, sc && !sc.county ? sc : sc && sc.state ? VCore.scope(store, sc.state, '') : null));
        html += '<li role="option" id="q-o' + (qItems.length - 1) + '" data-i="' + (qItems.length - 1) + '">' + logo(v) + '<span>' + esc(v.name) + '</span>' +
          '<span class="qm">' + plural(v.users, 'agency', 'agencies') + '</span></li>';
      }
    }
    if (R.agencies.length) {
      html += '<li class="qh" role="presentation">Agencies</li>';
      for (const a of R.agencies) {
        qItems.push(hAgency(a));
        html += '<li role="option" id="q-o' + (qItems.length - 1) + '" data-i="' + (qItems.length - 1) + '"><span>' + esc(a.name) + '</span>' +
          '<span class="qm">' + esc((a.county ? a.county + ', ' : '') + a.state) + (a.coverage <= 2 ? '' : ' · no vendor data') + '</span></li>';
      }
    }
    if (!html) html = '<li class="qnone" role="presentation">No vendor or agency matches' + (store.tailLoaded ? '' : ' (still loading vendors used by one agency)') + '</li>';
    box.innerHTML = html;
    box.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    qSet(qItems.length ? 0 : -1);
  }
  function qSet(i) {
    qActive = i;
    const box = $('q-list');
    for (const li of box.querySelectorAll('[role=option]')) li.setAttribute('aria-selected', String(Number(li.dataset.i) === i));
    if (i >= 0) { $('q').setAttribute('aria-activedescendant', 'q-o' + i); const el = $('q-o' + i); if (el) el.scrollIntoView({ block: 'nearest' }); }
    else $('q').removeAttribute('aria-activedescendant');
  }
  function qClose() {
    $('q-list').hidden = true;
    $('q').setAttribute('aria-expanded', 'false');
    $('q').removeAttribute('aria-activedescendant');
    qActive = -1;
  }
  function qGo(i) {
    if (i < 0 || i >= qItems.length) return;
    const h = qItems[i];
    qClose();
    $('q').value = '';
    $('q').blur();
    go(h);
  }

  /* ---- Loading ---- */
  const fileSize = n => (n >= 950000 ? (n / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1000)) + ' kB');
  function fetchJson(f) {
    return fetch(f, { cache: 'no-cache' })                     // revalidate, so a new page never runs on old cached data
      .then(r => { if (!r.ok) throw new Error(f + ' returned HTTP ' + r.status); return r.json(); });
  }
  let tailP = null;
  function loadTail() {
    if (!tailP) tailP = store.tailLoaded ? Promise.resolve() : fetchJson(store.tail.file).then(T => VCore.addTail(store, T));
    return tailP;
  }
  const tailThen = fn => loadTail().then(fn, err => {
    tailP = null;
    const box = document.querySelector('.tailwait');
    if (box) box.innerHTML = 'Vendor data did not load: ' + esc(err.message) + '.';
  });
  const loadingTail = () => '<p class="muted tailwait">Loading the vendors used by one agency (' + fileSize(store.tail.bytes_gz) + ')...</p>';
  const payP = {}, itemP = {};
  function loadPayments(st) {
    if (!payP[st]) {
      payP[st] = loadTail().then(() => fetchJson(store.meta.states[st].files.payments)).then(P => VCore.addPayments(store, st, P));
      payP[st].catch(() => { delete payP[st]; });
    }
    return payP[st];
  }
  function loadItems(st) {
    if (!itemP[st]) {
      itemP[st] = loadTail().then(() => fetchJson(store.meta.states[st].files.items)).then(X => VCore.addItems(store, st, X));
      itemP[st].catch(() => { delete itemP[st]; });
    }
    return itemP[st];
  }
  function fail(err) {
    $('page').innerHTML = '<h1>Data did not load</h1><p>Could not load the data' + (err && err.message ? ': ' + esc(err.message) : '') + '.</p>' +
      (location.protocol === 'file:'
        ? '<p>Opening index.html directly from disk does not work, because the browser blocks the data request. ' +
          'From the project folder run <code>python3 -m http.server</code> and open <a href="http://localhost:8000/">http://localhost:8000/</a>.</p>'
        : '');
  }

  /* ---- Events ---- */
  function bind() {
    $('s-state').addEventListener('change', e => setScope(e.target.value, ''));
    $('s-county').addEventListener('change', e => setScope($('s-state').value, e.target.value));
    const q = $('q');
    q.disabled = false;
    q.addEventListener('input', qRender);
    q.addEventListener('focus', () => { if (q.value.trim().length >= 2) qRender(); });
    q.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); if ($('q-list').hidden) qRender(); else qSet(Math.min(qItems.length - 1, qActive + 1)); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); qSet(Math.max(0, qActive - 1)); }
      else if (e.key === 'Enter') { e.preventDefault(); qGo(qActive >= 0 ? qActive : 0); }
      else if (e.key === 'Escape') { qClose(); }
    });
    q.addEventListener('blur', () => setTimeout(qClose, 150));
    $('q-list').addEventListener('mousedown', e => e.preventDefault());
    $('q-list').addEventListener('click', e => { const li = e.target.closest('[role=option]'); if (li) qGo(Number(li.dataset.i)); });
    // Links within the page keep the scroll position of the entry they leave
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href^="#/"]');
      if (a && !e.metaKey && !e.ctrlKey && !e.shiftKey) saveScroll();
    });
    $('page').addEventListener('click', e => {
      const b = e.target.closest('button.exp');
      if (b) { openDetail(b); limitTables($('page')); return; }
      const m = e.target.closest('[data-morecat]');
      if (m) {
        const open = m.getAttribute('aria-expanded') !== 'true';
        m.setAttribute('aria-expanded', String(open));
        for (const r of m.closest('tbody').querySelectorAll('tr.xtra[data-cat="' + m.dataset.morecat + '"]')) {
          r.hidden = !open;
          const d = r.nextElementSibling;
          if (d && d.classList.contains('detail')) d.hidden = !open || r.querySelector('button.exp[aria-expanded=true]') == null;
        }
        if (!m.dataset.label) m.dataset.label = m.textContent;
        m.textContent = open ? 'Show fewer' : m.dataset.label;
        return;
      }
      const s = e.target.closest('[data-showall]');
      if (s) { const t = $(s.dataset.showall); t.dataset.all = '1'; applyLimit(t); }
    });
    $('page').addEventListener('input', e => {
      const f = e.target.dataset.filter;
      if (f && $(f)) { $(f).dataset.q = e.target.value; applyLimit($(f)); }
    });
    // A logo that does not load shows the initials instead
    document.addEventListener('error', e => {
      const img = e.target;
      if (img.tagName !== 'IMG' || !img.dataset.ini) return;
      const span = img.parentNode;
      span.classList.add('mono');
      span.textContent = img.dataset.ini;
    }, true);
    window.addEventListener('hashchange', () => { route(); afterRender(); });
    new MutationObserver(() => limitTables($('page'))).observe($('page'), { childList: true, subtree: true });
  }
  const afterRender = () => limitTables($('page'));

  // Links of the table page made before this page go there before anything loads
  {
    const { parts, params } = parseHash();
    if (isOld(parts, params)) { location.replace('explore.html' + location.hash); return; }
  }
  Promise.all([fetchJson('data/index.json'), fetchJson('data/stack.json')])
    .then(([I, S]) => {
      store = VCore.buildStore(I, S);
      const fetched = store.order.map(st => store.meta.states[st].fetched).filter(Boolean).sort();
      $('asof').textContent = 'Prototype. Data as of ' + dateText(fetched[fetched.length - 1] || store.meta.built) + '.';
      bind();
      route();
      afterRender();
      // The vendors used by one agency: needed for agency pages and the search, loaded after the first view
      if (!store.tailLoaded) setTimeout(() => loadTail().catch(() => {}), 50);
    })
    .catch(fail);
})();
</script>
</body>
</html>

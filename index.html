<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utah Vendor Finances</title>
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Net payments from Utah fire districts and interlocal fire agencies to vendors, by category, FY2021 to FY2026. Source: Transparent Utah.">
<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --fg: #1b1b1b;
  --muted: #595959;
  --rule: #dddddd;
  --rule-strong: #8a8a8a;
  --shade: #f3f3f3;
  --hover: #eaf0f7;
  --accent: #1d4f91;
  --accent-fg: #ffffff;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 16px; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
.skip { position: absolute; left: -9999px; top: 0; }
.skip:focus { left: 16px; top: 8px; background: var(--bg); padding: 4px 8px; z-index: 3; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
p { margin: 6px 0; }
.muted { color: var(--muted); }
.note { font-size: .8125rem; color: var(--muted); max-width: 64em; }

/* Header */
.site { border-bottom: 1px solid var(--rule); }
.hdr { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; padding-top: 7px; padding-bottom: 7px; }
.site-title { margin: 0; font-size: 1.1rem; font-weight: 600; }
.site-title a { color: var(--fg); text-decoration: none; }
.asof { margin: 0; font-size: .85rem; color: var(--muted); }
.hdr .about-link { margin-left: auto; font-size: .9rem; }
.hdr .about-link[aria-current="page"] { color: var(--fg); font-weight: 600; text-decoration: none; }

/* Form controls */
select, input[type=text], input[type=search] {
  font: inherit; font-size: .875rem; color: var(--fg); background: var(--bg);
  border: 1px solid var(--rule-strong); border-radius: 3px; padding: 4px 6px; max-width: 100%;
}
input[type=checkbox] { margin: 0; accent-color: var(--accent); }
.btn {
  font: inherit; font-size: .8125rem; color: var(--fg); background: var(--bg);
  border: 1px solid var(--rule-strong); border-radius: 3px; padding: 3px 10px; cursor: pointer;
}
.btn:hover { background: var(--shade); }
.chk { display: flex; gap: 6px; align-items: flex-start; }
.chk input { margin-top: 3px; flex: none; }

/* Layout. Phones and short windows: the page scrolls as usual. Windows at least 1000px wide and 560px
   tall, or 700px wide and 660px tall (where the filter bar wraps to more rows; see "Fixed layout" below):
   the page fills the window and never scrolls. The header, filter bar and table controls stay in place,
   and only the region with the table (#scroller) scrolls. */
:root { --gut: max(16px, calc((100vw - 1408px) / 2)); }     /* side gutter, lines up with .wrap */
.page, .scroller { padding: 0 var(--gut) 40px; }
.ftoggle { display: none; }
.fwrap { border-bottom: 1px solid var(--rule); }
.top { width: 100%; padding-top: 8px; }   /* full width: auto margins would shrink it in the flex column */

/* Filter bar */
.fbar { font-size: .875rem; }
.flabel, .field > label { font-weight: 600; font-size: .8125rem; }
.field { margin: 0; }
.range { display: flex; align-items: center; gap: 6px; }
.range label { font-size: .8125rem; color: var(--muted); }
.fcount { margin: 0; color: var(--muted); font-size: .8125rem; }
.fmsg { margin: 3px 0 0; font-size: .8125rem; color: var(--muted); }
.fmsg:empty { display: none; }
.fshow { display: none; }
/* Category: a button that opens the checkboxes by group */
.catf { position: relative; }
.dd {
  font: inherit; font-size: .875rem; color: var(--fg); background: var(--bg); text-align: left; white-space: nowrap;
  border: 1px solid var(--rule-strong); border-radius: 3px; padding: 4px 8px; cursor: pointer;
}
.dd:hover, .dd[aria-expanded="true"] { background: var(--shade); }
.dd .car { margin-left: 8px; color: var(--muted); font-size: .75rem; }
.catpop { background: var(--bg); border: 1px solid var(--rule-strong); border-radius: 3px; }
.catpop[hidden] { display: none; }
.cathead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 10px; border-bottom: 1px solid var(--rule); }
.ncat { font-weight: 400; color: var(--muted); }
.catclr { padding: 0 8px; font-size: .75rem; line-height: 20px; }
.catclr:disabled { color: var(--muted); border-color: var(--rule); cursor: default; background: var(--bg); }
.catbox { padding: 0 10px 8px; }
.catcols { column-gap: 24px; }
.cgrp { border: 0; margin: 0; padding: 0; min-width: 0; break-inside: avoid; }
.cgrp > legend { padding: 6px 0 1px; font-size: .75rem; font-weight: 600; color: var(--muted); }
.catbox .chk { padding: 2px 0; font-size: .8125rem; line-height: 1.3; cursor: pointer; }
.catbox .chk input { margin-top: 2px; }
.catcols > .chk { padding-top: 8px; }

/* Group by */
.gbar { display: flex; align-items: center; gap: 10px; }
.gbar-l { font-weight: 600; font-size: .875rem; white-space: nowrap; }
.seg { display: flex; min-width: 0; overflow-x: auto; overflow-y: hidden; padding: 3px; margin: -3px; }
.seg button {
  flex: none; font: inherit; font-size: .875rem; color: var(--fg); background: var(--bg);
  border: 1px solid var(--rule-strong); border-radius: 0; padding: 4px 12px; margin: 0 0 0 -1px;
  cursor: pointer; white-space: nowrap;
}
.seg button:first-child { margin-left: 0; border-radius: 3px 0 0 3px; }
.seg button:last-child { border-radius: 0 3px 3px 0; }
.seg button:hover { background: var(--shade); }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; position: relative; }
.seg button:focus-visible { position: relative; z-index: 1; outline-offset: 1px; }

/* Active filters */
.chipbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 8px; font-size: .8125rem; min-height: 28px; }
.chips-l { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.chip { display: inline-flex; align-items: center; border: 1px solid var(--rule-strong); border-radius: 3px; padding-left: 8px; line-height: 24px; }
.chip button {
  font: inherit; font-size: 1rem; line-height: 1; color: var(--muted); background: none;
  border: 0; border-left: 1px solid var(--rule); margin-left: 8px; padding: 0 7px; height: 24px; cursor: pointer;
}
.chip button:hover { color: var(--fg); background: var(--shade); }
.badnote { flex-basis: 100%; margin: 0; color: var(--muted); }

.summary { margin: 6px 0 0; }

/* Context for the selected category, vendor or agency (above the table), and more for it (below) */
#context { border: 1px solid var(--rule); margin-top: 12px; }
#context:empty { display: none; }
.ctx { padding: 6px 12px; }
.ctx + .ctx { border-top: 1px solid var(--rule); }
.ctxline { font-size: .875rem; }
.ctxline h2 { display: inline; font-size: .9375rem; font-weight: 600; margin: 0; }
.sep { color: var(--muted); }
.ctx p { margin: 3px 0; }
.ctx details { margin-top: 2px; }
details > summary { cursor: pointer; font-size: .875rem; font-weight: 600; padding: 2px 0; }
.dbody { padding: 2px 0 8px; }
#more:empty { display: none; }
#more { margin-top: 24px; border-top: 1px solid var(--rule-strong); padding-top: 8px; }
#more h2 { font-size: 1rem; font-weight: 600; margin: 0 0 6px; }
#more details { border-bottom: 1px solid var(--rule); padding: 4px 0; }
dl.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 2px 20px; margin: 6px 0; font-size: .875rem; }
dl.facts > div { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 8px; min-width: 0; }
dl.facts > div.full { grid-column: 1 / -1; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
ul.plain { margin: 4px 0; padding-left: 18px; font-size: .875rem; columns: 2 18em; }

/* Table toolbar */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 8px 0; font-size: .875rem; }
.tsearch { display: flex; align-items: center; gap: 6px; }
.tsearch label { font-weight: 600; }
.tsearch input { width: 18em; }
.tcount { margin-left: auto; color: var(--muted); }
.hint { margin: 0 0 6px; font-size: .8125rem; color: var(--muted); }

/* Tables */
.tbl { margin-top: 10px; }
.thead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; margin-bottom: 4px; }
.thead h3 { font-size: .875rem; font-weight: 600; margin: 0; }
.tw { overflow-x: auto; overflow-y: hidden; }
table { border-collapse: collapse; font-size: .875rem; }
.tbl.wide table { width: 100%; }
th, td { padding: 5px 10px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; overflow-wrap: break-word; }
thead th {
  background: var(--shade); border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule-strong);
  font-weight: 600; vertical-align: bottom; overflow-wrap: normal;
}
tbody th { font-weight: 400; min-width: 10em; }
#tbl-main tbody th { min-width: 14em; }
/* Amounts by year: a compact grid, so the year columns fit beside the name */
#tbl-main.by-year table { font-size: .8125rem; }
#tbl-main.by-year th, #tbl-main.by-year td { padding: 5px 6px; }
#tbl-main.by-year tbody th { min-width: 10em; }
/* First column stays in view when a table scrolls sideways */
.tw tr > :first-child { position: sticky; left: 0; z-index: 1; background: var(--bg); }
.tw thead tr > :first-child { background: var(--shade); }
.nw { white-space: nowrap; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; overflow-wrap: normal; }
thead th.num { white-space: normal; }
tfoot th, tfoot td { border-top: 1px solid var(--rule-strong); border-bottom: 0; font-weight: 600; }
tr.dr { cursor: pointer; }
.tw tr.dr:hover > *, .tw tr.dr:focus-within > * { background: var(--hover); }
/* Row drill-down: plain text with a chevron, not a link */
button.drill {
  font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0;
  text-align: left; cursor: pointer;
}
.chev { margin-left: 5px; color: var(--accent); font-weight: 600; }
button.sort {
  background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit;
  cursor: pointer; text-align: inherit;
}
button.sort:hover { text-decoration: underline; }
.sarr { color: var(--muted); }
.more { margin: 8px 0; font-size: .8125rem; }
.empty { color: var(--muted); }

/* About */
.prose { max-width: 46em; padding-top: 14px; }
.prose h1 { font-size: 1.35rem; font-weight: 600; margin: 4px 0 6px; }
.prose h2 { font-size: 1.05rem; font-weight: 600; margin: 26px 0 6px; }
.prose li { margin: 3px 0; }

/* Filter bar: one row of labelled controls that wraps */
@media (min-width: 700px) {
  .fbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 7px 0 8px; }
  .fbar .field, .fbar .range { display: flex; align-items: center; gap: 6px; }
  .flabel, .fbar .field > label { white-space: nowrap; }
  #f-vendor { width: 13em; }
  #f-agency { width: 14em; }
  .catf .dd { min-width: 12.5em; display: flex; justify-content: space-between; align-items: center; }   /* same width for All and "2 selected" */
  .chipbar [data-clear] { display: none; }        /* the filter bar's Clear all filters is right above */
  /* Chips wrap beside the label, not under it; the label lines up with the first line of chips */
  .chipbar { align-items: flex-start; }
  .chips-l { line-height: 26px; }
  .chips { flex: 1 1 0; min-width: 0; }
  .vendf { position: relative; }
  /* The vendor message shows under the box, over the content below, until the next click or change */
  .vendf .fmsg {
    position: absolute; left: 0; top: calc(100% + 3px); z-index: 20; margin: 0; padding: 3px 8px; white-space: nowrap;
    color: var(--fg); background: var(--bg); border: 1px solid var(--rule-strong); border-radius: 3px;
  }
  /* Category popover: the header row stays, the list scrolls when the window is too short for it */
  .catpop {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 20; display: flex; flex-direction: column;
    width: 36em; max-width: calc(100vw - 32px); max-height: 70vh; box-shadow: 0 6px 18px rgba(0, 0, 0, .18);
  }
  .catpop[hidden] { display: none; }
  .cathead { flex: none; }
  .catbox { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .catcols { columns: 2 15em; }
}
@media (min-width: 700px) and (max-width: 1199px) {
  th, td { padding: 5px 7px; }
  #tbl-main tbody th { min-width: 11em; }
}

/* Fixed layout: the page does not scroll. The table region scrolls in both directions, so its header
   row can stay at the top while the first column stays at the left. Everything in the region except the
   main table keeps the region's width and stays in place when the table is scrolled sideways. */
@media (min-width: 1000px) and (min-height: 560px), (min-width: 700px) and (min-height: 660px) {
  html { overflow: hidden; }
  body { height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
  .site, .fwrap, .top { flex: none; }
  main, .explore, .area { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .explore[hidden] { display: none; }
  .page, .scroller { flex: 1 1 auto; min-height: 0; padding-bottom: 24px; }
  .page { overflow-y: auto; scrollbar-gutter: stable; }
  .page[hidden] { display: none; }
  /* A classic scrollbar keeps its own gutter, so 100cqi below is the width beside it, not under it */
  .scroller { overflow: auto; scrollbar-gutter: stable; container-type: inline-size; border-top: 1px solid var(--rule); }
  .sc-in { width: fit-content; min-width: 100%; }
  /* Sticky insets count from the region's content edge, inside its padding (the gutter) */
  .sc-in > *, #tbl-main > *, .tmain > * { position: sticky; left: 0; width: 100cqi; }
  .sc-in > #tbl-main, #tbl-main > .tmain, .tmain > .tw { position: static; width: auto; }
  #tbl-main .tw { overflow: visible; }
  /* Separate borders, so the borders of the sticky cells move with them */
  #tbl-main table { border-collapse: separate; border-spacing: 0; }
  #tbl-main tbody tr:last-child > * { border-bottom: 0; }
  #tbl-main thead th { position: sticky; top: 0; z-index: 2; }
  #tbl-main .tw thead tr > :first-child { z-index: 3; }
  /* Covers the gutter left of the first column, where the table passes when scrolled sideways */
  #tbl-main .tw tr > :first-child::before {
    content: ""; position: absolute; top: 0; bottom: -1px; right: 100%; width: var(--gut); background: var(--bg); pointer-events: none;
  }
}

/* Phones: the filters fold away behind a Filters button and stack */
@media (max-width: 699px) {
  .fwrap { border-bottom: 0; }
  .ftoggle { display: inline-block; margin-top: 12px; min-height: 40px; }
  .fbar { display: none; border: 1px solid var(--rule); padding: 10px 12px; margin-top: 8px; }
  .fbar.open { display: block; }
  .fbar .field, .fbar .npf { margin: 0 0 12px; }
  .flabel, .fbar .field > label { display: block; margin: 0 0 3px; }
  .fbar select, .fbar input[type=text], .dd { width: 100%; min-height: 40px; }
  .range select { flex: 1 1 0; min-width: 0; }
  .dd { display: flex; justify-content: space-between; align-items: center; }
  .catpop { margin-top: 6px; }
  .catclr { min-height: 36px; padding: 0 12px; }
  .catbox .chk { padding: 7px 0; }
  .catbox .chk input { margin-top: 1px; width: 18px; height: 18px; }
  #f-clear { min-height: 40px; }
  .fcount { margin: 10px 0 0; }
  .fshow { display: block; width: 100%; min-height: 40px; margin-top: 12px; }
  .top { padding-top: 12px; }
  .seg button { min-height: 40px; }
  .chip button { min-height: 36px; min-width: 36px; }
  button.sort { display: block; width: 100%; }
  thead th:has(> button.sort) { padding: 0; }
  thead th > button.sort { padding: 9px 10px; }
  .tsearch { flex: 1 1 100%; }
  .tsearch input { flex: 1; width: auto; min-width: 0; }
  .tcount { margin-left: 0; }
}
@media (max-width: 640px) {
  body { font-size: 14px; }
  table { font-size: .8125rem; }
  th, td { padding: 4px 5px; }
  thead th > button.sort { padding: 9px 5px; }
  tbody th, #tbl-main tbody th { min-width: 7em; }
  .opt { display: none; }
  dl.facts > div { grid-template-columns: 8.5em minmax(0, 1fr); gap: 6px; }
  .gbar { align-items: flex-start; gap: 8px; }
  .gbar-l { line-height: 40px; }
  .seg { flex-wrap: wrap; gap: 4px; overflow: visible; margin: 0; padding: 0; }
  .seg button, .seg button:first-child, .seg button:last-child { margin: 0; border-radius: 3px; }
}
</style>
</head>
<body>
<a class="skip" href="#/" id="skip">Skip to table</a>
<header class="site">
  <div class="wrap hdr">
    <p class="site-title"><a href="#/" id="home-link">Utah fire agency vendor payments</a></p>
    <p class="asof" id="asof"></p>
    <a href="#/about" id="about-link" class="about-link">About</a>
  </div>
</header>

<main id="main" tabindex="-1">
  <div id="page" class="page" tabindex="-1"><p>Loading data...</p></div>
  <div id="explore" class="explore" hidden>
    <h1 class="vh" id="page-h">Payments by category</h1>
    <div class="fwrap">
      <div class="wrap">
        <button type="button" class="btn ftoggle" id="ftoggle" aria-expanded="false" aria-controls="fpanel">Filters</button>
        <section class="fbar" id="fpanel" aria-labelledby="fp-h">
          <h2 class="vh" id="fp-h">Filters</h2>
          <div class="field" role="group" aria-labelledby="f-yrs-l">
            <span class="flabel" id="f-yrs-l">Fiscal years</span>
            <span class="range">
              <label for="f-from" class="vh">From</label><select id="f-from"></select>
              <label for="f-to">to</label><select id="f-to"></select>
            </span>
          </div>
          <div class="field catf" id="f-cat-wrap">
            <button type="button" class="dd" id="f-cat-btn" aria-expanded="false" aria-controls="f-cat-pop"><span id="f-cat-txt">Category: All</span><span class="car" aria-hidden="true">▼</span></button>
            <div class="catpop" id="f-cat-pop" role="group" aria-labelledby="f-cat-l" tabindex="-1" hidden>
              <div class="cathead">
                <span class="flabel" id="f-cat-l">Category <span class="ncat" id="f-cat-n"></span></span>
                <button type="button" class="btn catclr" id="f-cat-clear" aria-label="Clear categories" disabled>Clear</button>
              </div>
              <div class="catbox" id="f-cat-box"></div>
            </div>
          </div>
          <div class="field vendf">
            <label for="f-vendor">Vendor</label>
            <input type="text" id="f-vendor" list="vendor-list" autocomplete="off" spellcheck="false" placeholder="Pick a vendor" aria-describedby="f-vendor-msg">
            <datalist id="vendor-list"></datalist>
            <p class="fmsg" id="f-vendor-msg" aria-live="polite"></p>
          </div>
          <div class="field"><label for="f-agency">Agency</label><select id="f-agency"></select></div>
          <div class="field"><label for="f-county">County</label><select id="f-county"></select></div>
          <div class="field"><label for="f-size">Annual expenses</label><select id="f-size" aria-describedby="f-size-desc"></select><span id="f-size-desc" class="vh">Total expenses in the latest fully reported fiscal year</span></div>
          <p class="fcount" id="f-count"></p><span class="vh" id="f-live" aria-live="polite"></span>
          <div class="chk npf"><input type="checkbox" id="f-np"><label for="f-np">Include non-purchasing payments</label></div>
          <button type="button" class="btn" id="f-clear">Clear all filters</button>
          <button type="button" class="btn fshow" id="fshow">Show rows</button>
        </section>
      </div>
    </div>
    <div class="area" id="area">
      <div class="wrap top">
        <div class="gbar">
          <span class="gbar-l" id="gb-l">Group by</span>
          <div class="seg" role="group" aria-labelledby="gb-l">
            <button type="button" id="gb-category" data-g="category" aria-pressed="true">Category</button>
            <button type="button" id="gb-vendor" data-g="vendor" aria-pressed="false">Vendor</button>
            <button type="button" id="gb-agency" data-g="agency" aria-pressed="false">Agency</button>
            <button type="button" id="gb-year" data-g="year" aria-pressed="false">Fiscal year</button>
            <button type="button" id="gb-none" data-g="none" aria-pressed="false">Yearly totals</button>
          </div>
        </div>
        <div class="chipbar" id="chips"></div>
        <p class="summary" id="summary" tabindex="-1"></p>
        <div class="toolbar" id="tbar"></div>
      </div>
      <div class="scroller" id="scroller" tabindex="-1">
        <div class="sc-in">
          <div id="context"></div>
          <section class="tbl wide" id="tbl-main" aria-labelledby="page-h"></section>
          <div id="more"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
'use strict';

/* ==========================================================================
   Core: indexing, aggregation and interface state. No DOM access, so it also
   runs in node (see the test script). Every number on the page comes from here.
   ========================================================================== */
const Core = (function () {
  // Size by total expenses in the latest fully reported fiscal year (lo inclusive, hi exclusive)
  const SIZES = [
    { id: 'under-1m', label: 'Under $1M', lo: -Infinity, hi: 1e6 },
    { id: '1m-5m', label: '$1M–$5M', lo: 1e6, hi: 5e6 },
    { id: '5m-20m', label: '$5M–$20M', lo: 5e6, hi: 2e7 },
    { id: 'over-20m', label: 'Over $20M', lo: 2e7, hi: Infinity },
  ];

  // Some payee names arrive with HTML entities in them (e.g. "&amp;"). Show them as text.
  const ENT = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", '#39': "'" };
  const decodeEntities = s => (typeof s === 'string' && s.indexOf('&') >= 0
    ? s.replace(/&(amp|lt|gt|quot|apos|#39);/g, (m, e) => ENT[e]) : s);

  // Build lookup tables once after load.
  function buildIndex(D) {
    const meta = D.meta;
    for (const v of D.vendors) v.name = decodeEntities(v.name);
    D.aliases = D.aliases.map(decodeEntities);
    D.payments = D.payments || [];
    const years = meta.years.slice().sort((a, b) => a - b);
    const partial = new Set(meta.partial_years || []);
    const cat = new Map();
    const groups = [];
    D.categories.forEach((c, i) => {
      cat.set(c.id, Object.assign({ pos: i }, c));
      if (!groups.includes(c.group)) groups.push(c.group);
    });
    const vcat = D.vendors.map(v => v.category);              // category id by vendor index
    const vendorPos = new Map(D.vendors.map((v, i) => [v.id, i]));
    const agency = new Map(D.agencies.map(a => [a.id, a]));
    const latest = new Map();                                  // agency id -> {year, amount}
    for (const a of D.agencies) {
      const ys = Object.keys(a.budget || {}).map(Number).filter(y => !partial.has(y));
      if (ys.length) {
        const y = Math.max(...ys);
        latest.set(a.id, { year: y, amount: a.budget[y] });
      }
    }
    const grantsBy = new Map();                                // agency id -> FEMA grants
    for (const g of D.grants) {
      if (!grantsBy.has(g.agency)) grantsBy.set(g.agency, []);
      grantsBy.get(g.agency).push(g);
    }
    // Lowercase name plus every reported payee name, for search
    const vendorText = D.vendors.map(v => [v.name].concat(v.aliases.map(i => D.aliases[i])).join('\n').toLowerCase());
    const counties = [...new Set(D.agencies.map(a => a.county).filter(Boolean))].sort();
    // Category search terms ("air pack; breathing apparatus" -> ["air pack", "breathing apparatus"])
    const catTerms = new Map(D.categories.map(c => [c.id, (c.terms || '').split(';').map(s => s.trim()).filter(Boolean)]));
    return { D, meta, years, partial, cat, groups, vcat, vendorPos, agency, latest, grantsBy, vendorText, counties, catTerms };
  }

  // Global filters from URL parameters (strings). Unknown values fall back to defaults.
  function normGlobal(ix, p) {
    const ys = ix.years;
    let from = Number(p.from), to = Number(p.to);
    if (!ys.includes(from)) from = ys[0];
    if (!ys.includes(to)) to = ys[ys.length - 1];
    if (from > to) [from, to] = [to, from];
    return {
      from, to,
      county: ix.counties.includes(p.county) ? p.county : '',
      size: SIZES.some(z => z.id === p.size) ? p.size : '',
      np: p.np === '1',
    };
  }

  // Agencies that pass the county and annual expenses filters.
  function peerIds(ix, g) {
    const z = SIZES.find(x => x.id === g.size);
    const out = new Set();
    for (const a of ix.D.agencies) {
      if (g.county && a.county !== g.county) continue;
      if (z) {
        const l = ix.latest.get(a.id);
        if (!l || l.amount < z.lo || l.amount >= z.hi) continue;
      }
      out.add(a.id);
    }
    return out;
  }

  // The category of a payment row, r = [agency id, vendor index, fiscal year, net amount, alias index],
  // and of a single payment, p = [agency id, fiscal year, rank, vendor index, amount, alias index].
  // Both take their vendor's category for now. Everything that filters or groups by category
  // looks the category up here.
  const rowCat = (ix, r) => ix.vcat[r[1]];
  const payCat = (ix, p) => ix.vcat[p[3]];

  // Which categories pass global filters g and row filters f: {category id: true|false}.
  // f.cat is one category id or a list of them; a category passes when it is any of them.
  // Non-purchasing categories are left out unless g.np is set or the filter names a
  // category, group, purchasing flag or vendor explicitly.
  function catFilter(ix, g, f) {
    f = f || {};
    const cats = f.cat == null ? null : new Set([].concat(f.cat));
    const onlyPurch = !g.np && cats == null && f.group == null && f.purch == null && f.vendor == null;
    const ok = {};
    for (const [id, c] of ix.cat) {
      ok[id] = (cats == null || cats.has(id)) &&
        (f.group == null || c.group === f.group) &&
        (f.purch == null || c.purchasing === f.purch) &&
        (!onlyPurch || c.purchasing === 'yes');
    }
    return ok;
  }

  // Rows matching global filters g and row filters f = {cat, group, purch, vendor, agency, year}.
  //  - f.agency selects one agency and ignores the peer filters.
  //  - f.year selects one fiscal year and overrides the from/to range.
  //  - Categories as in catFilter.
  function selectRows(ix, g, f) {
    f = f || {};
    const y0 = f.year != null ? f.year : g.from;
    const y1 = f.year != null ? f.year : g.to;
    const peers = f.agency != null ? null : peerIds(ix, g);
    let vi = null;
    if (f.vendor != null) vi = ix.vendorPos.has(f.vendor) ? ix.vendorPos.get(f.vendor) : -2;
    const okCat = catFilter(ix, g, f);
    const out = [];
    for (const r of ix.D.rows) {
      if (r[2] < y0 || r[2] > y1) continue;
      if (vi != null && r[1] !== vi) continue;
      if (f.agency != null ? r[0] !== f.agency : !peers.has(r[0])) continue;
      if (!okCat[rowCat(ix, r)]) continue;
      out.push(r);
    }
    return out;
  }
  // Categories a vendor's rows are in (all years and agencies), in category order.
  function vendorCats(ix, vendorId) {
    const vi = ix.vendorPos.get(vendorId);
    const s = new Set();
    for (const r of ix.D.rows) if (r[1] === vi) s.add(rowCat(ix, r));
    return [...s].sort((a, b) => ix.cat.get(a).pos - ix.cat.get(b).pos);
  }

  function emptyAgg(key) {
    return { key, spend: 0, n: 0, ag: new Set(), ve: new Set(), yr: {}, last: null };
  }

  // Group rows by keyFn: net spend, row count, spend per year, and who paid whom.
  // An agency paid a vendor in a fiscal year when the net of its rows for that agency, vendor
  // and year (all payee names) is positive. Agencies (ag), vendors (ve) and the last year paid
  // come from those agency-vendor-years only, so an agency with nothing but refunds or credits
  // from a vendor is in the spend but not in the counts.
  function agg(rows, keyFn) {
    const m = new Map();
    const net = new Map();                                   // group key -> agency|vendor|year -> net
    for (const r of rows) {
      const k = keyFn(r);
      let o = m.get(k);
      if (!o) { m.set(k, (o = emptyAgg(k))); net.set(k, new Map()); }
      o.spend += r[3];
      o.n++;
      o.yr[r[2]] = (o.yr[r[2]] || 0) + r[3];
      const nm = net.get(k), nk = r[0] + '|' + r[1] + '|' + r[2];
      nm.set(nk, (nm.get(nk) || 0) + r[3]);
    }
    for (const [k, nm] of net) {
      const o = m.get(k);
      for (const [nk, v] of nm) {
        if (!(v > 0.005)) continue;                          // positive to the cent
        const [a, ve, y] = nk.split('|').map(Number);
        o.ag.add(a);
        o.ve.add(ve);
        if (o.last == null || y > o.last) o.last = y;
      }
    }
    return m;
  }

  // Totals over all given rows.
  function summary(rows) {
    return agg(rows, () => 0).get(0) || emptyAgg(0);
  }

  // FEMA grant dollars for one agency with a federal fiscal year in the selected range.
  function grantsIn(ix, id, g) {
    let s = 0;
    for (const x of ix.grantsBy.get(id) || []) if (x.year >= g.from && x.year <= g.to) s += x.amount;
    return s;
  }

  // Single payments matching global filters g and f = {cat, group, purch, vendor, agency, year}, with the same
  // rules as selectRows. A payment is [agency id, fiscal year, rank, vendor index, amount, alias index], taken
  // from each agency's 100 largest payments per fiscal year (purchasing vendors, $1,000 or more only).
  function selectPayments(ix, g, f) {
    f = f || {};
    const y0 = f.year != null ? f.year : g.from;
    const y1 = f.year != null ? f.year : g.to;
    const peers = f.agency != null ? null : peerIds(ix, g);
    let vi = null;
    if (f.vendor != null) vi = ix.vendorPos.has(f.vendor) ? ix.vendorPos.get(f.vendor) : -2;
    const okCat = catFilter(ix, g, f);
    const out = [];
    for (const p of ix.D.payments) {
      if (p[1] < y0 || p[1] > y1) continue;
      if (vi != null && p[3] !== vi) continue;
      if (!okCat[payCat(ix, p)]) continue;
      if (f.agency != null ? p[0] !== f.agency : !peers.has(p[0])) continue;
      out.push(p);
    }
    return out;
  }
  function paymentsModel(ix, g, f) {
    const pays = selectPayments(ix, g, f);
    let total = 0;
    const ag = new Set(), ve = new Set();
    for (const p of pays) { total += p[4]; ag.add(p[0]); ve.add(p[3]); }
    return { pays, n: pays.length, total, ag, ve };
  }

  // Latest of the given fiscal years that is fully reported, or the latest one when all are partial.
  function fullYear(ix, years) {
    const ys = years.slice().sort((a, b) => a - b);
    const full = ys.filter(y => !ix.partial.has(y));
    return full.length ? full[full.length - 1] : ys.length ? ys[ys.length - 1] : null;
  }
  const rangeYears = g => { const out = []; for (let y = g.from; y <= g.to; y++) out.push(y); return out; };

  // Compensation by fiscal year in the range, and job titles for the latest full year in the range with data.
  function staffModel(ix, id, g) {
    const st = (ix.agency.get(id) || {}).staff || {};
    const rows = rangeYears(g).filter(y => st[y]).map(y => ({
      y, people: st[y].people, wages: st[y].wages, benefits: st[y].benefits, total: st[y].wages + st[y].benefits,
    }));
    const titleYear = fullYear(ix, rows.map(r => r.y));
    const titles = titleYear == null ? [] : Object.entries(st[titleYear].titles || {}).map(([title, n]) => ({ title, n }));
    return { rows, titleYear, titles, any: Object.keys(st).length > 0 };
  }

  // Revenue by the agency's own categories, one value per fiscal year in the range. Rows named in
  // revenue_excluded (borrowing, transfers between own funds, donated infrastructure) are listed but
  // left out of the totals.
  function revenueModel(ix, id, g) {
    const a = ix.agency.get(id) || {};
    const rv = a.revenue || {};
    const out = new Set(a.revenue_excluded || []);
    const years = rangeYears(g);
    const m = new Map(), yr = {};
    let total = 0;
    for (const y of years) {
      if (!rv[y]) continue;
      yr[y] = 0;
      for (const [k, v] of Object.entries(rv[y])) {
        let o = m.get(k);
        if (!o) m.set(k, (o = { key: k, yr: {}, total: 0, excluded: out.has(k) }));
        o.yr[y] = v;
        o.total += v;
        if (o.excluded) continue;
        yr[y] += v;
        total += v;
      }
    }
    const rows = [...m.values()];
    return { years, rows, yr, total, anyExcluded: rows.some(o => o.excluded), any: Object.keys(rv).length > 0 };
  }
  function peopleIn(ix, id, y) {
    const s = ((ix.agency.get(id) || {}).staff || {})[y];
    return s ? s.people : null;
  }
  function revenueIn(ix, id, y) {
    const t = ((ix.agency.get(id) || {}).revenue_total || {})[y];
    return t == null ? null : t;
  }
  // Agencies by the month their fiscal year starts: {January: n, July: n, '': n (not reported)}
  function fyStarts(ix) {
    const out = {};
    for (const a of ix.D.agencies) out[a.fy_start || ''] = (out[a.fy_start || ''] || 0) + 1;
    return out;
  }

  // Search: matches at word starts ("pack" finds "air pack", "ack" does not). Null below 2 characters.
  function searchRe(raw) {
    const q = (raw || '').trim().toLowerCase();
    if (q.length < 2) return null;
    const qe = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return new RegExp(/^[a-z0-9]/.test(q) ? '(^|[^a-z0-9])' + qe : qe);
  }
  // Categories matching by name, id or search term; term is set when only a search term matched.
  function searchCategories(ix, re) {
    const hit = s => !!s && re.test(s.toLowerCase());
    const out = [];
    for (const c of ix.D.categories) {
      if (hit(c.name) || hit(c.id.replace(/-/g, ' '))) out.push({ id: c.id, term: null });
      else {
        const t = ix.catTerms.get(c.id).find(hit);
        if (t) out.push({ id: c.id, term: t });
      }
    }
    return out;
  }

  // Older per-page view models, no longer used by the page; kept for the node tests ----------
  function homeModel(ix, g) {
    const rows = selectRows(ix, g, {});
    const catOf = r => ix.cat.get(rowCat(ix, r));
    return {
      peers: peerIds(ix, g),
      rows,
      cats: ix.D.categories.filter(c => g.np || c.purchasing === 'yes'),
      byCat: agg(rows, r => rowCat(ix, r)),
      byGroup: agg(rows, r => catOf(r).group),
      purch: summary(rows.filter(r => catOf(r).purchasing === 'yes')),
      all: summary(rows),
    };
  }
  function categoryModel(ix, g, id) {
    const rows = selectRows(ix, g, { cat: id });
    return {
      peers: peerIds(ix, g), rows, sum: summary(rows),
      byVendor: agg(rows, r => r[1]), byAgency: agg(rows, r => r[0]),
      byPair: agg(rows, r => r[0] + ':' + r[1]),
    };
  }
  function vendorModel(ix, g, vendorId) {
    const rows = selectRows(ix, g, { vendor: vendorId });
    return { peers: peerIds(ix, g), rows, sum: summary(rows), byAgency: agg(rows, r => r[0]) };
  }
  function agencyModel(ix, g, agencyId) {
    const rows = selectRows(ix, g, { agency: agencyId });
    return {
      peers: peerIds(ix, g), rows, sum: summary(rows),
      byVendor: agg(rows, r => r[1]), byCat: agg(rows, r => rowCat(ix, r)),
    };
  }
  function vendorsModel(ix, g) {
    const rows = selectRows(ix, g, {});
    return { peers: peerIds(ix, g), rows, sum: summary(rows), byVendor: agg(rows, r => r[1]) };
  }
  function agenciesModel(ix, g) {
    const rows = selectRows(ix, g, {});
    // year: latest fully reported year in the range, for the people paid and revenue columns
    return { peers: peerIds(ix, g), rows, byAgency: agg(rows, r => r[0]), year: fullYear(ix, rangeYears(g)) };
  }
  function rowsModel(ix, g, f) {
    const rows = selectRows(ix, g, f);
    return { rows, sum: summary(rows) };
  }

  // Interface state ------------------------------------------------------------
  // One table, grouped by g, with global filters (normGlobal) plus row filters.
  // State lives in the URL: #/?g=vendor&cat=apparatus,scba&agency=679&from=2022&to=2024&county=..
  //   &size=..&np=1&q=search&years=1. cat is one or more category ids, separated by commas; in the
  //   state it is null or a list in category order. year=Y is read as from=Y&to=Y. group and purch
  //   are kept from older links (category group; purchasing flag). type and staff (agency type and
  //   staffing filters, since removed) are ignored.
  const GROUPS = ['category', 'vendor', 'agency', 'year', 'none'];

  // Category ids (a list, or text separated by commas) -> {ids: known ids in category order, bad: unknown ones}
  function parseCats(ix, v) {
    const ids = [], bad = [];
    for (const raw of Array.isArray(v) ? v : String(v == null ? '' : v).split(',')) {
      const id = String(raw).trim();
      if (!id) continue;
      if (!ix.cat.has(id)) { if (!bad.includes(id)) bad.push(id); } else if (!ids.includes(id)) ids.push(id);
    }
    ids.sort((a, b) => ix.cat.get(a).pos - ix.cat.get(b).pos);
    return { ids, bad };
  }

  // URL parameters (strings) -> state. Ids that do not match the data are dropped and listed in bad.
  function normState(ix, p) {
    p = p || {};
    const bad = [];
    const gp = Object.assign({}, p);
    const has = k => p[k] != null && p[k] !== '';
    if (has('year')) {
      const y = Number(p.year);
      if (ix.years.includes(y)) { gp.from = y; gp.to = y; } else bad.push('fiscal year "' + p.year + '"');
    }
    const s = normGlobal(ix, gp);
    s.g = GROUPS.includes(p.g) ? p.g : 'category';
    const take = (k, label, ok, val) => {
      s[k] = null;
      if (!has(k)) return;
      if (ok) s[k] = val; else bad.push(label + ' "' + p[k] + '"');
    };
    const pc = parseCats(ix, p.cat);
    s.cat = pc.ids.length ? pc.ids : null;
    for (const id of pc.bad) bad.push('category "' + id + '"');
    take('group', 'category group', ix.groups.includes(p.group), p.group);
    take('purch', 'purchasing flag', p.purch === 'yes' || p.purch === 'no', p.purch);
    take('vendor', 'vendor', ix.vendorPos.has(p.vendor), p.vendor);
    const ag = Number(p.agency);
    take('agency', 'agency', /^\d+$/.test(String(p.agency)) && ix.agency.has(ag), ag);
    // Category and vendor together are an intersection (it can be empty). The category group and
    // purchasing flag from older links are dropped when they contradict the vendor's category, or
    // every selected category.
    const vi = s.vendor != null ? ix.vendorPos.get(s.vendor) : null;
    const vc = vi != null ? ix.cat.get(ix.vcat[vi]) : null;
    const fcs = vc ? [vc] : s.cat ? s.cat.map(id => ix.cat.get(id)) : [];
    const who = vc ? ix.D.vendors[vi].name : fcs.length === 1 ? fcs[0].name : 'the selected categories';
    if (fcs.length && s.group != null && !fcs.some(c => c.group === s.group)) {
      bad.push('category group "' + p.group + '" (' + who + (fcs.length === 1 ? ' is in ' + fcs[0].group : ' are not in it') + ')');
      s.group = null;
    }
    if (fcs.length && s.purch != null && !fcs.some(c => c.purchasing === s.purch)) {
      bad.push('purchasing flag "' + p.purch + '" (' + who + (fcs.length === 1 ? (fcs[0].purchasing === 'yes' ? ' is' : ' is not') : (s.purch === 'yes' ? ' are not' : ' are')) + ' purchasing)');
      s.purch = null;
    }
    if (s.purch === 'yes') { s.purch = null; s.np = false; }   // purchasing only is the default
    s.q = s.g !== 'year' && typeof p.q === 'string' ? p.q : '';
    s.years = p.years === '1';
    s.bad = bad;
    return s;
  }
  // State -> URL parameters, in a fixed order, leaving out defaults.
  function stateParams(ix, s) {
    const out = [['g', s.g]];
    for (const k of ['cat', 'group', 'purch', 'vendor', 'agency']) {
      if (s[k] != null) out.push([k, Array.isArray(s[k]) ? s[k].join(',') : String(s[k])]);
    }
    if (s.from !== ix.years[0]) out.push(['from', String(s.from)]);
    if (s.to !== ix.years[ix.years.length - 1]) out.push(['to', String(s.to)]);
    for (const k of ['county', 'size']) if (s[k]) out.push([k, s[k]]);
    if (s.np) out.push(['np', '1']);
    if (s.q) out.push(['q', s.q]);
    if (s.years) out.push(['years', '1']);
    return out;
  }
  // Older page URLs -> parameters of the same view in the table: {page: 'explore'|'about', p, unknown}
  function fromPath(parts, params) {
    const p = Object.assign({}, params);
    const id = parts[1];
    switch (parts[0]) {
      case undefined: break;
      case 'category': p.cat = id; p.g = 'vendor'; break;
      case 'vendor': p.vendor = id; p.g = 'agency'; break;
      case 'agency': p.agency = id; p.g = 'vendor'; break;
      case 'vendors': p.g = 'vendor'; break;
      case 'agencies': p.g = 'agency'; break;
      case 'rows': p.g = 'none'; break;
      case 'about': return { page: 'about', p };
      default: return { page: 'explore', p, unknown: '/' + parts.join('/') };
    }
    if (!p.g) p.g = 'category';
    return { page: 'explore', p };
  }
  // Row filters in a state, for selectRows and selectPayments.
  function rowFilter(s) {
    const f = {};
    for (const k of ['cat', 'group', 'purch', 'vendor', 'agency']) if (s[k] != null) f[k] = s[k];
    return f;
  }
  // Filtered to one value of a grouping. Several categories still leave something to group by.
  // A vendor has one category, so a vendor filter also fixes the category.
  function isFiltered(s, dim) {
    if (dim === 'vendor') return s.vendor != null;
    if (dim === 'agency') return s.agency != null;
    if (dim === 'category') return (s.cat != null && s.cat.length === 1) || s.vendor != null;
    return false;
  }
  // Grouping after filtering to one row of grouping `from`: category -> vendor, vendor -> agency,
  // agency -> vendor, year -> vendor, skipping any that is already filtered (then vendor, agency,
  // category in that order). When all three are filtered: the payment rows.
  const NEXT = { category: 'vendor', vendor: 'agency', agency: 'vendor', year: 'vendor' };
  function nextGroup(s, from) {
    const pref = NEXT[from];
    if (pref && !isFiltered(s, pref)) return pref;
    for (const d of ['vendor', 'agency', 'category']) if (!isFiltered(s, d)) return d;
    return 'none';
  }
  // State after activating the row with this value in the current grouping. A category row
  // narrows the category filter to that one category.
  function drill(ix, s, value) {
    const n = Object.assign({}, s, { q: '', bad: [] });
    switch (s.g) {
      case 'category': n.cat = [value]; n.group = null; n.purch = null; break;
      case 'vendor': n.vendor = value; break;
      case 'agency': n.agency = value; break;
      case 'year': n.from = value; n.to = value; break;
      default: return n;
    }
    n.g = nextGroup(n, s.g);
    return n;
  }
  // Categories in the filters (the selected ones, when there are any), in category order.
  function categoriesFor(ix, s) {
    const ok = catFilter(ix, s, rowFilter(s));
    return ix.D.categories.filter(c => ok[c.id]);
  }
  // The table for a state: items are one aggregate per category, vendor, agency or year, or
  // the payment rows themselves for g = 'none'. Category and year groupings list every value in
  // the filters, with zero when nothing was paid (with a vendor filter, only categories with its
  // rows); vendors are listed when they have rows. Agencies: every agency in the filters, or only
  // those with rows when a category or vendor filter is set. When category, vendor or other row
  // filters match no rows, every grouping is empty.

    const then = nextG === 'none' ? 'show its yearly totals' : 'group by ' + GNAME[nextG];
    const drill = name => ({
      name, label: o => 'Filter to ' + name(o), title: o => 'Filter to ' + name(o) + ', ' + then,
      ok: o => o.n > 0,
    });
    const oneCat = !!S.cat && S.cat.length === 1;          // the category column would repeat one value
    const t = {
      id: 'main-' + g, file: fileName(), wide: true, labelId: 'page-h', allRows: m.items, rows: m.items, byYear,
      hint: 'Select a row to filter to it and ' + then + '.',
      empty: !m.peers.size ? 'No agencies match the agency filters.' : 'No payments match these filters.',
      notes: '',
    };
    // Nothing in the selected categories: say why when the vendor is in none of them, and offer to clear them
    if (m.peers.size && S.cat) {
      let why = '';
      if (S.vendor) {
        const vcs = Core.vendorCats(ix, S.vendor);
        if (vcs.length && !vcs.some(id => S.cat.includes(id))) {
          why = ' ' + esc(vendorOf(S.vendor).name) + ' is in ' + vcs.map(id => esc(ix.cat.get(id).name)).join(' and ') +
            ', not in ' + (S.cat.length === 1 ? esc(ix.cat.get(S.cat[0]).name) : 'the selected categories') + '.';
        }
      }
      t.emptyHtml = esc(t.empty) + why + ' <button type="button" class="btn" data-rm="cat">Clear category filter</button>';
    }
    const totalLabel = () => (t.re ? 'Total, matching rows' : 'Total');
    if (g === 'category') {
      const share = v => (m.sum.spend > 0 ? v / m.sum.spend : null);
      t.cols = [
        { key: 'cat', label: 'Category', th: true, val: o => ix.cat.get(o.key).name },
        { key: 'group', label: 'Group', opt: true, hidden: byYear, val: o => ix.cat.get(o.key).group },
        nVend, nAg, paid,
        { key: 'share', label: 'Share of paid', csvLabel: 'Share of paid (%)', csvDp: 3, num: true, opt: true, hidden: byYear,
          val: o => share(o.spend), html: o => { const s = share(o.spend); return s == null ? '' : pct(s); },
          csv: o => { const s = share(o.spend); return s == null ? null : s * 100; } },
      ].concat(yearCols());
      t.sort = [['paid', 'desc'], ['cat', 'asc']];
      t.drill = Object.assign(drill(o => ix.cat.get(o.key).name), {
        value: o => o.key,
        after: o => { const term = t.re && t.hits && t.hits.get(o.key); return term ? ' <span class="muted">(' + esc(term) + ')</span>' : ''; },
      });
      t.filter = (rows, re) => { t.hits = new Map(Core.searchCategories(ix, re).map(x => [x.id, x.term])); return rows.filter(o => t.hits.has(o.key)); };
      t.searchHint = 'Category or item, e.g. air pack';
      t.foot = rows => { const a = total(rows); const s = share(a.spend); return [Object.assign({ _label: totalLabel(), vendors: int(a.ve.size), agencies: int(a.ag.size), paid: money(a.spend), share: s == null ? '' : pct(s) }, yearFoot(a))]; };
    } else if (g === 'vendor') {
      const isNeris = o => !!V()[o.key].neris;
      const nerisCol = { key: 'neris', label: 'NERIS partner', nw: true, opt: true, val: o => (isNeris(o) ? 'Yes' : null), html: o => (isNeris(o) ? 'Yes' : '') };
      t.cols = [
        { key: 'vendor', label: 'Vendor', th: true, val: o => V()[o.key].name },
        { key: 'cat', label: 'Category', opt: true, hidden: oneCat || byYear, val: o => ix.cat.get(ix.vcat[o.key]).name },
        nAg, paid,
        { key: 'last', label: 'Last year paid', num: true, opt: true, hidden: byYear, val: o => o.last, html: o => (o.last == null ? '' : 'FY' + o.last) },
        nerisCol,
      ].concat(yearCols());
      // The NERIS column and its note show only when a row in view is a partner
      t.onSearch = () => { nerisCol.hidden = byYear || !t.rows.some(isNeris); };
      t.tail = () => (nerisCol.hidden ? '' : '<p class="note">NERIS partner: listed by ' + A(LINKS.neris, 'FSRI') +
        ' as integrated with NERIS, the national fire incident reporting system replacing NFIRS.</p>');
      t.sort = S.cat != null && S.agency == null ? [['agencies', 'desc'], ['paid', 'desc']] : [['paid', 'desc'], ['vendor', 'asc']];
      t.drill = Object.assign(drill(o => V()[o.key].name), {
        value: o => V()[o.key].id,
        after: o => {
          if (!t.re || t.re.test(V()[o.key].name.toLowerCase())) return '';
          const al = V()[o.key].aliases.map(i => ix.D.aliases[i]).find(s => t.re.test(s.toLowerCase()));
          return al ? ' <span class="muted">(paid as ' + esc(al) + ')</span>' : '';
        },
      });
      t.searchHint = 'Vendor or payee name';
      t.filter = (rows, re) => rows.filter(o => re.test(ix.vendorText[o.key]));
      t.foot = rows => { const a = total(rows); return [Object.assign({ _label: totalLabel(), agencies: int(a.ag.size), paid: money(a.spend) }, yearFoot(a))]; };
    } else if (g === 'agency') {
      const yP = m.year;
      const ag = o => ix.agency.get(o.key);
      // Annual expenses: the most common latest full year; cells from another year say which
      const yc = new Map();
      for (const o of m.items) { const l = ix.latest.get(o.key); if (l) yc.set(l.year, (yc.get(l.year) || 0) + 1); }
      const top = [...yc].sort((x, y) => y[1] - x[1] || y[0] - x[0])[0];
      const expY = top ? top[0] : null;
      t.cols = [
        { key: 'agency', label: 'Agency', th: true, val: o => ag(o).name },
        { key: 'type', label: 'Type', hidden: true, val: o => ag(o).type },
        { key: 'staffing', label: 'Staffing', nw: true, hidden: byYear, val: o => staffingCell(ag(o)), csv: o => staffingText(ag(o)) },
        { key: 'county', label: 'County', nw: true, opt: true, hidden: byYear, val: o => ag(o).county },
        nVend, paid,
        { key: 'exp', label: 'Annual expenses', num: true, hidden: byYear,
          val: o => (ix.latest.get(o.key) ? ix.latest.get(o.key).amount : null),
          html: o => { const l = ix.latest.get(o.key); return l ? money(l.amount) + (l.year !== expY ? '<br><span class="muted">FY' + l.year + '</span>' : '') : ''; } },
        { key: 'expyear', label: 'Annual expenses fiscal year', hidden: true, val: o => (ix.latest.get(o.key) ? ix.latest.get(o.key).year : null) },
        { key: 'people', label: 'People paid ' + fy(yP), labelHtml: 'People paid <span class="nw">' + esc(fy(yP)) + '</span>', num: true, opt: true, hidden: byYear,
          val: o => Core.peopleIn(ix, o.key, yP), html: o => { const v = Core.peopleIn(ix, o.key, yP); return v == null ? '' : int(v); } },
        { key: 'revenue', label: 'Revenue ' + fy(yP), hidden: true, val: o => Core.revenueIn(ix, o.key, yP) },
        { key: 'grants', label: 'FEMA grants ' + shortSpan(S), labelHtml: 'FEMA grants <span class="nw">' + esc(shortSpan(S)) + '</span>', num: true, opt: true, hidden: byYear,
          val: o => Core.grantsIn(ix, o.key, S), html: o => money(Core.grantsIn(ix, o.key, S)) },
      ].concat(yearCols());
      t.sort = [['paid', 'desc'], ['agency', 'asc']];
      t.drill = Object.assign(drill(o => ag(o).name), { value: o => o.key });
      t.searchHint = 'Agency name';
      t.filter = (rows, re) => rows.filter(o => re.test(ag(o).name.toLowerCase()) || (ag(o).usfa && re.test(ag(o).usfa.name.toLowerCase())));
      t.foot = rows => {
        const a = total(rows);
        const gr = rows.reduce((s, o) => s + Core.grantsIn(ix, o.key, S), 0);
        return [Object.assign({ _label: totalLabel(), vendors: int(a.ve.size), paid: money(a.spend), grants: money(gr) }, yearFoot(a))];
      };
      if (m.narrowed) t.notes += '<p class="note">Agencies with no payments in these filters are not listed.</p>';
      if (!byYear) {
        t.notes += '<p class="note">Staffing: USFA registry department type; Not listed: not in the registry. ' +
          'Annual expenses: total expenses in the latest fully reported fiscal year' + (expY ? ' (FY' + expY + ' unless shown)' : '') + '. ' +
          'People paid: everyone with pay that year, including part-time staff, paid-per-call firefighters and board members. ' +
          'FEMA grants: awards with a federal fiscal year in the range.</p>';
      }
    } else if (g === 'year') {
      t.cols = [
        { key: 'year', label: 'Fiscal year', th: true, val: o => o.key, html: o => esc(fy(o.key)) },
        { key: 'partial', label: 'Partial year', hidden: true, val: o => (ix.partial.has(o.key) ? 'yes' : '') },
        nVend, nAg,
        { key: 'paid', label: 'Paid', num: true, val: o => o.spend, html: o => money(o.spend) },
      ];
      t.sort = [['year', 'asc']];
      t.drill = Object.assign(drill(o => fy(o.key)), { value: o => o.key });
      t.foot = rows => { const a = total(rows); return [{ _label: 'Total', vendors: int(a.ve.size), agencies: int(a.ag.size), paid: money(a.spend) }]; };
    } else {
      // Yearly totals: r = [agency id, vendor index, fiscal year, net amount, alias index]
      // Columns fixed by a filter would repeat one value on every row, so they are hidden (kept in the CSV)
      const payee = r => (r[4] < 0 ? 'Name withheld' : ix.D.aliases[r[4]]);
      t.cols = [
        { key: 'agency', label: 'Agency', hidden: S.agency != null, val: r => agName(r[0]) },
        { key: 'year', label: 'Fiscal year', val: r => r[2], html: r => fyHtml(r[2]) },
        { key: 'partial', label: 'Partial year', hidden: true, val: r => (ix.partial.has(r[2]) ? 'yes' : '') },
        { key: 'payee', label: 'Payee as reported', th: true, val: payee },
        { key: 'vendor', label: 'Vendor', opt: true, hidden: S.vendor != null, val: r => V()[r[1]].name },
        { key: 'cat', label: 'Category', opt: true, hidden: oneCat || S.vendor != null, val: r => ix.cat.get(Core.rowCat(ix, r)).name },
        { key: 'amount', label: 'Net amount', num: true, val: r => r[3], html: r => cents(r[3]) },
      ];
      t.sort = S.agency != null || S.vendor != null ? [['year', 'desc'], ['amount', 'desc']] : [['amount', 'desc'], ['agency', 'asc']];
      t.hint = 'Each row is the net total one agency paid one payee name in one fiscal year, as reported to Transparent Utah.';
      t.searchHint = 'Payee, vendor or agency';
      t.filter = (rows, re) => rows.filter(r => re.test(payee(r).toLowerCase()) || re.test(V()[r[1]].name.toLowerCase()) || re.test(agName(r[0]).toLowerCase()));
      t.foot = rows => [{ _label: totalLabel(), amount: cents(rows.reduce((s, r) => s + r[3], 0)) }];
      t.notes += '<p class="note">Source: ' + tuLink() + ' vendor payment summaries, fetched ' + esc(dateText(ix.meta.fetched)) + '.</p>';
    }
    if (g !== 'none') {
      t.notes += '<p class="note">Amounts are net of refunds and credits. Vendors and agencies are counted when the net payment is positive in at least one year of the range.</p>';
    }
    if (S.np) {
      t.notes += '<p class="note">Non-purchasing payments include transfers between agencies in this list (for example Unified Fire Service Area to Unified Fire Authority), so totals can count that money twice.</p>';
    }
    applySearch(t);
    return t;
  }

  // The toolbar goes above the table region (it stays in view); the table, its notes and the hint go in it.
  function renderMain(m) {
    const t = mainTable(m);
    TABLES[t.id] = t;
    let h = '';
    if (t.filter) {
      h += '<div class="tsearch" role="search"><label for="tq">' + esc(SEARCH[S.g]) + '</label>' +
        '<input type="search" id="tq" autocomplete="off" spellcheck="false" placeholder="' + esc(t.searchHint) + '" value="' + esc(S.q) + '"></div>';
    }
    if (S.g === 'category' || S.g === 'vendor' || S.g === 'agency') {
      h += '<div class="chk"><input type="checkbox" id="tyears"' + (S.years ? ' checked' : '') + '><label for="tyears">Show amounts by year</label></div>';
    }
    h += '<span class="tcount" id="tcount">' + countText(t) + '</span><span class="vh" id="tstatus" aria-live="polite"></span>';
    h += '<button type="button" class="btn" id="tcsv" data-csv="' + t.id + '">Download CSV</button>';
    $('tbar').innerHTML = h;
    h = t.hint ? '<p class="hint">' + esc(t.hint) + '</p>' : '';
    h += '<div id="tb-' + t.id + '" class="tmain">' + tableBody(t) + '</div>' + t.notes;
    $('tbl-main').innerHTML = h;
    $('tbl-main').classList.toggle('by-year', !!t.byYear);
    $('fshow').textContent = 'Show ' + countText(t);
  }

  /* ---- Context for the selected category, vendor and agency ---- */
  const details = (id, summary, body) => '<details id="' + id + '"' + (openDetails.has(id) ? ' open' : '') + '><summary>' + summary +
    '</summary><div class="dbody">' + body + '</div></details>';
  const fact = (dt, dd, full) => '<div' + (full ? ' class="full"' : '') + '><dt>' + dt + '</dt><dd>' + dd + '</dd></div>';

  // A category note that names another category ("... under Fire equipment distributors") links to it.
  const shortName = c => c.name.replace(/\s*\(.*\)$/, '');
  function noteHtml(c) {
    const s = esc(c.note);
    const o = ix.D.categories.find(x => x.id !== c.id && c.note.includes(shortName(x)));
    if (!o) return s;
    const n = esc(shortName(o));
    return s.replace(n, A(stateHash(withS({ cat: [o.id], vendor: null, group: null, purch: null, q: '' })), n));
  }
  // Above the table: one short block per category, vendor or agency filter. Longer sections go below the table.
  const ctxHead = (id, title, facts) => '<div class="ctxline"><h2 id="' + id + '">' + esc(title) + '</h2>' +
    facts.filter(Boolean).map(f => '<span class="sep" aria-hidden="true"> · </span><span>' + f + '</span>').join('') + '</div>';
  // Selected categories: a block for each one with a note, FEMA AEL codes or not counted as purchasing;
  // more than 3 selected: one line listing them.
  function ctxCategories(ids) {
    if (ids.length > 3) {
      return '<section class="ctx" aria-labelledby="ctx-cat">' +
        ctxHead('ctx-cat', int(ids.length) + ' categories', ids.map(id => esc(ix.cat.get(id).name))) + '</section>';
    }
    return ids.map(ctxCategory).join('');
  }
  function ctxCategory(id) {
    const c = ix.cat.get(id);
    let n = '';
    if (c.note) n += '<p class="note">' + noteHtml(c) + '</p>';
    if (id === 'unclassified') n += '<p class="note">These vendors did not match the vendor map or any keyword rule. See ' + A('#/about', 'About') + '.</p>';
    if (c.ael) {
      n += '<p class="note">FEMA Authorized Equipment List: ' + A(safeUrl(c.ael_url) || LINKS.ael, esc(c.ael)) +
        (c.ael_title ? ' (' + esc(c.ael_title) + ')' : '') + '.</p>';
    }
    if (!n && c.purchasing === 'yes') return '';
    const hid = 'ctx-cat-' + id;
    const h = '<section class="ctx" aria-labelledby="' + hid + '">' + ctxHead(hid, 'Category: ' + c.name, [
      c.group !== c.name ? 'Group: ' + esc(c.group) : '',
      c.purchasing === 'no' ? 'Not counted as purchasing' : '',
    ]);
    // On a phone the notes start collapsed, so the table stays near the top
    if (n && narrow()) n = details('d-catnotes-' + id, 'Category notes', n);
    return h + n + '</section>';
  }
  function ctxVendor(vid) {
    const v = vendorOf(vid);
    const method = vid === 'individuals' ? 'payee names that look like a person (Last, First)'
      : v.method === 'map' ? 'vendor map (config/vendor_map.csv)'
      : v.method === 'rule' ? 'keyword rule (config/keyword_rules.csv)'
      : 'no rule matched';
    let h = '<section class="ctx" aria-labelledby="ctx-ven">' + ctxHead('ctx-ven', 'Vendor: ' + v.name, [
      !(S.cat && S.cat.length === 1 && S.cat[0] === v.category) ? 'Category: ' + esc(ix.cat.get(v.category).name) : '',
      v.neris ? 'NERIS integration partner (' + A(LINKS.neris, 'FSRI list') + ')' : '',
    ]);
    if (v.aliases.length) {
      h += details('d-names', 'Names as paid (' + int(v.aliases.length) + ')',
        '<ul class="plain">' + v.aliases.map(i => '<li>' + esc(ix.D.aliases[i]) + '</li>').join('') + '</ul>' +
        '<p class="note">Category assigned by ' + esc(method) + '.</p>');
    } else {
      h += '<p class="note">Payee names withheld. Category assigned by ' + esc(method) + '.</p>';
    }
    return h + '</section>';
  }
  function ctxAgency(id) {
    const a = ix.agency.get(id);
    const site = a.website ? safeUrl(/^https?:\/\//i.test(a.website) ? a.website : 'https://' + a.website) : null;
    const lat = ix.latest.get(id);
    const line = [esc(a.type), a.county ? esc(a.county) + ' County' : '', esc(staffingText(a)),
      lat ? money(lat.amount) + ' annual expenses (FY' + lat.year + ')' : ''];
    // On a phone the facts line moves into the collapsed details
    const small = narrow();
    let h = '<section class="ctx" aria-labelledby="ctx-ag">' + ctxHead('ctx-ag', 'Agency: ' + a.name, small ? [] : line);
    let f = '';
    if (small) {
      f += fact('Type', esc(a.type)) + fact('Staffing', esc(staffingText(a)));
      if (lat) f += fact('Annual expenses', money(lat.amount) + ' (FY' + lat.year + ')');
    }
    f += fact('County', esc(a.county) + (a.city ? ' <span class="muted">(' + esc(a.city) + ')</span>' : ''));
    if (a.usfa) {
      const u = a.usfa;
      if (u.stations != null) f += fact('Stations', int(u.stations));
      const ff = [[u.career, 'career'], [u.volunteer, 'volunteer'], [u.paid_per_call, 'paid per call']].filter(([n]) => n > 0);
      f += fact('Firefighters', ff.length ? ff.map(([n, w]) => int(n) + ' ' + w).join(', ') : 'None reported');
    }
    if (a.fy_start) f += fact('Fiscal year starts', esc(a.fy_start) + (a.fy_start === 'January' ? ' (calendar year)' : ''));
    if (a.usfa) f += fact('USFA registry', esc(a.usfa.name) + ', FDID ' + esc(a.usfa.fdid));
    if (site) f += fact('Website', A(site, esc(a.website)));
    if (a.notes) f += fact('Notes', esc(a.notes), true);
    // Agencies of the same size: county is left out, since few counties have two agencies of one size
    const size = sizeOf(id);
    const range = size && (/^(Under|Over) /.test(size.label) ? size.label.charAt(0).toLowerCase() + size.label.slice(1) : 'of ' + size.label);
    h += details('d-facts', 'Agency details', '<dl class="facts">' + f + '</dl>' + (size
      ? '<p><button type="button" class="btn" data-like="' + id + '">Filter to agencies with annual expenses ' + esc(range) + '</button></p>'
      : ''));
    return h + '</section>';
  }
  // Below the table: staff, revenue, expenses and FEMA grants for the selected agency
  function moreAgency(id) {
    const a = ix.agency.get(id);
    let h = '';
    // Staff: people paid, wages and benefits per fiscal year, and job titles
    const sm = Core.staffModel(ix, id, S);
    let b = table({
      id: 'ag-s', title: 'Staff', hideTitle: true, file: 'agency-' + id + '-staff', negNote: false,
      empty: 'No compensation reported to Transparent Utah' + (sm.any ? ' for ' + yearSpan(S) : '') + '.',
      rows: sm.rows,
      cols: [
        { key: 'year', label: 'Fiscal year', val: r => r.y, html: r => esc(fy(r.y)) },
        { key: 'partial', label: 'Partial year', hidden: true, val: r => (ix.partial.has(r.y) ? 'yes' : '') },
        { key: 'people', label: 'People paid', num: true, val: r => r.people, html: r => int(r.people) },
        { key: 'wages', label: 'Wages', num: true, opt: true, val: r => r.wages, html: r => money(r.wages) },
        { key: 'benefits', label: 'Benefits', num: true, opt: true, val: r => r.benefits, html: r => money(r.benefits) },
        { key: 'total', label: 'Wages and benefits', num: true, val: r => r.total, html: r => money(r.total) },
      ],
      sort: [['year', 'asc']],
    });
    if (sm.titles.length) {
      b += table({
        id: 'ag-t', title: 'Job titles, ' + fy(sm.titleYear), file: 'agency-' + id + '-job-titles-fy' + sm.titleYear, page: 15,
        rows: sm.titles,
        cols: [
          { key: 'title', label: 'Title', th: true, val: r => r.title },
          { key: 'people', label: 'People', num: true, val: r => r.n, html: r => int(r.n) },
        ],
        sort: [['people', 'desc'], ['title', 'asc']],
      });
    }
    if (sm.rows.length) {
      b += '<p class="note">From ' + tuLink() + ' compensation reports. People paid: everyone with pay that year, including part-time staff, paid-per-call firefighters and board members. Wages leave out reimbursements; benefits are employer-paid. ' +
        A(REPO + '/tree/main/' + ix.meta.raw_path + '/transparent_utah/compensation/' + id, 'Raw data files') + ' (gzipped JSON, one per year).</p>';
    }
    h += details('d-staff', 'Staff', b);

    // Revenue in the agency's own account names
    const rm = Core.revenueModel(ix, id, S);
    b = table({
      id: 'ag-r', title: 'Revenue', hideTitle: true, file: 'agency-' + id + '-revenue', wide: true, negNote: false, page: 15,
      empty: 'No revenue reported to Transparent Utah' + (rm.any ? ' for ' + yearSpan(S) : '') + '.',
      rows: rm.rows,
      cols: [{ key: 'cat', label: 'Category', th: true, val: o => o.key + (o.excluded ? ' (not in total)' : ''),
        html: o => esc(o.key) + (o.excluded ? ' <span class="muted">(not in total)</span>' : '') }]
        .concat(rm.years.map(y => ({
          key: 'y' + y, label: fy(y), num: true,
          val: o => (o.yr[y] == null ? null : o.yr[y]), html: o => (o.yr[y] == null ? '' : money(o.yr[y])),
        })), [{ key: 'total', label: 'Total ' + shortSpan(S), labelHtml: 'Total <span class="nw">' + esc(shortSpan(S)) + '</span>',
          num: true, val: o => o.total, html: o => money(o.total) }]),
      sort: [['total', 'desc'], ['cat', 'asc']],
      foot: [Object.assign({ _label: rm.anyExcluded ? 'Total revenue' : 'Total', total: money(rm.total) },
        Object.fromEntries(rm.years.map(y => ['y' + y, rm.yr[y] == null ? '' : money(rm.yr[y])])))],
    });
    if (rm.rows.length) {
      b += '<p class="note">As reported to ' + tuLink() + ', in the agency\'s own account names. Totals leave out borrowing, transfers between the agency\'s own funds and donated infrastructure' +
        (rm.anyExcluded ? ' (rows marked "not in total")' : '') + '. Some names are expense accounts where refunds were recorded. ' +
        A(BLOB + ix.meta.raw_path + '/transparent_utah/revenue_categories/' + id + '.json.gz', 'Raw data file') + ' (gzipped JSON).</p>';
    }
    h += details('d-rev', 'Revenue', b);

    // Total expenses per fiscal year (all years reported)

  // Largest single payments: p = [agency id, fiscal year, rank, vendor index, amount, alias index]

  /* ---- Active filters ---- */
  function activeFilters() {
    const out = [];                                   // [state key, text]
    if (!fullRange(S)) out.push(['years', S.from === S.to ? 'Fiscal year: ' + fy(S.from) : 'Fiscal years: FY' + S.from + '–FY' + S.to]);
    for (const id of S.cat || []) out.push(['cat:' + id, 'Category: ' + ix.cat.get(id).name]);   // one chip per category

  // State without one filter. 'cat:<id>' removes one category; 'cat' all of them.
  function without(key) {

    if (key === 'np') return withS({ np: false });

    if (key.startsWith('cat:')) {
      const rest = (S.cat || []).filter(id => id !== key.slice(4));

  }
  function renderChips(notes) {

        '</ul><button type="button" class="btn" data-clear="1">Clear all filters</button>';

  /* ---- Filter bar ---- */
  const opt = (v, label) => '<option value="' + esc(v) + '">' + esc(label) + '</option>';
  function fillControls() {
    const yrs = ix.years.map(y => opt(y, fy(y))).join('');
    $('f-from').innerHTML = yrs;
    $('f-to').innerHTML = yrs;
    $('f-agency').innerHTML = opt('', 'All agencies') +
      ix.D.agencies.slice().sort((x, y) => coll.compare(x.name, y.name)).map(a => opt(a.id, a.name)).join('');
    $('f-county').innerHTML = opt('', 'All') + ix.counties.map(c => opt(c, c)).join('');
    $('f-size').innerHTML = opt('', 'All') + Core.SIZES.map(t => opt(t.id, t.label)).join('');
    const names = V().map(v => v.name).sort(coll.compare);
    $('vendor-list').innerHTML = names.map(n => '<option value="' + esc(n) + '"></option>').join('');
    vendorByName = new Map(V().map(v => [v.name.toLowerCase(), v.id]));
  }
  // Category checkboxes under their group headings; non-purchasing ones only with the checkbox on
  // (or when selected). Rebuilt only when that list changes, so focus stays on the box just toggled.
  function fillCategories() {
    const npSel = S.np ? [] : (S.cat || []).filter(id => ix.cat.get(id).purchasing !== 'yes');
    const key = S.np + ':' + npSel.join(',');
    if (key === catOptsKey) return;
    catOptsKey = key;
    const box = $('f-cat-box');
    const before = [...box.querySelectorAll('input')].map(i => i.value);
    const at = box.contains(document.activeElement) ? before.indexOf(document.activeElement.value) : -1;
    const chk = c => '<label class="chk"><input type="checkbox" name="cat" id="fc-' + esc(c.id) + '" value="' + esc(c.id) + '"><span>' + esc(c.name) + '</span></label>';
    let h = '';
    for (const gr of ix.groups) {
      const cs = ix.D.categories.filter(c => c.group === gr && (S.np || c.purchasing === 'yes' || npSel.includes(c.id)));
      if (!cs.length) continue;
      // A group that is a single category of the same name (Unclassified) needs no heading
      h += cs.length === 1 && cs[0].name === gr ? chk(cs[0]) : '<fieldset class="cgrp"><legend>' + esc(gr) + '</legend>' + cs.map(chk).join('') + '</fieldset>';
    }
    box.innerHTML = '<div class="catcols">' + h + '</div>';   // columns inside the box, so the box scrolls down, not sideways
    // Focus was on a checkbox that is gone (a non-purchasing category unchecked): move to the one before it
    for (let i = at; i >= 0; i--) { const el = $('fc-' + before[i]); if (el) { el.focus(); break; } }
  }
  function syncPanel(nActive) {
    $('f-from').value = S.from;
    $('f-to').value = S.to;
    fillCategories();
    const sel = new Set(S.cat || []);
    for (const el of $('f-cat-box').querySelectorAll('input')) el.checked = sel.has(el.value);
    $('f-cat-n').innerHTML = sel.size ? '(' + int(sel.size) + '<span class="vh"> selected</span>)' : '';
    $('f-cat-txt').textContent = 'Category: ' + (sel.size ? int(sel.size) + ' selected' : 'All');
    $('f-cat-clear').disabled = !sel.size;
    $('f-vendor').value = S.vendor ? vendorOf(S.vendor).name : '';
    $('f-vendor-msg').textContent = '';
    $('f-agency').value = S.agency != null ? String(S.agency) : '';
    $('f-county').value = S.county;
    $('f-size').value = S.size;

      : int(Core.peerIds(ix, S).size) + ' of ' + int(ix.D.agencies.length) + ' agencies match';
    $('f-count').textContent = txt;
    // Announced only after a change to the agency filters, where focus stays on the select
    $('f-live').textContent = announcePeers ? txt : '';
    announcePeers = false;
    $('ftoggle').textContent = nActive ? 'Filters (' + nActive + ' active)' : 'Filters';
  }
  // A category checkbox adds or removes that category. The grouping stays, so grouped by category
  // the table compares the selected ones. A vendor filter is kept (the two intersect).
  function toggleCat(id, on) {
    const ids = (S.cat || []).filter(x => x !== id).concat(on ? [id] : []);
    return withS({ cat: ids.length ? Core.parseCats(ix, ids).ids : null, group: null, purch: null });
  }
  // Filtering on the dimension the table is grouped by moves to the next grouping, as a row click does.
  function setVendor(vid) {
    const n = withS({ vendor: vid });
    if (vid) {
      const c = ix.cat.get(vendorOf(vid).category);
      if (n.group && n.group !== c.group) n.group = null;
      if (n.purch && n.purch !== c.purchasing) n.purch = null;
      if (S.g === 'vendor') { n.g = Core.nextGroup(n, 'vendor'); n.q = ''; }
    }
    return n;
  }
  function setAgency(id) {
    const n = withS({ agency: id });

  }
  // Vendor box: a pick from the list applies at once; typed text applies on Enter or when leaving the box.
  function vendorCommit() {
    const raw = $('f-vendor').value.trim();
    const msg = $('f-vendor-msg');
    msg.textContent = '';
    if (!raw) { if (S.vendor) go(setVendor(null)); return; }
    const id = vendorByName.get(raw.toLowerCase());
    if (id) { if (id !== S.vendor) go(setVendor(id)); return; }
    const re = Core.searchRe(raw);
    const hits = [];
    if (re) for (let i = 0; i < ix.vendorText.length && hits.length < 2; i++) if (re.test(ix.vendorText[i])) hits.push(i);
    if (hits.length === 1) { go(setVendor(V()[hits[0]].id)); return; }
    msg.textContent = hits.length ? 'Several vendors match. Pick one from the list.' : 'No vendor matches "' + raw + '".';
  }
  // The annual expenses range an agency is in, or undefined without an expense figure
  function sizeOf(id) {
    const lat = ix.latest.get(id);
    return lat ? Core.SIZES.find(z => lat.amount >= z.lo && lat.amount < z.hi) : undefined;
  }
  function likeState(id) {
    const size = sizeOf(id);

  }
  // Category checkboxes, opened from the Category button. On a phone they open in place, in the panel.
  const catOpen = () => !$('f-cat-pop').hidden;
  function placeCat() {
    const pop = $('f-cat-pop');

    // Below the button, as tall as the window allows, and inside the window on the right
    const b = $('f-cat-btn').getBoundingClientRect();
    pop.style.maxHeight = Math.max(180, window.innerHeight - b.bottom - 16) + 'px';
    const r = pop.getBoundingClientRect();
    const over = r.right - (document.documentElement.clientWidth - 16);
    if (over > 0) pop.style.left = -Math.min(over, r.left - 16) + 'px';
  }
  function catPanel(open, focusButton) {

  function bindControls() {
    $('fpanel').addEventListener('change', e => {
      const el = e.target;

      switch (el.id) {
        case 'f-from': case 'f-to': {
          let from = Number($('f-from').value), to = Number($('f-to').value);
          if (from > to) { if (el.id === 'f-from') to = from; else from = to; }   // keep the range valid
          n = withS({ from, to });

        }
        case 'f-vendor': vendorCommit(); return;

    // Clear categories: focus moves to the first checkbox, since this button is disabled with none selected
    $('f-cat-clear').addEventListener('click', () => {

    });
    // Category button: opens the checkboxes below it. Ticking boxes keeps it open; Escape, a click

    $('f-cat-btn').addEventListener('click', () => catPanel(!catOpen()));

    });
    // A click on the table region that closes the popover only closes it: the popover covers most of
    // the table, and a click anywhere on a row would otherwise also open that row.

      }, 300);

    });

      if (e.target.id === 'tyears') go(withS({ years: e.target.checked }));

  }

  // Buttons anywhere: sort, Show all/more, CSV, drill-down, remove filter, agencies of the same size
  function drillTo(raw) {
    const v = S.g === 'agency' || S.g === 'year' ? Number(raw) : raw;

        const t = TABLES[d.t], c = Number(d.c);
        if (!t || !t.cols[c]) return;
        const col = t.cols[c];
        const cur = sortSpec(t)[0] || [-1];
        TSTATE[t.id].sort = cur[0] === c ? [colKey(col), cur[1] === 'asc' ? 'desc' : 'asc']

      } else if (d.all) {                                       // show all rows

    }
    // Links within the page change the state through nav(), like the controls
    const a = tgt.closest('a[href^="#/"]');

      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

  // The annual expenses range an agency is in, or undefined without an expense figure
  // No agency matches (plain text): outside Utah, say when it is because no agency in the scope (and county) has annual expenses
  function noPeersText() {
    let t = 'No agencies match the agency filters.';
    if (!S.size || ix.states.includes('UT')) return t;
    const any = ix.D.agencies.some(a => (!S.county || a.county === S.county) && ix.latest.get(a.id));
    if (!any) t = 'No agencies match the agency filters: no agency ' + (S.county ? 'in ' + S.county + ' County, ' : 'in ') + andList(ix.states.map(stName)) +
      ' has published annual expenses, which the Annual expenses filter uses.';
    return t;
  }
  function sizeOf(id) {
    const lat = ix.latest.get(id);
    return lat ? Core.SIZES.find(z => lat.amount >= z.lo && lat.amount < z.hi) : undefined;
  }
  function likeState(id) {
    const size = sizeOf(id);

  }
  // Category checkboxes, opened from the Category button. On a phone they open in place, in the panel.
  const catOpen = () => !$('f-cat-pop').hidden;
  function placeCat() {

    const b = $('f-cat-btn').getBoundingClientRect();
    pop.style.maxHeight = Math.max(180, window.innerHeight - b.bottom - 16) + 'px';
    const r = pop.getBoundingClientRect();
    const over = r.right - (document.documentElement.clientWidth - 16);
    if (over > 0) pop.style.left = -Math.min(over, r.left - 16) + 'px';
  }
  function catPanel(open, focusButton) {
    const pop = $('f-cat-pop'), btn = $('f-cat-btn');

  function bindControls() {
    $('fpanel').addEventListener('change', e => {
      const el = e.target;

          n = withS({ from, to });

        }
        case 'f-vendor': vendorCommit(); return;
        case 'f-agency': n = setAgency(el.value || null); break;
        case 'f-state': {
          // The county stays when the new state has it; an agency of another state is cleared
          const st = el.value;
          const a = S.agency != null ? ix.agency.get(S.agency) : null;
          n = withS({ state: st, county: st && store.st[st].counties.includes(S.county) ? S.county : '' });

    $('f-clear').addEventListener('click', () => go(Core.normState(store, { g: S.g, years: S.years ? '1' : '' })));

  // Buttons anywhere: sort, Show all/more, CSV, drill-down, remove filter, agencies of the same size
  function drillTo(raw) {

  document.addEventListener('click', e => {
    const tgt = e.target;

      const d = b.dataset;
      if (d.t && d.c != null) {                                 // sort
        const t = TABLES[d.t], c = Number(d.c);
        if (!t || !t.cols[c]) return;
        const col = t.cols[c];
        const cur = sortSpec(t)[0] || [-1];
        TSTATE[t.id].sort = cur[0] === c ? [colKey(col), cur[1] === 'asc' ? 'desc' : 'asc']

  }, true);

  /* ---- Views ---- */
  function renderExplore(notes, keepAll) {
    for (const k in TSTATE) { TSTATE[k].all = false; TSTATE[k].limit = 0; }

  function viewAbout() {
    const M = store.meta;

    const sts = store.order;
    const names = sts.map(stName);
    const span = 'FY' + M.years[0] + ' to FY' + M.years[M.years.length - 1];

  /* ---- Router ---- */
  // Focus after a change: the summary, unless Back or Forward restored a position further down the
  // table; then the first row in view. In the fixed layout the summary is always on screen, so what
  // counts is whether the table region is scrolled past the start of the table.
  function focusMain() {
    const sum = $('summary');
    const tb = $('tb-main-' + S.g);
    const sc = fixed() ? $('scroller') : null;
    let top = 0, bottom = window.innerHeight;
    if (sc) {
      top = sc.getBoundingClientRect().top + sc.clientTop;
      bottom = top + sc.clientHeight;
    }
    const r = sum.getBoundingClientRect();
    const sumOn = r.top >= 0 && r.top < window.innerHeight;
    if (!tb || (sumOn && (!sc || tb.getBoundingClientRect().top >= top - 1))) { sum.focus({ preventScroll: true }); return; }
    // Rows under the sticky header row are hidden (its cells stick; the thead box itself does not move)
    const hc = sc && tb.querySelector('thead th');
    const from = hc ? Math.max(top, hc.getBoundingClientRect().bottom - 1) : top;
    for (const b of tb.querySelectorAll('button.drill')) {
      const q = b.getBoundingClientRect();
      if (q.top > bottom) break;
      if (q.top >= from) { b.focus({ preventScroll: true }); return; }
    }
    // No row button in view: the table itself when it is in view (rows without buttons), otherwise
    // the summary when it is on screen (the region is scrolled to the sections below the table)
    const t = tb.getBoundingClientRect();
    if (sumOn && (t.bottom <= from || t.top >= bottom)) { sum.focus({ preventScroll: true }); return; }
    tb.tabIndex = -1;
    tb.focus({ preventScroll: true });
  }

      else if (again && document.activeElement !== again && $('area').contains(again)) again.focus({ preventScroll: true });
      else if (inArea && !document.contains(active)) focusMain();
      else if (own && (!active || active === document.body || active === $('main') || active === $('scroller'))) focusMain();   // e.g. a click on a row cell
      else if (!own && inArea) focusMain();
    }
  }

  // Remember the scroll position of each history entry (of the page, or of the table region)
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  document.addEventListener('scroll', e => {
    const b = scrollBox();
    if (e.target !== b && !(e.target === document && b === (document.scrollingElement || document.documentElement))) return;
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(saveEntry, 200);
  }, { passive: true, capture: true });
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { fitRegions($('main')); placeCat(); }, 200);
  });
  // Fixed layout: the page itself does not scroll, so the scroll keys do nothing while focus is outside
  // the region (on the page, or on the summary after a change). They scroll the region instead.
  const SCROLL_KEYS = { PageDown: 1, PageUp: -1, ' ': 1, ArrowDown: 1, ArrowUp: -1, Home: -1, End: 1 };
  document.addEventListener('keydown', e => {
    if (!fixed() || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.isComposing) return;
    const dir = SCROLL_KEYS[e.key];
    if (!dir) return;
    const a = document.activeElement;
    if (a && a !== document.body && a !== $('main') && a !== $('summary')) return;
    const sc = scrollBox();
    if (sc === document.scrollingElement || sc === document.documentElement) return;
    const page = Math.max(40, sc.clientHeight - 40);
    let top;
    if (e.key === 'Home' || e.key === 'End') top = dir * sc.scrollHeight;
    else if (e.key.startsWith('Arrow')) top = dir * 40;
    else top = (e.key === ' ' && e.shiftKey ? -1 : dir) * page;
    e.preventDefault();
    sc.scrollBy({ top });
  });
  $('skip').addEventListener('click', e => {
    e.preventDefault();
    const target = view === 'explore' ? $('summary') : $('page').querySelector('h1');
    (target || $('main')).focus();
  });

  /* ---- Loading state files ---- */
  function fetchJson(f) {
    return fetch(f, { cache: 'no-cache' })                     // revalidate, so a new page never runs on old cached data
      .then(r => { if (!r.ok) throw new Error(f + ' returned HTTP ' + r.status); return r.json(); });
  }
  const fileSize = n => (n >= 950000 ? (n / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1000)) + ' kB');
  const stLoads = {};     // state -> pending or finished load of its rows
  function loadState(st) {
    if (Core.isLoaded(store, st)) return Promise.resolve();
    if (!stLoads[st]) {
      stLoads[st] = fetchJson(store.meta.states[st].files.rows)
        .then(D => { Core.addState(store, st, D); })
        .catch(err => { stLoads[st] = null; throw err; });   // Retry loads it again
    }
    return stLoads[st];
  }
  const loadStates = sts => Promise.all(sts.map(loadState));
  // While the states a view needs load: a message in place of the table (or the page, before the first table),
  // then the view, unless another one was asked for meanwhile. On failure, a Retry button.
  function waitFor(need, own) {
    const h = location.hash;
    rendered = h;
    const names = andList(need.missing.map(stName));
    const bytes = need.missing.reduce((n, st) => n + ((store.meta.states[st].bytes_gz || {}).rows || 0), 0);
    showWait('<p class="loading" role="status">Loading ' + esc(names) + ' (' + fileSize(bytes) + ')...</p>');
    loadStates(need.missing).then(() => { if (location.hash === h) route(own); }, err => {
      console.error(err);
      if (location.hash !== h) return;
      showWait('<p class="loading" role="alert">' + esc(names) + ' did not load' + (err && err.message ? ': ' + esc(err.message) : '') +
        '. <button type="button" class="btn" data-retry="1">Retry</button></p>');
    });
  }
  function showWait(html) {
    if (view === 'explore' && S) {
      for (const k in TABLES) delete TABLES[k];
      $('summary').innerHTML = html;
      $('tbar').innerHTML = '';
      $('context').innerHTML = '';
      $('tbl-main').innerHTML = '';
      $('more').innerHTML = '';
    } else {
      $('explore').hidden = true;
      $('page').hidden = false;
      $('page').innerHTML = '<div class="prose">' + html + '</div>';
    }
  }
  // Draw the current state again, now that data it needs has arrived (the URL may be up to 300 ms behind)
  function refresh() {
    const a = document.activeElement;
    const caret = a && a.id === 'tq' ? a.selectionStart : null;
    try { history.replaceState(history.state, '', stateHash(S)); } catch (e) { /* rate limited */ }
    route(true);
    const q = $('tq');
    if (caret != null && q && document.activeElement === q) q.setSelectionRange(caret, caret);
  }

  /* ---- Load ---- */
  function fail(err) {
    $('page').innerHTML = '<div class="prose"><h1 tabindex="-1">Data did not load</h1>' +
      '<p>Could not load the data' + (err && err.message ? ': ' + esc(err.message) : '') + '.</p>' +
      (location.protocol === 'file:'
        ? '<p>Opening index.html directly from disk does not work, because the browser blocks the data request. ' +
          'From the project folder run <code>python3 -m http.server</code> and open <a href="http://localhost:8000/">http://localhost:8000/</a>.</p>'
        : '') + '</div>';
  }
  // data/index.json first: agencies of every state, categories and the precomputed default tables
  fetchJson('data/index.json')
    .then(I => {
      store = Core.buildStore(I);
      ix = Core.view(store, 'ALL');
      const fetched = store.order.map(st => store.meta.states[st].fetched).filter(Boolean).sort();
      $('asof').textContent = 'Prototype. Data as of ' + dateText(fetched[fetched.length - 1] || store.meta.built) + '.';
      fillControls();
      bindControls();
      route(false);
      loaded = true;
      // Back and Forward; typed URLs and links outside the page's own handling (each change is rendered once)
      window.addEventListener('popstate', () => route(false));
      window.addEventListener('hashchange', () => { if (location.hash !== rendered) route(false); });
    })
    .catch(err => { console.error(err); if (!loaded) fail(err); });
})();
</script>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utah Vendor Finances</title>
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Net payments from Utah fire districts, interlocal fire agencies and city, town and county fire departments to vendors, by category, FY2021 to FY2026. Source: Transparent Utah.">
<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --fg: #1b1b1b;
  --muted: #595959;
  --rule: #dddddd;
  --rule-strong: #8a8a8a;
  --shade: #f3f3f3;
  --hover: #eaf0f7;
  --accent: #1d4f91;
  --accent-fg: #ffffff;
  --shadow: rgba(0, 0, 0, .18);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 16px; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
.skip { position: absolute; left: -9999px; top: 0; }
.skip:focus { left: 16px; top: 8px; background: var(--bg); padding: 4px 8px; z-index: 3; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
p { margin: 6px 0; }
.muted { color: var(--muted); }
.note { font-size: .8125rem; color: var(--muted); max-width: 64em; }

/* Header */
.site { border-bottom: 1px solid var(--rule); }
.hdr { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; padding-top: 7px; padding-bottom: 7px; }
.site-title { margin: 0; font-size: 1.1rem; font-weight: 600; }
.site-title a { color: var(--fg); text-decoration: none; }
.asof { margin: 0; font-size: .85rem; color: var(--muted); }
.hdr .about-link { margin-left: auto; font-size: .9rem; }
.hdr .about-link[aria-current="page"] { color: var(--fg); font-weight: 600; text-decoration: none; }

/* Form controls */
select, input[type=text], input[type=search] {
  font: inherit; font-size: .875rem; color: var(--fg); background: var(--bg);
  border: 1px solid var(--rule-strong); border-radius: 3px; padding: 4px 6px; max-width: 100%;
}
input[type=checkbox] { margin: 0; accent-color: var(--accent); }
.btn {
  font: inherit; font-size: .8125rem; color: var(--fg); background: var(--bg);
  border: 1px solid var(--rule-strong); border-radius: 3px; padding: 3px 10px; cursor: pointer;
}
.btn:hover { background: var(--shade); }
.chk { display: flex; gap: 6px; align-items: flex-start; }
.chk input { margin-top: 3px; flex: none; }

/* Layout. Phones and short windows: the page scrolls as usual. Windows at least 1000px wide and 560px
   tall, or 700px wide and 660px tall (where the filter bar wraps to more rows; see "Fixed layout" below):
   the page fills the window and never scrolls. The header, filter bar and table controls stay in place,
   and only the region with the table (#scroller) scrolls. */
:root { --gut: max(16px, calc((100vw - 1408px) / 2)); }     /* side gutter, lines up with .wrap */
.page, .scroller { padding: 0 var(--gut) 40px; }
.ftoggle { display: none; }
.fwrap { border-bottom: 1px solid var(--rule); }
.top { width: 100%; padding-top: 8px; }   /* full width: auto margins would shrink it in the flex column */

/* Filter bar */
.fbar { font-size: .875rem; }
.flabel, .field > label { font-weight: 600; font-size: .8125rem; }
.field { margin: 0; }
.range { display: flex; align-items: center; gap: 6px; }
.range label { font-size: .8125rem; color: var(--muted); }
.fcount { margin: 0; color: var(--muted); font-size: .8125rem; }
.fmsg { margin: 3px 0 0; font-size: .8125rem; color: var(--muted); }
.fmsg:empty { display: none; }
.fshow { display: none; }
/* Category: a button that opens the checkboxes by group */
.catf { position: relative; }
.dd {
  font: inherit; font-size: .875rem; color: var(--fg); background: var(--bg); text-align: left; white-space: nowrap;
  border: 1px solid var(--rule-strong); border-radius: 3px; padding: 4px 8px; cursor: pointer;
}
.dd:hover, .dd[aria-expanded="true"] { background: var(--shade); }
.dd .car { margin-left: 8px; color: var(--muted); font-size: .75rem; }
.catpop { background: var(--bg); border: 1px solid var(--rule-strong); border-radius: 3px; }
.catpop[hidden] { display: none; }
.cathead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 10px; border-bottom: 1px solid var(--rule); }
.ncat { font-weight: 400; color: var(--muted); }
.catclr { padding: 0 8px; font-size: .75rem; line-height: 20px; }
.catclr:disabled { color: var(--muted); border-color: var(--rule); cursor: default; background: var(--bg); }
.catbox { padding: 0 10px 8px; }
.catcols { column-gap: 24px; }
.cgrp { border: 0; margin: 0; padding: 0; min-width: 0; break-inside: avoid; }
.cgrp > legend { padding: 6px 0 1px; font-size: .75rem; font-weight: 600; color: var(--muted); }
.catbox .chk { padding: 2px 0; font-size: .8125rem; line-height: 1.3; cursor: pointer; }
.catbox .chk input { margin-top: 2px; }
.catcols > .chk { padding-top: 8px; }

/* Group by */
.gbar { display: flex; align-items: center; gap: 10px; }
.gbar-l { font-weight: 600; font-size: .875rem; white-space: nowrap; }
.seg { display: flex; min-width: 0; overflow-x: auto; overflow-y: hidden; padding: 3px; margin: -3px; }
.seg button {
  flex: none; font: inherit; font-size: .875rem; color: var(--fg); background: var(--bg);
  border: 1px solid var(--rule-strong); border-radius: 0; padding: 4px 12px; margin: 0 0 0 -1px;
  cursor: pointer; white-space: nowrap;
}
.seg button:first-child { margin-left: 0; border-radius: 3px 0 0 3px; }
.seg button:last-child { border-radius: 0 3px 3px 0; }
.seg button:hover { background: var(--shade); }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; position: relative; }
.seg button:focus-visible { position: relative; z-index: 1; outline-offset: 1px; }

/* Active filters */
.chipbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 8px; font-size: .8125rem; min-height: 28px; }
.chips-l { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.chip { display: inline-flex; align-items: center; border: 1px solid var(--rule-strong); border-radius: 3px; padding-left: 8px; line-height: 24px; }
.chip button {
  font: inherit; font-size: 1rem; line-height: 1; color: var(--muted); background: none;
  border: 0; border-left: 1px solid var(--rule); margin-left: 8px; padding: 0 7px; height: 24px; cursor: pointer;
}
.chip button:hover { color: var(--fg); background: var(--shade); }
.badnote { flex-basis: 100%; margin: 0; color: var(--muted); }

.summary { margin: 6px 0 0; }

/* Context for the selected category, vendor or agency (above the table), and more for it (below) */
#context { border: 1px solid var(--rule); margin-top: 12px; }
#context:empty { display: none; }
.ctx { padding: 6px 12px; }
.ctx + .ctx { border-top: 1px solid var(--rule); }
.ctxline { font-size: .875rem; }
.ctxline h2 { display: inline; font-size: .9375rem; font-weight: 600; margin: 0; }
.sep { color: var(--muted); }
.ctx p { margin: 3px 0; }
.ctx details { margin-top: 2px; }
details > summary { cursor: pointer; font-size: .875rem; font-weight: 600; padding: 2px 0; }
.dbody { padding: 2px 0 8px; }
#more:empty { display: none; }
#more { margin-top: 24px; border-top: 1px solid var(--rule-strong); padding-top: 8px; }
#more h2 { font-size: 1rem; font-weight: 600; margin: 0 0 6px; }
#more details { border-bottom: 1px solid var(--rule); padding: 4px 0; }
dl.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 2px 20px; margin: 6px 0; font-size: .875rem; }
dl.facts > div { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 8px; min-width: 0; }
dl.facts > div.full { grid-column: 1 / -1; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
ul.plain { margin: 4px 0; padding-left: 18px; font-size: .875rem; columns: 2 18em; }

/* Table toolbar */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 8px 0; font-size: .875rem; }
.tsearch { display: flex; align-items: center; gap: 6px; }
.tsearch label { font-weight: 600; }
.tsearch input { width: 18em; }
.tcount { margin-left: auto; color: var(--muted); }
.hint { margin: 0 0 6px; font-size: .8125rem; color: var(--muted); }

/* Tables */
.tbl { margin-top: 10px; }
.thead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; margin-bottom: 4px; }
.thead h3 { font-size: .875rem; font-weight: 600; margin: 0; }
.tw { overflow-x: auto; overflow-y: hidden; }
table { border-collapse: collapse; font-size: .875rem; }
.tbl.wide table { width: 100%; }
th, td { padding: 5px 10px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; overflow-wrap: break-word; }
thead th {
  background: var(--shade); border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule-strong);
  font-weight: 600; vertical-align: bottom; overflow-wrap: normal;
}
tbody th { font-weight: 400; min-width: 10em; }
#tbl-main tbody th { min-width: 14em; }
/* Amounts by year: a compact grid, so the year columns fit beside the name */
#tbl-main.by-year table { font-size: .8125rem; }
#tbl-main.by-year th, #tbl-main.by-year td { padding: 5px 6px; }
#tbl-main.by-year tbody th { min-width: 10em; }
/* First column stays in view when a table scrolls sideways */
.tw tr > :first-child { position: sticky; left: 0; z-index: 1; background: var(--bg); }
.tw thead tr > :first-child { background: var(--shade); }
.nw { white-space: nowrap; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; overflow-wrap: normal; }
thead th.num { white-space: normal; }
tfoot th, tfoot td { border-top: 1px solid var(--rule-strong); border-bottom: 0; font-weight: 600; }
tr.dr { cursor: pointer; }
.tw tr.dr:hover > *, .tw tr.dr:focus-within > * { background: var(--hover); }
/* Row drill-down: plain text with a chevron, not a link */
button.drill {
  font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0;
  text-align: left; cursor: pointer;
}
.chev { margin-left: 5px; color: var(--accent); font-weight: 600; }
button.sort {
  background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit;
  cursor: pointer; text-align: inherit;
}
button.sort:hover { text-decoration: underline; }
.sarr { color: var(--muted); }
.more { margin: 8px 0; font-size: .8125rem; }
.empty { color: var(--muted); }
td.desc { min-width: 16em; max-width: 40em; }

/* About */
.prose { max-width: 46em; padding-top: 14px; }
.prose h1 { font-size: 1.35rem; font-weight: 600; margin: 4px 0 6px; }
.prose h2 { font-size: 1.05rem; font-weight: 600; margin: 26px 0 6px; }
.prose li { margin: 3px 0; }

/* Filter bar: one row of labelled controls that wraps */
@media (min-width: 700px) {
  .fbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 7px 0 8px; }
  .fbar .field, .fbar .range { display: flex; align-items: center; gap: 6px; }
  .flabel, .fbar .field > label { white-space: nowrap; }
  #f-vendor { width: 13em; }
  #f-agency { width: 14em; }
  .catf .dd { min-width: 12.5em; display: flex; justify-content: space-between; align-items: center; }   /* same width for All and "2 selected" */
  .chipbar [data-clear] { display: none; }        /* the filter bar's Clear all filters is right above */
  /* Chips wrap beside the label, not under it; the label lines up with the first line of chips */
  .chipbar { align-items: flex-start; }
  .chips-l { line-height: 26px; }
  .chips { flex: 1 1 0; min-width: 0; }
  .vendf { position: relative; }
  /* The vendor message shows under the box, over the content below, until the next click or change */
  .vendf .fmsg {
    position: absolute; left: 0; top: calc(100% + 3px); z-index: 20; margin: 0; padding: 3px 8px; white-space: nowrap;
    color: var(--fg); background: var(--bg); border: 1px solid var(--rule-strong); border-radius: 3px;
  }
  /* Category popover: the header row stays, the list scrolls when the window is too short for it */
  .catpop {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 20; display: flex; flex-direction: column;
    width: 36em; max-width: calc(100vw - 32px); max-height: 70vh; box-shadow: 0 6px 18px var(--shadow);
  }
  .catpop[hidden] { display: none; }
  .cathead { flex: none; }
  .catbox { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .catcols { columns: 2 15em; }
}
@media (min-width: 700px) and (max-width: 1199px) {
  th, td { padding: 5px 7px; }
  #tbl-main tbody th { min-width: 11em; }
}

/* Fixed layout: the page does not scroll. The table region scrolls in both directions, so its header
   row can stay at the top while the first column stays at the left. Everything in the region except the
   main table keeps the region's width and stays in place when the table is scrolled sideways. */
@media (min-width: 1000px) and (min-height: 560px), (min-width: 700px) and (min-height: 660px) {
  html { overflow: hidden; }
  body { height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
  .site, .fwrap, .top { flex: none; }
  main, .explore, .area { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .explore[hidden] { display: none; }
  .page, .scroller { flex: 1 1 auto; min-height: 0; padding-bottom: 24px; }
  .page { overflow-y: auto; scrollbar-gutter: stable; }
  .page[hidden] { display: none; }
  /* A classic scrollbar keeps its own gutter, so 100cqi below is the width beside it, not under it */
  .scroller { overflow: auto; scrollbar-gutter: stable; container-type: inline-size; border-top: 1px solid var(--rule); }
  .sc-in { width: fit-content; min-width: 100%; }
  /* Sticky insets count from the region's content edge, inside its padding (the gutter) */
  .sc-in > *, #tbl-main > *, .tmain > * { position: sticky; left: 0; width: 100cqi; }
  .sc-in > #tbl-main, #tbl-main > .tmain, .tmain > .tw { position: static; width: auto; }
  #tbl-main .tw { overflow: visible; }
  /* Separate borders, so the borders of the sticky cells move with them */
  #tbl-main table { border-collapse: separate; border-spacing: 0; }
  #tbl-main tbody tr:last-child > * { border-bottom: 0; }
  #tbl-main thead th { position: sticky; top: 0; z-index: 2; }
  #tbl-main .tw thead tr > :first-child { z-index: 3; }
  /* Covers the gutter left of the first column, where the table passes when scrolled sideways */
  #tbl-main .tw tr > :first-child::before {
    content: ""; position: absolute; top: 0; bottom: -1px; right: 100%; width: var(--gut); background: var(--bg); pointer-events: none;
  }
}

/* Phones: the filters fold away behind a Filters button and stack */
@media (max-width: 699px) {
  .fwrap { border-bottom: 0; }
  .ftoggle { display: inline-block; margin-top: 12px; min-height: 40px; }
  .fbar { display: none; border: 1px solid var(--rule); padding: 10px 12px; margin-top: 8px; }
  .fbar.open { display: block; }
  .fbar .field, .fbar .npf { margin: 0 0 12px; }
  .flabel, .fbar .field > label { display: block; margin: 0 0 3px; }
  .fbar select, .fbar input[type=text], .dd { width: 100%; min-height: 40px; }
  .range select { flex: 1 1 0; min-width: 0; }
  .dd { display: flex; justify-content: space-between; align-items: center; }
  .catpop { margin-top: 6px; }
  .catclr { min-height: 36px; padding: 0 12px; }
  .catbox .chk { padding: 7px 0; }
  .catbox .chk input { margin-top: 1px; width: 18px; height: 18px; }
  #f-clear { min-height: 40px; }
  .fcount { margin: 10px 0 0; }
  .fshow { display: block; width: 100%; min-height: 40px; margin-top: 12px; }
  .top { padding-top: 12px; }
  .seg button { min-height: 40px; }
  .chip button { min-height: 32px; min-width: 32px; }
  .chipbar [data-clear] { display: none; }        /* the Filters panel has Clear all filters */
  #tcsv { margin-left: auto; }
  button.sort { display: block; width: 100%; }
  thead th:has(> button.sort) { padding: 0; }
  thead th > button.sort { padding: 9px 10px; }
  .tsearch { flex: 1 1 100%; }
  .tsearch input { flex: 1; width: auto; min-width: 0; }
  .tcount { margin-left: 0; }
}
@media (max-width: 640px) {
  body { font-size: 14px; }
  table { font-size: .8125rem; }
  th, td { padding: 4px 5px; }
  thead th > button.sort { padding: 9px 5px; }
  tbody th, #tbl-main tbody th { min-width: 7em; }
  .opt { display: none; }
  td.desc { min-width: 12em; }
  dl.facts > div { grid-template-columns: 8.5em minmax(0, 1fr); gap: 6px; }
  .gbar { align-items: flex-start; gap: 8px; }
  .gbar-l { line-height: 40px; }
  .seg { flex-wrap: wrap; gap: 4px; overflow: visible; margin: 0; padding: 0; }
  .seg button, .seg button:first-child, .seg button:last-child { margin: 0; border-radius: 3px; }
}
</style>
</head>
<body>
<a class="skip" href="#/" id="skip">Skip to table</a>
<header class="site">
  <div class="wrap hdr">
    <p class="site-title"><a href="#/" id="home-link">Utah fire agency vendor payments</a></p>
    <p class="asof" id="asof"></p>
    <a href="#/about" id="about-link" class="about-link">About</a>
  </div>
</header>

<main id="main" tabindex="-1">
  <div id="page" class="page" tabindex="-1"><p>Loading data...</p></div>
  <div id="explore" class="explore" hidden>
    <h1 class="vh" id="page-h">Payments by category</h1>
    <div class="fwrap">
      <div class="wrap">
        <button type="button" class="btn ftoggle" id="ftoggle" aria-expanded="false" aria-controls="fpanel">Filters</button>
        <section class="fbar" id="fpanel" aria-labelledby="fp-h">
          <h2 class="vh" id="fp-h">Filters</h2>
          <div class="field" role="group" aria-labelledby="f-yrs-l">
            <span class="flabel" id="f-yrs-l">Fiscal years</span>
            <span class="range">
              <label for="f-from" class="vh">From</label><select id="f-from"></select>
              <label for="f-to">to</label><select id="f-to"></select>
            </span>
          </div>
          <div class="field catf" id="f-cat-wrap">
            <button type="button" class="dd" id="f-cat-btn" aria-expanded="false" aria-controls="f-cat-pop"><span id="f-cat-txt">Category: All</span><span class="car" aria-hidden="true">▼</span></button>
            <div class="catpop" id="f-cat-pop" role="group" aria-labelledby="f-cat-l" tabindex="-1" hidden>
              <div class="cathead">
                <span class="flabel" id="f-cat-l">Category <span class="ncat" id="f-cat-n"></span></span>
                <button type="button" class="btn catclr" id="f-cat-clear" aria-label="Clear categories" disabled>Clear</button>
              </div>
              <div class="catbox" id="f-cat-box"></div>
            </div>
          </div>
          <div class="field vendf">
            <label for="f-vendor">Vendor</label>
            <input type="text" id="f-vendor" list="vendor-list" autocomplete="off" spellcheck="false" placeholder="Pick a vendor" aria-describedby="f-vendor-msg">
            <datalist id="vendor-list"></datalist>
            <p class="fmsg" id="f-vendor-msg" aria-live="polite"></p>
          </div>
          <div class="field"><label for="f-agency">Agency</label><select id="f-agency"></select></div>
          <div class="field"><label for="f-county">County</label><select id="f-county"></select></div>
          <div class="field"><label for="f-size">Annual expenses</label><select id="f-size" aria-describedby="f-size-desc"></select><span id="f-size-desc" class="vh">Median of total expenses in the last three fully reported fiscal years; for cities, towns and counties, their fire expenses</span></div>
          <p class="fcount" id="f-count"></p><span class="vh" id="f-live" aria-live="polite"></span>
          <div class="chk npf"><input type="checkbox" id="f-np"><label for="f-np">Include non-purchasing payments</label></div>
          <button type="button" class="btn" id="f-clear">Clear all filters</button>
          <button type="button" class="btn fshow" id="fshow">Show rows</button>
        </section>
      </div>
    </div>
    <div class="area" id="area">
      <div class="wrap top">
        <div class="gbar">
          <span class="gbar-l" id="gb-l">Group by</span>
          <div class="seg" role="group" aria-labelledby="gb-l">
            <button type="button" id="gb-category" data-g="category" aria-pressed="true">Category</button>
            <button type="button" id="gb-vendor" data-g="vendor" aria-pressed="false">Vendor</button>
            <button type="button" id="gb-agency" data-g="agency" aria-pressed="false">Agency</button>
            <button type="button" id="gb-year" data-g="year" aria-pressed="false">Fiscal year</button>
            <button type="button" id="gb-none" data-g="none" aria-pressed="false">Yearly totals</button>
          </div>
        </div>
        <div class="chipbar" id="chips"></div>
        <p class="summary" id="summary" tabindex="-1"></p>
        <div class="toolbar" id="tbar"></div>
      </div>
      <div class="scroller" id="scroller" tabindex="-1">
        <div class="sc-in">
          <div id="context"></div>
          <section class="tbl wide" id="tbl-main" aria-labelledby="page-h"></section>
          <div id="more"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
'use strict';

/* ==========================================================================
   Core: indexing, aggregation and interface state. No DOM access, so it also
   runs in node (see the test script). Every number on the page comes from here.
   ========================================================================== */
const Core = (function () {
  // Size by annual expenses: the median of the last three fully reported fiscal years (lo inclusive, hi exclusive)
  const SIZES = [
    { id: 'under-1m', label: 'Under $1M', lo: -Infinity, hi: 1e6 },
    { id: '1m-5m', label: '$1M–$5M', lo: 1e6, hi: 5e6 },
    { id: '5m-20m', label: '$5M–$20M', lo: 5e6, hi: 2e7 },
    { id: 'over-20m', label: 'Over $20M', lo: 2e7, hi: Infinity },
  ];

  // Some payee names arrive with HTML entities in them (e.g. "&amp;"). Show them as text.
  const ENT = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", '#39': "'" };
  const decodeEntities = s => (typeof s === 'string' && s.indexOf('&') >= 0
    ? s.replace(/&(amp|lt|gt|quot|apos|#39);/g, (m, e) => ENT[e]) : s);

  // Category lookups shared by every view
  function catIndex(categories) {
    const cat = new Map();
    const groups = [];
    categories.forEach((c, i) => {
      cat.set(c.id, Object.assign({ pos: i }, c));
      if (!groups.includes(c.group)) groups.push(c.group);
    });
    const catIds = categories.map(c => c.id);                  // category id by category index
    // Category search terms ("air pack; breathing apparatus" -> ["air pack", "breathing apparatus"])
    const catTerms = new Map(categories.map(c => [c.id, (c.terms || '').split(';').map(s => s.trim()).filter(Boolean)]));
    return { cat, groups, catIds, catTerms };
  }
  // agency id -> {year: latest of the years used, years, amount}: annual expenses are the median of the last three
  // fully reported fiscal years, so one year of capital spending does not move an agency to a larger size range.
  // partialOf(a): the partial fiscal years of the agency's state.
  function latestOf(agencies, partialOf) {
    const latest = new Map();
    for (const a of agencies) {
      const partial = partialOf(a);
      const ys = Object.keys(a.budget || {}).map(Number).filter(y => !partial.has(y) && a.budget[y] != null).sort((x, y) => x - y).slice(-3);
      if (ys.length) {
        const v = ys.map(y => a.budget[y]).sort((x, y) => x - y);
        const mid = v.length >> 1;
        latest.set(a.id, { year: ys[ys.length - 1], years: ys, amount: v.length % 2 ? v[mid] : (v[mid - 1] + v[mid]) / 2 });
      }
    }
    return latest;
  }
  function grantsByAgency(grants) {
    const grantsBy = new Map();                                // agency id -> FEMA grants
    for (const g of grants) {
      if (!grantsBy.has(g.agency)) grantsBy.set(g.agency, []);
      grantsBy.get(g.agency).push(g);
    }
    return grantsBy;
  }
  const NONE = Object.freeze([]);

  // Lookup tables for one set of rows (a view, or a legacy data.json).
  // D.rows: [agency id, vendor index, fiscal year, category index, net amount, payee name index (-1: withheld)]
  // o: {vendorPos (vendor id -> index, the vendors in this view), valiases(vi), vcategory(vi), latest, grantsBy, agency}
  function indexOf(D, o) {
    const meta = D.meta;
    const years = meta.years.slice().sort((a, b) => a - b);
    const partial = new Set(meta.partial_years || []);
    const { cat, groups, catIds, catTerms } = o.cats || catIndex(D.categories);
    const vendorPos = o.vendorPos;
    // Categories each vendor's rows are in (all years and agencies), in category order
    const vcatSets = new Map();
    for (const r of D.rows) {
      let s = vcatSets.get(r[1]);
      if (!s) vcatSets.set(r[1], (s = new Set()));
      s.add(r[3]);
    }
    const vcats = new Array(D.vendors.length).fill(NONE);
    for (const [vi, s] of vcatSets) vcats[vi] = [...s].sort((a, b) => a - b).map(i => catIds[i]);
    // Lowercase name plus every reported payee name, for search ('' for vendors outside the view)
    const vendorText = new Array(D.vendors.length).fill('');
    for (const vi of vendorPos.values()) {
      vendorText[vi] = [D.vendors[vi].name].concat(o.valiases(vi).map(i => D.aliases[i])).join('\n').toLowerCase();
    }
    const counties = o.counties || [...new Set(D.agencies.map(a => a.county).filter(Boolean))].sort();
    return {
      D, meta, years, partial, cat, groups, catIds, vcats, vendorPos, vendorText, counties, catTerms,
      agency: o.agency || new Map(D.agencies.map(a => [a.id, a])),
      latest: o.latest || latestOf(D.agencies, () => partial),
      grantsBy: o.grantsBy || grantsByAgency(D.grants),
      valiases: o.valiases,                                    // vendor index -> payee name indexes in this view
      vcategory: o.vcategory,                                  // vendor index -> main category id in this view
      P: null,                                                 // single payments, set by setPayments
    };
  }
  // Lookup tables for a legacy data/data.json (Utah only, numeric agency ids), as the page had them
  // before the states were split. Kept for the tests.
  function buildIndex(D) {
    for (const v of D.vendors) v.name = decodeEntities(v.name);
    D.aliases = D.aliases.map(decodeEntities);
    return indexOf(D, {
      vendorPos: new Map(D.vendors.map((v, i) => [v.id, i])),
      valiases: vi => D.vendors[vi].aliases,
      vcategory: vi => D.vendors[vi].category,
    });
  }

  /* ---- Store: data/index.json plus every state file loaded so far ----
     The page starts with data/index.json (agencies of every state, categories and the precomputed
     default tables in home). A state's rows (data/<st>.json) and single payments (data/<st>-payments.json)
     load when a view needs them. Vendors are shared by id: each state file's vendor indexes are mapped to
     one global list, and payee names and descriptions are appended to global lists. */
  function buildStore(I) {
    const meta = I.meta;
    if (!meta || !Array.isArray(meta.states_order) || !Array.isArray(I.agencies) || !Array.isArray(I.categories)) {
      throw new Error('data/index.json is missing meta, agencies or categories');
    }
    const order = meta.states_order.slice();
    const st = {};
    for (const s of order) {
      const m = meta.states[s];
      st[s] = {
        code: s, meta: m, name: m.name, partial: new Set(m.partial_years || []),
        agencies: I.agencies.filter(a => a.state === s),
        rows: null,          // set by addState: rows with global vendor and payee name indexes
        grants: [], totals: [],
        vmap: null,          // local vendor index -> global
        vcat: new Map(),     // global vendor index -> the state's main category of the vendor
        valias: new Map(),   // global vendor index -> global payee name indexes
        aoff: 0,             // offset of the state's payee names in the global list
        payments: null,      // set by addPayments
        items: null,         // set by addItems
      };
      st[s].counties = [...new Set(st[s].agencies.map(a => a.county).filter(Boolean))].sort();
    }
    const store = {
      I, meta, order, st, categories: I.categories, home: I.home || {},
      cats: catIndex(I.categories),
      agencies: I.agencies,
      agency: new Map(I.agencies.map(a => [a.id, a])),
      vendors: [], vendorPos: new Map(), aliases: [], descriptions: [],
      grantsBy: new Map(),
      views: new Map(),     // scope -> view, cleared when data is added
      version: 0,           // counts addState calls
      payVersion: 0,        // counts addPayments calls
    };
    store.latest = latestOf(I.agencies, a => (st[a.state] ? st[a.state].partial : new Set(meta.partial_years || [])));
    return store;
  }
  const isLoaded = (store, s) => !!(store.st[s] && store.st[s].rows);
  // data/<st>.json: {built, state, vendors, aliases, rows, grants, totals}, indexes local to the file
  function addState(store, s, D) {
    const S = store.st[s];
    if (!S) throw new Error('Unknown state ' + s);
    if (S.rows) return S;
    const file = S.meta.files && S.meta.files.rows || s;
    if (!D || D.state !== s || !Array.isArray(D.vendors) || !Array.isArray(D.aliases) || !Array.isArray(D.rows)) {
      throw new Error(file + ' is not the ' + S.name + ' data file');
    }
    if (D.built !== store.meta.built) {
      throw new Error(file + ' (built ' + D.built + ') is not from the same build as data/index.json (built ' + store.meta.built + ')');
    }
    const nc = store.categories.length, na = D.aliases.length, nv = D.vendors.length;
    for (const r of D.rows) {
      const a = store.agency.get(r[0]);
      if (!a || a.state !== s || !(r[1] >= 0 && r[1] < nv) || !(r[3] >= 0 && r[3] < nc) || !(r[5] >= -1 && r[5] < na)) {
        throw new Error(file + ' does not match data/index.json');
      }
    }
    const aoff = store.aliases.length;
    for (const x of D.aliases) store.aliases.push(decodeEntities(x));
    const vmap = new Array(nv);
    D.vendors.forEach((v, i) => {
      let gi = store.vendorPos.get(v.id);
      if (gi == null) {
        gi = store.vendors.length;
        store.vendors.push({ id: v.id, name: decodeEntities(v.name), method: v.method, neris: v.neris });
        store.vendorPos.set(v.id, gi);
      }
      vmap[i] = gi;
      S.vcat.set(gi, v.category);
      S.valias.set(gi, (v.aliases || []).map(x => x + aoff));
    });
    for (const r of D.rows) {
      r[1] = vmap[r[1]];
      if (r[5] >= 0) r[5] += aoff;
    }
    S.vmap = vmap;
    S.aoff = aoff;
    S.na = na;
    S.grants = D.grants || [];
    S.totals = D.totals || [];
    S.rows = D.rows;
    const all = [];
    for (const x of store.order) if (store.st[x].rows) for (const g of store.st[x].grants) all.push(g);
    store.grantsBy = grantsByAgency(all);
    store.version++;
    store.views.clear();
    return S;
  }
  // data/<st>-payments.json: {built, state, payments, descriptions}, after the state's rows.
  // p = [agency id, posting date, vendor index, category index, amount, description index, payee name index, fiscal year]
  function addPayments(store, s, P) {
    const S = store.st[s];
    if (!S || !S.rows) throw new Error('Payments of ' + s + ' before its rows');
    if (S.payments) return S.payments;
    const file = S.meta.files && S.meta.files.payments || s;
    if (!P || P.state !== s || !Array.isArray(P.payments) || !Array.isArray(P.descriptions)) throw new Error(file + ' has no payments list');
    if (P.built !== store.meta.built) {
      throw new Error(file + ' (built ' + P.built + ') is not from the same build as data/index.json (built ' + store.meta.built + ')');
    }
    const nv = S.vmap.length, nc = store.categories.length, nd = P.descriptions.length, na = S.na;
    for (const p of P.payments) {
      const a = store.agency.get(p[0]);
      if (!a || a.state !== s || !(p[2] >= 0 && p[2] < nv) || !(p[3] >= 0 && p[3] < nc) ||
          !(p[5] >= 0 && p[5] < nd) || !(p[6] >= -1 && p[6] < na)) {
        throw new Error(file + ' does not match ' + (S.meta.files && S.meta.files.rows || s));
      }
    }
    const doff = store.descriptions.length;
    for (const d of P.descriptions) store.descriptions.push(cleanDesc(d));
    for (const p of P.payments) {
      p[2] = S.vmap[p[2]];
      p[5] += doff;
      if (p[6] >= 0) p[6] += S.aoff;
    }
    S.payments = P.payments;
    store.payVersion++;
    return S.payments;
  }
  // Some descriptions carry control characters between items; show them as spaces
  const cleanDesc = s => decodeEntities(String(s)).replace(/[\u0000-\u001f\u007f]+/g, ' ').replace(/ {2,}/g, ' ').trim();
  // data/<st>-items.json: {built, state, sources, strings, items}; item = [agency id, fiscal year, date,
  // vendor index, brand, product type, description (string indexes), quantity, unit price, amount, category index, source index]
  function addItems(store, s, X) {
    const S = store.st[s];
    if (!S || !S.rows) throw new Error('Items of ' + s + ' before its rows');
    if (S.items) return S.items;
    const file = S.meta.files && S.meta.files.items || s;
    if (!X || X.state !== s || !Array.isArray(X.items) || !Array.isArray(X.strings)) throw new Error(file + ' has no items list');
    if (X.built !== store.meta.built) {
      throw new Error(file + ' (built ' + X.built + ') is not from the same build as data/index.json (built ' + store.meta.built + ')');
    }
    const nv = S.vmap.length, ns = X.strings.length, nc = store.categories.length, nsrc = (X.sources || []).length;
    const okStr = i => i === -1 || i == null || (i >= 0 && i < ns);
    for (const it of X.items) {
      const a = store.agency.get(it[0]);
      if (!a || a.state !== s || !(it[3] >= 0 && it[3] < nv) || !okStr(it[4]) || !okStr(it[5]) || !okStr(it[6]) ||
          !(it[10] >= 0 && it[10] < nc) || !(it[11] >= 0 && it[11] < nsrc)) {
        throw new Error(file + ' does not match ' + (S.meta.files && S.meta.files.rows || s));
      }
    }
    for (const it of X.items) it[3] = S.vmap[it[3]];
    S.items = { sources: X.sources || [], strings: X.strings.map(cleanDesc), items: X.items };
    store.views.clear();
    return S.items;
  }

  const scopeStates = (store, scope) => (scope === 'ALL' ? store.order.slice() : [scope]);
  const scopeYears = (store, scope) => (scope === 'ALL' ? store.meta.years : store.st[scope].meta.years).slice().sort((a, b) => a - b);
  // A view: the lookup tables of indexOf for one scope (one state, or 'ALL'), over the rows loaded so far.
  // For scope UT it equals the index the page built from Utah's data.json before the split.
  // loaded: every state in the scope is loaded. pre: the precomputed default table of the scope.
  function view(store, scope) {
    let v = store.views.get(scope);
    if (v) return v;
    const sts = scopeStates(store, scope);
    const loadedSts = sts.filter(s => isLoaded(store, s));
    const rows = loadedSts.length === 1 ? store.st[loadedSts[0]].rows : [].concat(...loadedSts.map(s => store.st[s].rows));
    const grants = [].concat(...loadedSts.map(s => store.st[s].grants));
    const meta = scope === 'ALL'
      ? Object.assign({}, store.meta, { years: scopeYears(store, scope) })
      : Object.assign({ built: store.meta.built, state: scope }, store.st[scope].meta);
    const agencies = scope === 'ALL' ? store.agencies : store.st[scope].agencies;
    const D = { meta, categories: store.categories, agencies, vendors: store.vendors, aliases: store.aliases, rows, grants };
    // The vendors of the scope's files (with rows, single payments or item lines there)
    const vendorPos = new Map();
    for (const s of loadedSts) for (const gi of store.st[s].vmap) if (!vendorPos.has(store.vendors[gi].id)) vendorPos.set(store.vendors[gi].id, gi);
    const valiases = sts.length === 1
      ? vi => store.st[sts[0]].valias.get(vi) || NONE
      : vi => {
        const out = [], seen = new Set();
        for (const s of loadedSts) {
          for (const i of store.st[s].valias.get(vi) || NONE) {
            if (seen.has(store.aliases[i])) continue;
            seen.add(store.aliases[i]);
            out.push(i);
          }
        }
        return out;
      };
    // Main category: the state file's; over several states, the category with the largest net amount
    let mainCat = null;
    const vcategory = sts.length === 1
      ? vi => store.st[sts[0]].vcat.get(vi) || null
      : vi => {
        if (!mainCat) mainCat = catsByVendor({ catIds: store.cats.catIds }, rows);
        const l = mainCat.get(vi);
        if (l && l.length) return l[0];
        for (const s of loadedSts) if (store.st[s].vcat.has(vi)) return store.st[s].vcat.get(vi);
        return null;
      };
    v = indexOf(D, {
      cats: store.cats, vendorPos, valiases, vcategory,
      agency: store.agency, latest: store.latest, grantsBy: store.grantsBy,
      counties: scope === 'ALL' ? [] : store.st[scope].counties,
    });
    v.store = store;
    v.scope = scope;
    v.states = sts;
    v.loaded = loadedSts.length === sts.length;
    v.pre = store.home[scope] || null;
    // Single payments of the scope, once every state in it has them
    let pv = -1, pc = null;
    Object.defineProperty(v, 'P', {
      enumerable: true,
      get() {
        if (pv !== store.payVersion) {
          pv = store.payVersion;
          const ps = sts.map(s => store.st[s].payments);
          pc = ps.every(Boolean) ? { payments: ps.length === 1 ? ps[0] : [].concat(...ps), descriptions: store.descriptions } : null;
        }
        return pc;
      },
    });
    store.views.set(scope, v);
    return v;
  }

  // The scope of URL parameters p: the selected agency's state, else the state filter, else 'ALL'.
  // A numeric agency id is an older Utah link (UT-<id>). A county without a state picks Utah when Utah
  // has that county (older links were all Utah), else the one state that has it.
  function resolve(store, p) {
    const has = k => p[k] != null && p[k] !== '';
    const bad = [];
    let agency = null;
    if (has('agency')) {
      const raw = String(p.agency);
      const id = /^\d+$/.test(raw) ? 'UT-' + raw : raw;
      if (store.agency.has(id)) agency = id;
    }
    let state = '';
    if (has('state')) {
      const s = String(p.state).toUpperCase();
      if (store.st[s]) state = s; else bad.push('state "' + p.state + '"');
    }
    let county = has('county') ? String(p.county) : '';
    if (county && !state) {
      const withC = store.order.filter(s => store.st[s].counties.includes(county));
      if (withC.includes('UT')) state = 'UT';
      else if (withC.length === 1) state = withC[0];
      else if (!agency || !withC.includes(store.agency.get(agency).state)) {
        bad.push('county "' + county + '"' + (withC.length ? ' (choose a state)' : ''));
      }
    }
    const scope = agency ? store.agency.get(agency).state : state || 'ALL';
    return { agency, state, scope, bad };
  }
  // The default view of a scope (no filters, all years, grouped by category) is precomputed in
  // data/index.json, so it shows before any state file loads. Other views need the scope's states.
  function isHome(store, p, scope) {
    const has = k => p[k] != null && p[k] !== '';
    if (['cat', 'group', 'purch', 'vendor', 'agency', 'year', 'county', 'size', 'np', 'q'].some(has)) return false;
    if (has('g') && p.g !== 'category') return false;
    if (!store.home[scope]) return false;
    const ys = scopeYears(store, scope);
    if (has('from') && Number(p.from) !== ys[0]) return false;
    if (has('to') && Number(p.to) !== ys[ys.length - 1]) return false;
    return true;
  }
  // What a view of URL parameters p needs: {scope, states, missing (states not loaded), pre (precomputed)}
  function needs(store, p) {
    p = p || {};
    const R = resolve(store, p);
    const states = scopeStates(store, R.scope);
    return { scope: R.scope, states, missing: states.filter(s => !isLoaded(store, s)), pre: isHome(store, p, R.scope) };
  }
  // The scope a state s (from normState) is in
  const scopeOf = (store, s) => (s.agency != null && store.agency.has(s.agency) ? store.agency.get(s.agency).state : s.state || 'ALL');

  // Single payments from data/payments.json, loaded when a view first needs them:
  // P.payments: [agency id, posting date, vendor index, category index, amount, description index, payee name index, fiscal year]
  // The indexes point into the data.json of the same build, so a file from another build is refused.
  function setPayments(ix, P) {
    if (!P || !Array.isArray(P.payments) || !Array.isArray(P.descriptions)) throw new Error('data/payments.json has no payments list');
    if (P.built !== ix.meta.built) {
      throw new Error('data/payments.json (built ' + P.built + ') is not from the same build as data/data.json (built ' + ix.meta.built + ')');
    }
    const nv = ix.D.vendors.length, nc = ix.catIds.length, na = ix.D.aliases.length, nd = P.descriptions.length;
    for (const p of P.payments) {
      if (!ix.agency.has(p[0]) || !(p[2] >= 0 && p[2] < nv) || !(p[3] >= 0 && p[3] < nc) ||
          !(p[5] >= 0 && p[5] < nd) || !(p[6] >= -1 && p[6] < na)) {
        throw new Error('data/payments.json does not match data/data.json');
      }
    }
    // Some descriptions carry control characters between items; show them as spaces
    const descriptions = P.descriptions.map(s => decodeEntities(String(s)).replace(/[\u0000-\u001f\u007f]+/g, ' ').replace(/ {2,}/g, ' ').trim());
    ix.P = { payments: P.payments, descriptions };
    return ix.P;
  }

  // Global filters from URL parameters (strings). Unknown values fall back to defaults.
  function normGlobal(ix, p) {
    const ys = ix.years;
    let from = Number(p.from), to = Number(p.to);
    if (!ys.includes(from)) from = ys[0];
    if (!ys.includes(to)) to = ys[ys.length - 1];
    if (from > to) [from, to] = [to, from];
    return {
      from, to,
      county: ix.counties.includes(p.county) ? p.county : '',
      size: SIZES.some(z => z.id === p.size) ? p.size : '',
      np: p.np === '1',
    };
  }

  // Agencies that pass the county and annual expenses filters.
  function peerIds(ix, g) {
    const z = SIZES.find(x => x.id === g.size);
    const out = new Set();
    for (const a of ix.D.agencies) {
      if (g.county && a.county !== g.county) continue;
      if (z) {
        const l = ix.latest.get(a.id);
        if (!l || l.amount < z.lo || l.amount >= z.hi) continue;
      }
      out.add(a.id);
    }
    return out;
  }

  // The category id of a row, r = [agency id, vendor index, fiscal year, category index, net amount, alias index],
  // and of a single payment, p = [agency id, date, vendor index, category index, amount, description, alias, fiscal year].
  // Each row and payment carries its own category (one vendor's lines can be in several). Everything
  // that filters or groups by category looks the category up here.
  const rowCat = (ix, r) => ix.catIds[r[3]];
  const payCat = (ix, p) => ix.catIds[p[3]];

  // Purchasing categories only: the default, unless g.np is set, or the filters name a category, group
  // or purchasing flag, or a vendor none of whose payments are in a purchasing category. A vendor with
  // payments in both kinds keeps the default, so its row in the vendor grouping and the table it leads
  // to have the same total.
  function purchOnly(ix, g, f) {
    f = f || {};
    if (g.np || f.cat != null || f.group != null || f.purch != null) return false;
    if (f.vendor == null) return true;
    return vendorCats(ix, f.vendor).some(id => ix.cat.get(id).purchasing === 'yes');
  }
  // Which categories pass global filters g and row filters f: {category id: true|false}.
  // f.cat is one category id or a list of them; a category passes when it is any of them.
  // Non-purchasing categories are left out when purchOnly.
  function catFilter(ix, g, f) {
    f = f || {};
    const cats = f.cat == null ? null : new Set([].concat(f.cat));
    const onlyPurch = purchOnly(ix, g, f);
    const ok = {};
    for (const [id, c] of ix.cat) {
      ok[id] = (cats == null || cats.has(id)) &&
        (f.group == null || c.group === f.group) &&
        (f.purch == null || c.purchasing === f.purch) &&
        (!onlyPurch || c.purchasing === 'yes');
    }
    return ok;
  }

  // Rows matching global filters g and row filters f = {cat, group, purch, vendor, agency, year}.
  //  - f.agency selects one agency and ignores the peer filters.
  //  - f.year selects one fiscal year and overrides the from/to range.
  //  - Categories as in catFilter.
  function selectRows(ix, g, f) {
    f = f || {};
    const y0 = f.year != null ? f.year : g.from;
    const y1 = f.year != null ? f.year : g.to;
    const peers = f.agency != null ? null : peerIds(ix, g);
    let vi = null;
    if (f.vendor != null) vi = ix.vendorPos.has(f.vendor) ? ix.vendorPos.get(f.vendor) : -2;
    const okCat = catFilter(ix, g, f);
    const out = [];
    for (const r of ix.D.rows) {
      if (r[2] < y0 || r[2] > y1) continue;
      if (vi != null && r[1] !== vi) continue;
      if (f.agency != null ? r[0] !== f.agency : !peers.has(r[0])) continue;
      if (!okCat[rowCat(ix, r)]) continue;
      out.push(r);
    }
    return out;
  }
  // Categories a vendor's rows are in (all years and agencies), in category order.
  const vendorCats = (ix, vendorId) => (ix.vendorPos.has(vendorId) ? ix.vcats[ix.vendorPos.get(vendorId)].slice() : []);
  // Categories of each vendor in the given rows, main one first: Map vendor index -> [category id, ...].
  // The main category is the one with the largest net amount (positive amounts first; a tie goes to the
  // later category id in alphabetical order), as in the build.
  function catsByVendor(ix, rows) {
    const net = new Map();
    for (const r of rows) {
      let m = net.get(r[1]);
      if (!m) net.set(r[1], (m = new Map()));
      m.set(r[3], (m.get(r[3]) || 0) + r[4]);
    }
    const out = new Map();
    for (const [vi, m] of net) {
      const list = [...m].map(([c, x]) => [ix.catIds[c], x]);
      list.sort((a, b) => (b[1] > 0) - (a[1] > 0) || (a[1] > 0 ? b[1] - a[1] : Math.abs(b[1]) - Math.abs(a[1])) || (a[0] < b[0] ? 1 : a[0] > b[0] ? -1 : 0));
      out.set(vi, list.map(x => x[0]));
    }
    return out;
  }

  function emptyAgg(key) {
    return { key, spend: 0, n: 0, ag: new Set(), ve: new Set(), yr: {}, last: null };
  }

  // Group rows by keyFn: net spend, row count, spend per year, and who paid whom.
  // An agency paid a vendor in a fiscal year when the net of its rows for that agency, vendor, year
  // and category (all payee names) is positive. Agencies (ag), vendors (ve) and the last year paid
  // come from those agency-vendor-year-categories only, so an agency with nothing but credits or
  // corrections from a vendor is in the spend but not in the counts. Every grouping (category, vendor,
  // agency, year) keeps each agency-vendor-year-category whole, so grouped counts add up to the totals:
  // keyFn must depend on the agency, vendor, year and category of a row only.
  // total (optional, an emptyAgg): also gets the totals over all rows, as summary(rows) would.
  const AGI = new Map();                                     // agency id -> small number, for the keys below
  function agg(rows, keyFn, total) {
    const m = new Map();
    const net = new Map();                                   // agency-vendor-year-category -> [group, agency, vendor, year, net]
    for (const r of rows) {
      const k = keyFn(r);
      let o = m.get(k);
      if (!o) m.set(k, (o = emptyAgg(k)));
      o.spend += r[4];
      o.n++;
      o.yr[r[2]] = (o.yr[r[2]] || 0) + r[4];
      if (total) {
        total.spend += r[4];
        total.n++;
        total.yr[r[2]] = (total.yr[r[2]] || 0) + r[4];
      }
      // Agency ids are strings ("UT-359"; numbers in a legacy data.json). A number key is faster than text.
      let ai = AGI.get(r[0]);
      if (ai === undefined) AGI.set(r[0], (ai = AGI.size));
      const y = r[2] - 1950;
      const nk = r[1] < 1048576 && y >= 0 && y < 128 && r[3] >= 0 && r[3] < 128
        ? ((ai * 1048576 + r[1]) * 128 + y) * 128 + r[3] : r[0] + '|' + r[1] + '|' + r[2] + '|' + r[3];
      let e = net.get(nk);
      if (!e) net.set(nk, (e = [o, r[0], r[1], r[2], 0]));
      e[4] += r[4];
    }
    for (const e of net.values()) {
      if (!(e[4] > 0.005)) continue;                         // positive to the cent
      for (const o of total ? [e[0], total] : [e[0]]) {
        o.ag.add(e[1]);
        o.ve.add(e[2]);
        if (o.last == null || e[3] > o.last) o.last = e[3];
      }
    }
    return m;
  }

  // Totals over all given rows.
  function summary(rows) {
    return agg(rows, () => 0).get(0) || emptyAgg(0);
  }

  // FEMA grant dollars for one agency with a federal fiscal year in the selected range.
  function grantsIn(ix, id, g) {
    let s = 0;
    for (const x of ix.grantsBy.get(id) || []) if (x.year >= g.from && x.year <= g.to) s += x.amount;
    return s;
  }

  // Single payments (setPayments) matching global filters g and f = {cat, group, purch, vendor, agency, year}, with
  // the same rules as selectRows; the fiscal year is the one the line was reported in, not the year of its date.
  // p = [agency id, posting date, vendor index, category index, amount, description index, alias index, fiscal year]:
  // transaction lines of $1,000 or more in purchasing categories.
  function selectPayments(ix, g, f) {
    f = f || {};
    const y0 = f.year != null ? f.year : g.from;
    const y1 = f.year != null ? f.year : g.to;
    const peers = f.agency != null ? null : peerIds(ix, g);
    let vi = null;
    if (f.vendor != null) vi = ix.vendorPos.has(f.vendor) ? ix.vendorPos.get(f.vendor) : -2;
    const okCat = catFilter(ix, g, f);
    const out = [];
    for (const p of ix.P ? ix.P.payments : []) {
      if (p[7] < y0 || p[7] > y1) continue;
      if (vi != null && p[2] !== vi) continue;
      if (!okCat[payCat(ix, p)]) continue;
      if (f.agency != null ? p[0] !== f.agency : !peers.has(p[0])) continue;
      out.push(p);
    }
    return out;
  }
  function paymentsModel(ix, g, f) {
    const pays = selectPayments(ix, g, f);
    let total = 0;
    const ag = new Set(), ve = new Set();
    for (const p of pays) { total += p[4]; ag.add(p[0]); ve.add(p[2]); }
    return { pays, n: pays.length, total, ag, ve };
  }

  // Latest of the given fiscal years that is fully reported, or the latest one when all are partial.
  function fullYear(ix, years) {
    const ys = years.slice().sort((a, b) => a - b);
    const full = ys.filter(y => !ix.partial.has(y));
    return full.length ? full[full.length - 1] : ys.length ? ys[ys.length - 1] : null;
  }
  const rangeYears = g => { const out = []; for (let y = g.from; y <= g.to; y++) out.push(y); return out; };

  // Compensation by fiscal year in the range, and job titles for the latest full year in the range with data.
  function staffModel(ix, id, g) {
    const st = (ix.agency.get(id) || {}).staff || {};
    const rows = rangeYears(g).filter(y => st[y]).map(y => ({
      y, people: st[y].people, wages: st[y].wages, benefits: st[y].benefits, total: st[y].wages + st[y].benefits,
    }));
    const titleYear = fullYear(ix, rows.map(r => r.y));
    const titles = titleYear == null ? [] : Object.entries(st[titleYear].titles || {}).map(([title, n]) => ({ title, n }));
    return { rows, titleYear, titles, any: Object.keys(st).length > 0 };
  }

  // Revenue by the agency's own categories, one value per fiscal year in the range. Rows named in
  // revenue_excluded (borrowing, transfers between own funds, donated infrastructure) are listed but
  // left out of the totals.
  function revenueModel(ix, id, g) {
    const a = ix.agency.get(id) || {};
    const rv = a.revenue || {};
    const out = new Set(a.revenue_excluded || []);
    const years = rangeYears(g);
    const m = new Map(), yr = {};
    let total = 0;
    for (const y of years) {
      if (!rv[y]) continue;
      yr[y] = 0;
      for (const [k, v] of Object.entries(rv[y])) {
        let o = m.get(k);
        if (!o) m.set(k, (o = { key: k, yr: {}, total: 0, excluded: out.has(k) }));
        o.yr[y] = v;
        o.total += v;
        if (o.excluded) continue;
        yr[y] += v;
        total += v;
      }
    }
    const rows = [...m.values()];
    return { years, rows, yr, total, anyExcluded: rows.some(o => o.excluded), any: Object.keys(rv).length > 0 };
  }
  function peopleIn(ix, id, y) {
    const s = ((ix.agency.get(id) || {}).staff || {})[y];
    return s ? s.people : null;
  }
  function revenueIn(ix, id, y) {
    const t = ((ix.agency.get(id) || {}).revenue_total || {})[y];
    return t == null ? null : t;
  }
  // Agencies by the month their fiscal year starts: {January: n, July: n, '': n (not reported)}
  function fyStarts(ix) {
    const out = {};
    for (const a of ix.D.agencies) out[a.fy_start || ''] = (out[a.fy_start || ''] || 0) + 1;
    return out;
  }

  // Search: matches at word starts ("pack" finds "air pack", "ack" does not). Null below 2 characters.
  function searchRe(raw) {
    const q = (raw || '').trim().toLowerCase();
    if (q.length < 2) return null;
    const qe = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return new RegExp(/^[a-z0-9]/.test(q) ? '(^|[^a-z0-9])' + qe : qe);
  }
  // Categories matching by name, id or search term; term is set when only a search term matched.
  function searchCategories(ix, re) {
    const hit = s => !!s && re.test(s.toLowerCase());
    const out = [];
    for (const c of ix.D.categories) {
      if (hit(c.name) || hit(c.id.replace(/-/g, ' '))) out.push({ id: c.id, term: null });
      else {
        const t = ix.catTerms.get(c.id).find(hit);
        if (t) out.push({ id: c.id, term: t });
      }
    }
    return out;
  }

  // Older per-page view models, no longer used by the page; kept for the node tests ----------
  function homeModel(ix, g) {
    const rows = selectRows(ix, g, {});
    const catOf = r => ix.cat.get(rowCat(ix, r));
    return {
      peers: peerIds(ix, g),
      rows,
      cats: ix.D.categories.filter(c => g.np || c.purchasing === 'yes'),
      byCat: agg(rows, r => rowCat(ix, r)),
      byGroup: agg(rows, r => catOf(r).group),
      purch: summary(rows.filter(r => catOf(r).purchasing === 'yes')),
      all: summary(rows),
    };
  }
  function categoryModel(ix, g, id) {
    const rows = selectRows(ix, g, { cat: id });
    return {
      peers: peerIds(ix, g), rows, sum: summary(rows),
      byVendor: agg(rows, r => r[1]), byAgency: agg(rows, r => r[0]),
      byPair: agg(rows, r => r[0] + ':' + r[1]),
    };
  }
  function vendorModel(ix, g, vendorId) {
    const rows = selectRows(ix, g, { vendor: vendorId });
    return { peers: peerIds(ix, g), rows, sum: summary(rows), byAgency: agg(rows, r => r[0]) };
  }
  function agencyModel(ix, g, agencyId) {
    const rows = selectRows(ix, g, { agency: agencyId });
    return {
      peers: peerIds(ix, g), rows, sum: summary(rows),
      byVendor: agg(rows, r => r[1]), byCat: agg(rows, r => rowCat(ix, r)),
    };
  }
  function vendorsModel(ix, g) {
    const rows = selectRows(ix, g, {});
    return { peers: peerIds(ix, g), rows, sum: summary(rows), byVendor: agg(rows, r => r[1]) };
  }
  function agenciesModel(ix, g) {
    const rows = selectRows(ix, g, {});
    // year: latest fully reported year in the range, for the people paid and revenue columns
    return { peers: peerIds(ix, g), rows, byAgency: agg(rows, r => r[0]), year: fullYear(ix, rangeYears(g)) };
  }
  function rowsModel(ix, g, f) {
    const rows = selectRows(ix, g, f);
    return { rows, sum: summary(rows) };
  }

  // Interface state ------------------------------------------------------------
  // One table, grouped by g, with global filters (normGlobal) plus row filters.
  // State lives in the URL: #/?g=vendor&cat=apparatus,scba&agency=679&from=2022&to=2024&county=..
  //   &size=..&np=1&q=search&years=1. cat is one or more category ids, separated by commas; in the
  //   state it is null or a list in category order. year=Y is read as from=Y&to=Y. group and purch
  //   are kept from older links (category group; purchasing flag). type and staff (agency type and
  //   staffing filters, since removed) are ignored and reported in bad.
  const GROUPS = ['category', 'vendor', 'agency', 'year', 'none'];

  // Category ids (a list, or text separated by commas) -> {ids: known ids in category order, bad: unknown ones}
  function parseCats(ix, v) {
    const ids = [], bad = [];
    for (const raw of Array.isArray(v) ? v : String(v == null ? '' : v).split(',')) {
      const id = String(raw).trim();
      if (!id) continue;
      if (!ix.cat.has(id)) { if (!bad.includes(id)) bad.push(id); } else if (!ids.includes(id)) ids.push(id);
    }
    ids.sort((a, b) => ix.cat.get(a).pos - ix.cat.get(b).pos);
    return { ids, bad };
  }

  // URL parameters (strings) -> state. Ids that do not match the data are dropped and listed in bad.
  // With the store (the page), the state also has state (the state filter, '' for all states) and scope
  // (see resolve); everything else is checked against the scope's view. With a legacy index (tests), as before.
  function normState(store, p) {
    p = p || {};
    let ix = store, R = null;
    if (store.views) {
      R = resolve(store, p);
      ix = view(store, R.scope);
    }
    const bad = R ? R.bad.slice() : [];
    const gp = Object.assign({}, p);
    const has = k => p[k] != null && p[k] !== '';
    if (has('year')) {
      const y = Number(p.year);
      if (ix.years.includes(y)) { gp.from = y; gp.to = y; } else bad.push('fiscal year "' + p.year + '"');
    }
    const s = normGlobal(ix, gp);
    s.g = GROUPS.includes(p.g) ? p.g : 'category';
    const take = (k, label, ok, val) => {
      s[k] = null;
      if (!has(k)) return;
      if (ok) s[k] = val; else bad.push(label + ' "' + p[k] + '"');
    };
    const pc = parseCats(ix, p.cat);
    s.cat = pc.ids.length ? pc.ids : null;
    for (const id of pc.bad) bad.push('category "' + id + '"');
    take('group', 'category group', ix.groups.includes(p.group), p.group);
    take('purch', 'purchasing flag', p.purch === 'yes' || p.purch === 'no', p.purch);
    if (R && has('vendor') && !ix.vendorPos.has(p.vendor) && store.vendorPos.has(p.vendor)) {
      s.vendor = null;                                         // a vendor of another state
      bad.push('vendor "' + p.vendor + '" (no payments in ' + (R.scope === 'ALL' ? 'these states' : store.st[R.scope].name) + ')');
    } else take('vendor', 'vendor', ix.vendorPos.has(p.vendor), p.vendor);
    if (R) take('agency', 'agency', R.agency != null, R.agency);
    else {
      const ag = Number(p.agency);
      take('agency', 'agency', /^\d+$/.test(String(p.agency)) && ix.agency.has(ag), ag);
    }
    // Category and vendor together are an intersection (it can be empty). The category group and
    // purchasing flag from older links are dropped when they contradict every category of the
    // vendor's rows, or every selected category.
    const ven = s.vendor != null ? ix.D.vendors[ix.vendorPos.get(s.vendor)] : null;
    const fcs = (ven ? vendorCats(ix, s.vendor) : s.cat || []).map(id => ix.cat.get(id));
    const one = ven || fcs.length === 1;                       // the subject is one vendor or one category
    const who = ven ? ven.name : fcs.length === 1 ? fcs[0].name : 'the selected categories';
    if (fcs.length && s.group != null && !fcs.some(c => c.group === s.group)) {
      const gs = [...new Set(fcs.map(c => c.group))];
      bad.push('category group "' + p.group + '" (' + who + (gs.length === 1 ? (one ? ' is in ' : ' are in ') + gs[0] : (one ? ' is' : ' are') + ' not in it') + ')');
      s.group = null;
    }
    if (fcs.length && s.purch != null && !fcs.some(c => c.purchasing === s.purch)) {
      // Every category contradicts the flag, so they all have the other one
      bad.push('purchasing flag "' + p.purch + '" (' + who + (one ? ' is' : ' are') + (s.purch === 'yes' ? ' not' : '') + ' purchasing)');
      s.purch = null;
    }
    if (s.purch === 'yes') { s.purch = null; s.np = false; }   // purchasing only is the default
    s.q = s.g !== 'year' && typeof p.q === 'string' ? p.q : '';
    s.years = p.years === '1';
    if (has('type') || has('staff')) bad.push('agency type and staffing filters (no longer available)');
    if (R) { s.state = R.state; s.scope = R.scope; }
    s.bad = bad;
    return s;
  }
  // The default view of its scope (see isHome), whose table is precomputed
  function isDefault(ix, s) {
    return s.g === 'category' && s.cat == null && s.group == null && s.purch == null && s.vendor == null && s.agency == null &&
      !s.county && !s.size && !s.np && !s.q && s.from === ix.years[0] && s.to === ix.years[ix.years.length - 1];
  }
  // State -> URL parameters, in a fixed order, leaving out defaults. ix is the view the state was made in;
  // the years are left out when they are the ends of that view's range or of the range the state leads to,
  // so the full range stays the full range when the state filter or the agency moves to another state.
  function stateParams(ix, s) {
    const out = [['g', s.g]];
    if (s.state) out.push(['state', s.state]);
    for (const k of ['cat', 'group', 'purch', 'vendor', 'agency']) {
      if (s[k] != null) out.push([k, Array.isArray(s[k]) ? s[k].join(',') : String(s[k])]);
    }
    const ys = ix.years, ts = ix.store ? scopeYears(ix.store, scopeOf(ix.store, s)) : ys;
    if (s.from !== ys[0] && s.from !== ts[0]) out.push(['from', String(s.from)]);
    if (s.to !== ys[ys.length - 1] && s.to !== ts[ts.length - 1]) out.push(['to', String(s.to)]);
    for (const k of ['county', 'size']) if (s[k]) out.push([k, s[k]]);
    if (s.np) out.push(['np', '1']);
    if (s.q) out.push(['q', s.q]);
    if (s.years) out.push(['years', '1']);
    return out;
  }
  // Older page URLs -> parameters of the same view in the table: {page: 'explore'|'about', p, unknown}
  function fromPath(parts, params) {
    const p = Object.assign({}, params);
    const id = parts[1];
    switch (parts[0]) {
      case undefined: break;
      case 'category': p.cat = id; p.g = 'vendor'; break;
      case 'vendor': p.vendor = id; p.g = 'agency'; break;
      case 'agency': p.agency = id; p.g = 'vendor'; break;
      case 'vendors': p.g = 'vendor'; break;
      case 'agencies': p.g = 'agency'; break;
      case 'rows': p.g = 'none'; break;
      case 'about': return { page: 'about', p };
      default: return { page: 'explore', p, unknown: '/' + parts.join('/') };
    }
    if (!p.g) p.g = 'category';
    return { page: 'explore', p };
  }
  // Row filters in a state, for selectRows and selectPayments.
  function rowFilter(s) {
    const f = {};
    for (const k of ['cat', 'group', 'purch', 'vendor', 'agency']) if (s[k] != null) f[k] = s[k];
    return f;
  }
  // Filtered to one value of a grouping. Several categories still leave something to group by.
  // A vendor filter counts as filtering the category too: a drill-down that has a vendor never moves
  // to the category grouping (most vendors are in one category; the yearly totals show the category
  // of each row, and Group by Category still splits a vendor that has several).
  function isFiltered(s, dim) {
    if (dim === 'vendor') return s.vendor != null;
    if (dim === 'agency') return s.agency != null;
    if (dim === 'category') return (s.cat != null && s.cat.length === 1) || s.vendor != null;

  }
  // Grouping after filtering to one row of grouping `from`: category -> vendor, vendor -> agency,
  // agency -> vendor, year -> vendor, skipping any that is already filtered (then vendor, agency,

  const NEXT = { category: 'vendor', vendor: 'agency', agency: 'vendor', year: 'vendor' };
  function nextGroup(s, from) {
    const pref = NEXT[from];

    for (const d of ['vendor', 'agency', 'category']) if (!isFiltered(s, d)) return d;

  }
  // State after activating the row with this value in the current grouping. A category row
  // narrows the category filter to that one category.
  function drill(ix, s, value) {
    const n = Object.assign({}, s, { q: '', bad: [] });
    switch (s.g) {
      case 'category': n.cat = [value]; n.group = null; n.purch = null; break;
      case 'vendor': n.vendor = value; break;
      case 'agency': n.agency = value; break;
      case 'year': n.from = value; n.to = value; break;
      default: return n;
    }
    n.g = nextGroup(n, s.g);
    return n;
  }
  // Categories in the filters (the selected ones, when there are any), in category order.
  function categoriesFor(ix, s) {
    const ok = catFilter(ix, s, rowFilter(s));
    return ix.D.categories.filter(c => ok[c.id]);
  }
  // The table for a state: items are one aggregate per category, vendor, agency or year, or
  // the rows themselves for g = 'none'. Category and year groupings list every value in
  // the filters, with zero when nothing was paid (with a vendor filter, only categories with its
  // rows); vendors are listed when they have rows. Agencies: every agency in the filters, or only
  // those with rows when a category or vendor filter is set. When category, vendor or other row
  // filters match no rows, every grouping is empty.
  //
  // Before the scope's states are loaded, the default view (isDefault) comes from the precomputed table in
  // data/index.json (pre: true): ag and ve are {size} only, rows is empty and sum has no last year.
  // peersData: the peers with vendor data (coverage 1 payee lines or 2 item lines); the others are in
  // nodata, and in the agency grouping (not narrowed) their items have nodata set.
  function tableModel(ix, s) {
    const f = rowFilter(s);
    const peers = s.agency != null ? new Set([s.agency]) : peerIds(ix, s);
    const peersData = new Set(), nodata = new Set();
    for (const id of peers) {
      const a = ix.agency.get(id);
      if (a && a.coverage > 2) nodata.add(id); else peersData.add(id);
    }
    if (ix.pre && ix.loaded === false && isDefault(ix, s)) {

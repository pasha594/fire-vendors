      let spend = 0;
      const yr = {};
      for (const o of rows) { spend += o.spend; for (const y in o.yr) yr[y] = (yr[y] || 0) + o.yr[y]; }
      return { spend, yr, ve: union(rows, 've'), ag: union(rows, 'ag') };
    };
    const yearCols = () => ys.map(y => ({
      key: 'y' + y, label: fy(y), num: true, hidden: !byYear,
      val: o => (o.yr[y] == null ? null : o.yr[y]), html: o => (o.yr[y] == null ? '' : money(o.yr[y])),
    }));
    const yearFoot = a => { const o = {}; for (const y of ys) o['y' + y] = a.yr[y] == null ? '' : money(a.yr[y]); return o; };
    const paid = {
      key: 'paid', label: 'Paid ' + shortSpan(S), labelHtml: 'Paid <span class="nw">' + esc(shortSpan(S)) + '</span>', num: true,
      val: o => o.spend, html: o => money(o.spend),
    };
    // A count fixed by a filter would repeat one value on every row (kept in the CSV)
    const nVend = { key: 'vendors', label: 'Vendors', num: true, hidden: S.vendor != null, val: o => o.ve.size, html: o => int(o.ve.size) };
    const nAg = { key: 'agencies', label: 'Agencies', num: true, hidden: S.agency != null, val: o => o.ag.size, html: o => int(o.ag.size) };
    // Where a row leads: the same rule as Core.drill
    const dim = { category: 'cat', vendor: 'vendor', agency: 'agency' }[g];
    const nextG = Core.nextGroup(dim ? withS({ [dim]: dim === 'agency' ? 0 : dim === 'cat' ? ['x'] : 'x' }) : S, g);
    const then = nextG === 'none' ? 'show its yearly totals' : 'group by ' + GNAME[nextG];
    const drill = name => ({
      name, label: o => 'Filter to ' + name(o), title: o => 'Filter to ' + name(o) + ', ' + then,
      ok: o => o.n > 0,
    });
    const oneCat = !!S.cat && S.cat.length === 1;          // the category column would repeat one value
    const t = {
      id: 'main-' + g, file: fileName(), wide: true, labelId: 'page-h', allRows: m.items, rows: m.items, byYear,
      hint: 'Select a row to filter to it and ' + then + '.',
      empty: !m.peers.size ? 'No agencies match the agency filters.' : 'No payments match these filters.',
      notes: '',
    };
    // Nothing in the selected categories: say why when the vendor is in none of them, and offer to clear them
    if (m.peers.size && S.cat) {
      let why = '';
      if (S.vendor) {
        const vcs = Core.vendorCats(ix, S.vendor);
        if (vcs.length && !vcs.some(id => S.cat.includes(id))) {
          why = ' Payments to ' + esc(vendorOf(S.vendor).name) + ' are in ' + andList(vcs.map(id => esc(ix.cat.get(id).name))) +
            ', not in ' + (S.cat.length === 1 ? esc(ix.cat.get(S.cat[0]).name) : 'the selected categories') + '.';
        }
      }
      t.emptyHtml = esc(t.empty) + why + ' <button type="button" class="btn" data-rm="cat">Clear category filter</button>';
    }
    const totalLabel = () => (t.re ? 'Total, matching rows' : 'Total');
    if (g === 'category') {
      const share = v => (m.sum.spend > 0 ? v / m.sum.spend : null);
      t.cols = [
        { key: 'cat', label: 'Category', th: true, val: o => ix.cat.get(o.key).name },
        { key: 'group', label: 'Group', opt: true, hidden: byYear, val: o => ix.cat.get(o.key).group },
        nVend, nAg, paid,
        { key: 'share', label: 'Share of paid', csvLabel: 'Share of paid (%)', csvDp: 3, num: true, opt: true, hidden: byYear,
          val: o => share(o.spend), html: o => { const s = share(o.spend); return s == null ? '' : pct(s); },
          csv: o => { const s = share(o.spend); return s == null ? null : s * 100; } },
      ].concat(yearCols());
      t.sort = [['paid', 'desc'], ['cat', 'asc']];
      t.drill = Object.assign(drill(o => ix.cat.get(o.key).name), {
        value: o => o.key,
        after: o => { const term = t.re && t.hits && t.hits.get(o.key); return term ? ' <span class="muted">(' + esc(term) + ')</span>' : ''; },
      });
      t.filter = (rows, re) => { t.hits = new Map(Core.searchCategories(ix, re).map(x => [x.id, x.term])); return rows.filter(o => t.hits.has(o.key)); };
      t.searchHint = 'Category or item, e.g. air pack';
      t.foot = rows => { const a = total(rows); const s = share(a.spend); return [Object.assign({ _label: totalLabel(), vendors: int(a.ve.size), agencies: int(a.ag.size), paid: money(a.spend), share: s == null ? '' : pct(s) }, yearFoot(a))]; };
    } else if (g === 'vendor') {
      const isNeris = o => !!V()[o.key].neris;
      const nerisCol = { key: 'neris', label: 'NERIS partner', nw: true, opt: true, val: o => (isNeris(o) ? 'Yes' : null), html: o => (isNeris(o) ? 'Yes' : '') };
      // A vendor's rows in these filters can be in several categories: the main one (largest net amount) is
      // shown, with the number of others; the CSV lists them all
      const vcs = Core.catsByVendor(ix, m.rows);
      const catsOf = o => vcs.get(o.key) || [];
      const catName = id => ix.cat.get(id).name;
      t.cols = [
        { key: 'vendor', label: 'Vendor', th: true, val: o => V()[o.key].name },
        { key: 'cat', label: 'Category', csvLabel: 'Main category', opt: true, hidden: oneCat || byYear,
          val: o => (catsOf(o).length ? catName(catsOf(o)[0]) : null),
          html: o => { const cs = catsOf(o); return cs.length ? esc(catName(cs[0])) + (cs.length > 1 ? '<br><span class="muted">and ' + plural(cs.length - 1, 'other', 'others') + '</span>' : '') : ''; } },
        { key: 'cats', label: 'All categories', hidden: true, val: o => catsOf(o).map(catName).join('; ') },
        nAg, paid,
        { key: 'last', label: 'Last year paid', num: true, opt: true, hidden: byYear, val: o => o.last, html: o => (o.last == null ? '' : 'FY' + o.last) },
        nerisCol,
      ].concat(yearCols());
      // The NERIS column and its note show only when a row in view is a partner
      t.onSearch = () => { nerisCol.hidden = byYear || !t.rows.some(isNeris); };
      t.tail = () => (nerisCol.hidden ? '' : '<p class="note">NERIS partner: listed by ' + A(LINKS.neris, 'FSRI') +
        ' as integrated with NERIS, the national fire incident reporting system replacing NFIRS.</p>');
      t.sort = S.cat != null && S.agency == null ? [['agencies', 'desc'], ['paid', 'desc']] : [['paid', 'desc'], ['vendor', 'asc']];
      t.drill = Object.assign(drill(o => V()[o.key].name), {
        value: o => V()[o.key].id,
        after: o => {
          if (!t.re || t.re.test(V()[o.key].name.toLowerCase())) return '';
          const al = V()[o.key].aliases.map(i => ix.D.aliases[i]).find(s => t.re.test(s.toLowerCase()));
          return al ? ' <span class="muted">(paid as ' + esc(al) + ')</span>' : '';
        },
      });
      t.searchHint = 'Vendor or payee name';
      t.filter = (rows, re) => rows.filter(o => re.test(ix.vendorText[o.key]));
      t.foot = rows => { const a = total(rows); return [Object.assign({ _label: totalLabel(), agencies: int(a.ag.size), paid: money(a.spend) }, yearFoot(a))]; };
    } else if (g === 'agency') {
      const yP = m.year;
      const ag = o => ix.agency.get(o.key);
      // Annual expenses: median of the last three full years; the most common span is named in the notes, cells
      // from another span say which
      const yc = new Map();
      for (const o of m.items) { const l = ix.latest.get(o.key); if (l) yc.set(spanText(l), (yc.get(spanText(l)) || 0) + 1); }
      const top = [...yc].sort((x, y) => y[1] - x[1] || (x[0] < y[0] ? 1 : -1))[0];
      const expY = top ? top[0] : null;
      // With a category filter, the vendors each agency paid in it (positive net, largest first)
      const byAgV = new Map();
      if (S.cat && S.vendor == null) {
        for (const r of m.rows) {
          let mv = byAgV.get(r[0]);
          if (!mv) byAgV.set(r[0], (mv = new Map()));
          mv.set(r[1], (mv.get(r[1]) || 0) + r[4]);
        }
      }
      const topV = new Map();
      const vnames = o => {
        if (!topV.has(o.key)) {
          const mv = byAgV.get(o.key) || new Map();
          topV.set(o.key, [...mv].filter(([, x]) => x > 0.005).sort((x, y) => y[1] - x[1]).map(([vi]) => V()[vi].name));
        }
        return topV.get(o.key);
      };
      const peopleCol = { key: 'people', label: 'People paid ' + fy(yP), labelHtml: 'People paid <span class="nw">' + esc(fy(yP)) + '</span>', num: true, opt: true, hidden: byYear,
        val: o => Core.peopleIn(ix, o.key, yP), html: o => { const v = Core.peopleIn(ix, o.key, yP); return v == null ? '' : int(v); } };
      t.cols = [
        { key: 'agency', label: 'Agency', th: true, val: o => ag(o).name },
        { key: 'kind', label: 'Kind', hidden: byYear, val: o => ag(o).kind },
        { key: 'staffing', label: 'Staffing', nw: true, hidden: byYear, val: o => staffingCell(ag(o)), csv: o => staffingText(ag(o)) },
        { key: 'county', label: 'County', nw: true, opt: true, hidden: byYear || !!S.county, val: o => ag(o).county },
        nVend,
      ].concat(S.cat && S.vendor == null ? [{
        key: 'topv', label: 'Main vendors', hidden: byYear, val: o => vnames(o)[0] || null, csv: o => vnames(o).join('; ') || null,
        html: o => { const ns = vnames(o); return esc(ns.slice(0, 2).join(', ')) + (ns.length > 2 ? ' <span class="muted">and ' + plural(ns.length - 2, 'other', 'others') + '</span>' : ''); },
      }] : [], [
        paid,
        { key: 'exp', label: 'Annual expenses', num: true, hidden: byYear,
          val: o => (ix.latest.get(o.key) ? ix.latest.get(o.key).amount : null),
          html: o => { const l = ix.latest.get(o.key); return l ? money(l.amount) + (spanText(l) !== expY ? '<br><span class="muted">' + esc(spanText(l)) + '</span>' : '') : ''; } },
        { key: 'expyear', label: 'Annual expenses fiscal years (median of)', hidden: true, val: o => (ix.latest.get(o.key) ? spanText(ix.latest.get(o.key)) : null) },
        { key: 'expwhat', label: 'Annual expenses measure', hidden: true,
          val: o => (!ix.latest.get(o.key) ? null : fireExp(ag(o)) ? 'Fire-coded expenses' : 'Total expenses') },
        peopleCol,
        { key: 'revenue', label: 'Revenue ' + fy(yP), hidden: true, val: o => Core.revenueIn(ix, o.key, yP) },
        { key: 'grants', label: 'FEMA grants ' + shortSpan(S), labelHtml: 'FEMA grants <span class="nw">' + esc(shortSpan(S)) + '</span>', num: true, opt: true, hidden: byYear,
          val: o => Core.grantsIn(ix, o.key, S), html: o => money(Core.grantsIn(ix, o.key, S)) },
      ], yearCols());
      // People paid shows only when a row in view has it (fire districts and interlocal agencies); kept in the CSV
      t.onSearch = () => { peopleCol.hidden = byYear || !t.rows.some(o => Core.peopleIn(ix, o.key, yP) != null); };
      t.sort = [['paid', 'desc'], ['agency', 'asc']];
      t.drill = Object.assign(drill(o => ag(o).name), { value: o => o.key });
      t.searchHint = 'Agency name';
      t.filter = (rows, re) => rows.filter(o => re.test(ag(o).name.toLowerCase()) || (ag(o).usfa && re.test(ag(o).usfa.name.toLowerCase())));
      t.foot = rows => {
        const a = total(rows);
        const gr = rows.reduce((s, o) => s + Core.grantsIn(ix, o.key, S), 0);
        return [Object.assign({ _label: totalLabel(), vendors: int(a.ve.size), paid: money(a.spend), grants: money(gr) }, yearFoot(a))];
      };
      if (m.narrowed) t.notes += '<p class="note">Agencies with no payments in these filters are not listed.</p>';
      if (!byYear) {
        t.notes += '<p class="note">Staffing: USFA registry department type; Not listed: not in the registry. ' +
          (S.cat && S.vendor == null ? 'Main vendors: the vendors each agency paid in ' + catsText(S.cat, true) + ', largest first (the CSV lists all). ' : '') +
          'Annual expenses: the median of total expenses in the last three fully reported fiscal years' + (expY ? ' (' + esc(expY) + ' unless shown)' : '') +
          '; for cities, towns and counties, the expenses coded fire, including payroll. ' +
          'People paid (fire districts and interlocal agencies only): everyone with pay that year, including part-time staff, paid-per-call firefighters and board members. ' +
          'FEMA grants: awards with a federal fiscal year in the range.</p>';
      }
    } else if (g === 'year') {
      t.cols = [
        { key: 'year', label: 'Fiscal year', th: true, val: o => o.key, html: o => esc(fy(o.key)) },
        { key: 'partial', label: 'Partial year', hidden: true, val: o => (ix.partial.has(o.key) ? 'yes' : '') },
        nVend, nAg,
        { key: 'paid', label: 'Paid', num: true, val: o => o.spend, html: o => money(o.spend) },
      ];
      t.sort = [['year', 'asc']];
      t.drill = Object.assign(drill(o => fy(o.key)), { value: o => o.key });
      t.foot = rows => { const a = total(rows); return [{ _label: 'Total', vendors: int(a.ve.size), agencies: int(a.ag.size), paid: money(a.spend) }]; };
    } else {
      // Yearly totals: r = [agency id, vendor index, fiscal year, category index, net amount, alias index]
      // Columns fixed by a filter would repeat one value on every row, so they are hidden (kept in the CSV).
      // With a vendor filter, the category column shows when the vendor's rows are in more than one.
      const payee = r => (r[5] < 0 ? 'Name withheld' : ix.D.aliases[r[5]]);
      const oneRowCat = new Set(m.rows.map(r => r[3])).size <= 1;
      t.cols = [
        { key: 'agency', label: 'Agency', hidden: S.agency != null, val: r => agName(r[0]) },
        { key: 'year', label: 'Fiscal year', val: r => r[2], html: r => fyHtml(r[2]) },
        { key: 'partial', label: 'Partial year', hidden: true, val: r => (ix.partial.has(r[2]) ? 'yes' : '') },
        { key: 'payee', label: 'Payee as reported', th: true, val: payee },
        { key: 'vendor', label: 'Vendor', opt: true, hidden: S.vendor != null, val: r => V()[r[1]].name },
        { key: 'cat', label: 'Category', opt: true, hidden: oneCat || (S.vendor != null && oneRowCat), val: r => ix.cat.get(Core.rowCat(ix, r)).name },
        { key: 'amount', label: 'Net amount', num: true, val: r => r[4], html: r => cents(r[4]) },
      ];
      t.sort = S.agency != null || S.vendor != null ? [['year', 'desc'], ['amount', 'desc']] : [['amount', 'desc'], ['agency', 'asc']];
      t.hint = 'Each row is the net total one agency paid one payee name in one fiscal year and category, from the transaction lines reported to Transparent Utah.';
      t.searchHint = 'Payee, vendor or agency';
      t.filter = (rows, re) => rows.filter(r => re.test(payee(r).toLowerCase()) || re.test(V()[r[1]].name.toLowerCase()) || re.test(agName(r[0]).toLowerCase()));
      t.foot = rows => [{ _label: totalLabel(), amount: cents(rows.reduce((s, r) => s + r[4], 0)) }];
      t.notes += '<p class="note">Source: ' + tuLink() + ' transaction lines (' + A(BLOB + 'pipeline/sql/fire_transactions.sql', 'query') + '), fetched ' +
        esc(dateText(ix.meta.transactions_fetched || ix.meta.fetched)) + '. ' + A(BLOB + ix.meta.transactions_file, 'Raw data file') + ' (gzipped CSV, all agencies).</p>';
    }
    if (g !== 'none') {
      t.notes += '<p class="note">Amounts are net of credits and corrections. Vendors and agencies are counted when the net payment is positive in at least one fiscal year and category of the range.</p>';
    }
    if (S.np) {
      t.notes += '<p class="note">Non-purchasing payments include transfers between agencies in this list (for example Unified Fire Service Area to Unified Fire Authority), so totals can count that money twice.</p>';
    }
    applySearch(t);
    return t;
  }

  // The toolbar goes above the table region (it stays in view); the table, its notes and the hint go in it.
  function renderMain(m) {
    const t = mainTable(m);
    TABLES[t.id] = t;
    let h = '';
    if (t.filter) {
      h += '<div class="tsearch" role="search"><label for="tq">' + esc(SEARCH[S.g]) + '</label>' +
        '<input type="search" id="tq" autocomplete="off" spellcheck="false" placeholder="' + esc(t.searchHint) + '" value="' + esc(S.q) + '"></div>';
    }
    if (S.g === 'category' || S.g === 'vendor' || S.g === 'agency') {
      h += '<div class="chk"><input type="checkbox" id="tyears"' + (S.years ? ' checked' : '') + '><label for="tyears">Show amounts by year</label></div>';
    }
    h += '<span class="tcount" id="tcount">' + countText(t) + '</span><span class="vh" id="tstatus" aria-live="polite"></span>';
    // Shown by renderMore when the single payments section is below the table
    h += '<button type="button" class="btn" id="tpay" hidden>Largest single payments</button>';
    h += '<button type="button" class="btn" id="tcsv" data-csv="' + t.id + '">Download CSV</button>';
    $('tbar').innerHTML = h;
    h = t.hint ? '<p class="hint">' + esc(t.hint) + '</p>' : '';
    h += '<div id="tb-' + t.id + '" class="tmain">' + tableBody(t) + '</div>' + t.notes;
    $('tbl-main').innerHTML = h;
    $('tbl-main').classList.toggle('by-year', !!t.byYear);
    $('fshow').textContent = 'Show ' + countText(t);
  }

  /* ---- Context for the selected category, vendor and agency ---- */
  const details = (id, summary, body) => '<details id="' + id + '"' + (openDetails.has(id) ? ' open' : '') + '><summary>' + summary +
    '</summary><div class="dbody">' + body + '</div></details>';
  const fact = (dt, dd, full) => '<div' + (full ? ' class="full"' : '') + '><dt>' + dt + '</dt><dd>' + dd + '</dd></div>';

  // A category note that names another category ("... under Fire equipment distributors") links to it.
  const shortName = c => c.name.replace(/\s*\(.*\)$/, '');
  function noteHtml(c) {
    const s = esc(c.note);
    const o = ix.D.categories.find(x => x.id !== c.id && c.note.includes(shortName(x)));
    if (!o) return s;
    const n = esc(shortName(o));
    return s.replace(n, A(stateHash(withS({ cat: [o.id], vendor: null, group: null, purch: null, q: '' })), n));
  }
  // Above the table: one short block per category, vendor or agency filter. Longer sections go below the table.
  const ctxHead = (id, title, facts) => '<div class="ctxline"><h2 id="' + id + '">' + esc(title) + '</h2>' +
    facts.filter(Boolean).map(f => '<span class="sep" aria-hidden="true"> · </span><span>' + f + '</span>').join('') + '</div>';
  // Selected categories: a block for each one with a note, FEMA AEL codes or not counted as purchasing;
  // more than 3 selected: one line listing them.
  function ctxCategories(ids) {
    if (ids.length > 3) {
      return '<section class="ctx" aria-labelledby="ctx-cat">' +
        ctxHead('ctx-cat', int(ids.length) + ' categories', ids.map(id => esc(ix.cat.get(id).name))) + '</section>';
    }
    return ids.map(ctxCategory).join('');
  }
  function ctxCategory(id) {
    const c = ix.cat.get(id);
    let n = '';
    if (c.note) n += '<p class="note">' + noteHtml(c) + '</p>';
    if (id === 'unclassified') n += '<p class="note">Payments to payees that match no vendor map row or keyword rule, where no account or description rule gave the line a category. See ' + A('#/about', 'About') + '.</p>';
    if (c.ael) {
      n += '<p class="note">FEMA Authorized Equipment List: ' + A(safeUrl(c.ael_url) || LINKS.ael, esc(c.ael)) +
        (c.ael_title ? ' (' + esc(c.ael_title) + ')' : '') + '.</p>';
    }
    if (!n && c.purchasing === 'yes') return '';
    const hid = 'ctx-cat-' + id;
    const groupFact = c.group !== c.name ? 'Group: ' + esc(c.group) : '';
    // On a phone the notes start collapsed, with the group in them, so the heading is one line and the table
    // stays near the top
    const small = narrow() && !!n;
    const h = '<section class="ctx" aria-labelledby="' + hid + '">' + ctxHead(hid, 'Category: ' + c.name, [
      small ? '' : groupFact,
      c.purchasing === 'no' ? 'Not counted as purchasing' : '',
    ]);
    if (small) n = details('d-catnotes-' + id, 'Category notes', (groupFact ? '<p class="note">' + groupFact + '.</p>' : '') + n);
    return h + n + '</section>';
  }
  function ctxVendor(vid) {
    const v = vendorOf(vid);
    const method = vid === 'individuals' ? 'payee names that look like a person'
      : v.method === 'map' ? 'the vendor map (config/vendor_map.csv)'
      : v.method === 'rule' ? 'a vendor or keyword rule (config/vendor_rules.csv, config/keyword_rules.csv)'
      : 'no rule (Unclassified)';
    // Categories of the vendor's rows (all years and agencies), the main one (vendor.category) first
    const cats = Core.vendorCats(ix, vid).sort((a, b) => (b === v.category) - (a === v.category));
    const names = cats.map(id => esc(ix.cat.get(id).name));
    const catText = !cats.length ? ''
      : cats.length === 1 ? (S.cat && S.cat.length === 1 && S.cat[0] === cats[0] ? '' : 'Category: ' + names[0])
      : cats.length <= 3 ? 'Categories: ' + andList(names)
      : 'Categories: ' + names[0] + ' and ' + plural(cats.length - 1, 'other', 'others');
    let h = '<section class="ctx" aria-labelledby="ctx-ven">' + ctxHead('ctx-ven', 'Vendor: ' + v.name, [
      catText,
      v.neris ? 'NERIS integration partner (' + A(LINKS.neris, 'FSRI list') + ')' : '',
    ]);
    const how = 'Vendor category from ' + esc(method) + '.' +
      (cats.length > 1 ? ' Account and description rules put some of its payments in other categories.' : '');
    if (v.aliases.length) {
      h += details('d-names', 'Names as paid (' + int(v.aliases.length) + ')',
        '<ul class="plain">' + v.aliases.map(i => '<li>' + esc(ix.D.aliases[i]) + '</li>').join('') + '</ul>' +
        '<p class="note">' + how + '</p>');
    } else {
      h += '<p class="note">Payee names withheld. ' + how + '</p>';
    }
    return h + '</section>';
  }
  function ctxAgency(id) {
    const a = ix.agency.get(id);
    const site = a.website ? safeUrl(/^https?:\/\//i.test(a.website) ? a.website : 'https://' + a.website) : null;
    const lat = ix.latest.get(id);
    const med = lat ? (lat.years.length > 1 ? 'median of ' : '') + spanText(lat) : '';
    const expText = lat ? money(lat.amount) + ' (' + med + (fireExp(a) ? ', expenses coded fire' : '') + ')' : '';
    const line = [esc(a.kind), a.county ? esc(a.county) + ' County' : '', esc(staffingText(a)),
      lat ? money(lat.amount) + ' annual ' + (fireExp(a) ? 'fire ' : '') + 'expenses (' + med + ')' : ''];
    // On a phone the facts line moves into the collapsed details
    const small = narrow();
    let h = '<section class="ctx" aria-labelledby="ctx-ag">' + ctxHead('ctx-ag', 'Agency: ' + a.name, small ? [] : line);
    let f = '';
    if (small) {
      f += fact('Kind', esc(a.kind)) + fact('Staffing', esc(staffingText(a)));

  // Largest single payments: p = [agency id, posting date, vendor index, category index, amount,

  const descOf = p => ix.P.descriptions[p[5]];
  const PCOL = {
    vendor: { key: 'vendor', label: 'Vendor', th: true, val: p => V()[p[2]].name },
    agency: { key: 'agency', label: 'Agency', val: p => agName(p[0]) },

    cat: { key: 'cat', label: 'Category', val: p => ix.cat.get(Core.payCat(ix, p)).name },
    year: { key: 'year', label: 'Fiscal year', nw: true, val: p => p[7], html: p => esc(fy(p[7])) },
    partial: { key: 'partial', label: 'Partial year', hidden: true, val: p => (ix.partial.has(p[7]) ? 'yes' : '') },
    amount: { key: 'amount', label: 'Amount', num: true, val: p => p[4], html: p => money(p[4]) },

  // Payments load on demand (data/payments.json), the first time a view shows them
  let payLoad = null;     // the pending or finished load
  let payError = null;    // why the last load failed
  function loadPayments() {
    if (payLoad) return payLoad;
    payError = null;
    payLoad = fetch(ix.meta.payments_file || 'data/payments.json', { cache: 'no-cache' })
      .then(r => { if (!r.ok) throw new Error('data/payments.json returned HTTP ' + r.status); return r.json(); })
      .then(P => { Core.setPayments(ix, P); })
      .catch(err => { console.error(err); payError = err; payLoad = null; })   // the next view that needs them tries again
      .then(() => { if (view === 'explore' && S && $('d-pay')) renderMore(true); });
    return payLoad;
  }
  function morePayments() {
    // Single payments cover purchasing categories only
    const np = id => ix.cat.get(id).purchasing !== 'yes';
    if (S.purch === 'no' || (S.cat && S.cat.every(np))) return '';
    if (S.vendor) {
      const vcs = Core.vendorCats(ix, S.vendor);
      if (vcs.length && vcs.every(np)) return '';
    }
    const title = 'Largest single payments';
    if (!ix.P) {
      if (payError) {
        return details('d-pay', title + ' <span class="muted">(did not load)</span>', '<p>Payments did not load' + (payError.message ? ': ' + esc(payError.message) : '') + '. Change a filter to try again.</p>');
      }
      loadPayments();
      return details('d-pay', title + ' <span class="muted">(Loading payments...)</span>', '<p>Loading payments...</p>');
    }
    const pm = Core.paymentsModel(ix, S, Core.rowFilter(S));
    if (!pm.n) return '';
    const oneCat = !!S.cat && S.cat.length === 1;
    const cols = [
      Object.assign({}, PCOL.vendor, { hidden: S.vendor != null }),
      Object.assign({}, PCOL.agency, { hidden: S.agency != null }),
      PCOL.date,
      PCOL.amount,
      PCOL.desc,
      Object.assign({}, PCOL.cat, { opt: true, hidden: oneCat || (S.vendor != null && new Set(pm.pays.map(p => p[3])).size <= 1) }),
      Object.assign({}, PCOL.year, { opt: true }),
      PCOL.partial,
      Object.assign({}, PCOL.payee, S.vendor ? { opt: true } : { hidden: true }),
    ];
    let b = '<p>' + plural(pm.n, 'payment', 'payments') + ' of $1,000 or more, ' + esc(yearSpan(S)) + '.</p>';
    b += table({
      id: 'pay', title: title, hideTitle: true, file: fileName().replace(/^[a-z-]+/, 'single-payments'), wide: true, page: 25,
      rows: pm.pays, cols, sort: [['amount', 'desc'], ['date', 'desc']],
    });
    b += '<p class="note">Single transaction lines of $1,000 or more in purchasing categories, as posted. One line can cover several items, and an invoice can be split over several lines. ' +
      'A line is left out when a credit or reversal of the same amount to the same payee cancels it. Smaller credits, such as discounts and trade-ins, are not matched to a line, so these lines can add up to more than the net amount paid in the table above. ' +
      'Fiscal year: the year the agency reported the line in. ' +
      'A blank description was not reported, or was withheld because it may identify a person. ' +
      tuLink() + ' (' + A(BLOB + 'pipeline/sql/fire_transactions.sql', 'query') + '); ' + A(BLOB + ix.meta.transactions_file, 'raw data file') + ' (gzipped CSV, all agencies).</p>';
    return details('d-pay', title + ' (' + int(pm.n) + ')', b);

  function renderContext() {
    let h = '';

  // again: the single payments just loaded (or failed to), so the section is drawn again in place. Focus
  // stays on the same control, or moves to the summary of the section it was in.
  function renderMore(again) {
    let sel = null;
    const a = document.activeElement;
    const wasIn = !!(again && a && $('more').contains(a));
    if (wasIn) {
      const d = a.closest('details');
      if (a.dataset.csv) sel = '[data-csv="' + a.dataset.csv + '"]';
      else if (a.dataset.t && a.dataset.c != null) sel = 'button[data-t="' + a.dataset.t + '"][data-c="' + a.dataset.c + '"]';
      if (d && d.id) sel = (sel ? sel + ', ' : '') + '#' + d.id + ' > summary';
    }
    let h = '';
    if (S.cat || S.vendor || S.agency != null) h += morePayments();
    if (S.agency != null) h += moreAgency(S.agency);
    $('more').innerHTML = h ? '<section aria-labelledby="more-h"><h2 id="more-h">More for this selection</h2>' + h + '</section>' : '';
    if ($('tpay')) $('tpay').hidden = !$('d-pay');
    if (!again) return;
    fitRegions($('more'));
    const f = sel && $('more').querySelector(sel);

  /* ---- Active filters ---- */
  function activeFilters() {
    const out = [];                                   // [state key, text]
    if (!fullRange(S)) out.push(['years', S.from === S.to ? 'Fiscal year: ' + fy(S.from) : 'Fiscal years: FY' + S.from + '–FY' + S.to]);
    for (const id of S.cat || []) out.push(['cat:' + id, 'Category: ' + ix.cat.get(id).name]);   // one chip per category
    if (S.group) out.push(['group', 'Category group: ' + S.group]);
    if (S.purch === 'no') out.push(['purch', 'Non-purchasing payments only']);
    if (S.vendor) out.push(['vendor', 'Vendor: ' + vendorOf(S.vendor).name]);
    if (S.agency != null) out.push(['agency', 'Agency: ' + agName(S.agency)]);
    const na = S.agency != null ? ' (not applied)' : '';
    if (S.county) out.push(['county', 'County: ' + S.county + na]);
    if (S.size) out.push(['size', 'Annual expenses: ' + Core.SIZES.find(z => z.id === S.size).label + na]);
    if (S.np) out.push(['np', 'Non-purchasing payments included']);
    return out;
  }
  // State without one filter. 'cat:<id>' removes one category; 'cat' all of them.
  function without(key) {
    if (key === 'years') return withS({ from: ix.years[0], to: ix.years[ix.years.length - 1] });
    if (key === 'np') return withS({ np: false });
    if (key === 'county' || key === 'size') return withS({ [key]: '' });
    if (key.startsWith('cat:')) {
      const rest = (S.cat || []).filter(id => id !== key.slice(4));
      return withS({ cat: rest.length ? rest : null });
    }
    return withS({ [key]: null });
  }
  function renderChips(notes) {
    const fs = activeFilters();

    if (!fs.length) h = '<span class="chips-l">No filters</span>';
    else {
      h = '<span class="chips-l" id="chips-l">Filters:</span><ul class="chips" aria-labelledby="chips-l">' + fs.map(([k, text]) =>
        '<li class="chip">' + esc(text) + '<button type="button" data-rm="' + k + '" aria-label="Remove filter ' + esc(text) + '">×</button></li>').join('') +
        '</ul><button type="button" class="btn" data-clear="1">Clear all filters</button>';
    }
    if (notes.length) h += '<p class="badnote">Not found, so not applied: ' + notes.map(esc).join(', ') + '.</p>';
    $('chips').innerHTML = h;
    return fs.length;
  }

  /* ---- Filter bar ---- */
  const opt = (v, label) => '<option value="' + esc(v) + '">' + esc(label) + '</option>';
  function fillControls() {
    const yrs = ix.years.map(y => opt(y, fy(y))).join('');
    $('f-from').innerHTML = yrs;
    $('f-to').innerHTML = yrs;
    $('f-agency').innerHTML = opt('', 'All agencies') +
      ix.D.agencies.slice().sort((x, y) => coll.compare(x.name, y.name)).map(a => opt(a.id, a.name)).join('');
    $('f-county').innerHTML = opt('', 'All') + ix.counties.map(c => opt(c, c)).join('');
    $('f-size').innerHTML = opt('', 'All') + Core.SIZES.map(t => opt(t.id, t.label)).join('');
    const names = V().map(v => v.name).sort(coll.compare);
    $('vendor-list').innerHTML = names.map(n => '<option value="' + esc(n) + '"></option>').join('');
    vendorByName = new Map(V().map(v => [v.name.toLowerCase(), v.id]));
  }
  // Category checkboxes under their group headings; non-purchasing ones only with the checkbox on
  // (or when selected). Rebuilt only when that list changes, so focus stays on the box just toggled.
  function fillCategories() {
    const npSel = S.np ? [] : (S.cat || []).filter(id => ix.cat.get(id).purchasing !== 'yes');
    const key = S.np + ':' + npSel.join(',');
    if (key === catOptsKey) return;
    catOptsKey = key;
    const box = $('f-cat-box');
    const before = [...box.querySelectorAll('input')].map(i => i.value);
    const at = box.contains(document.activeElement) ? before.indexOf(document.activeElement.value) : -1;
    const chk = c => '<label class="chk"><input type="checkbox" name="cat" id="fc-' + esc(c.id) + '" value="' + esc(c.id) + '"><span>' + esc(c.name) + '</span></label>';
    let h = '';
    for (const gr of ix.groups) {
      const cs = ix.D.categories.filter(c => c.group === gr && (S.np || c.purchasing === 'yes' || npSel.includes(c.id)));
      if (!cs.length) continue;
      // A group that is a single category of the same name (Unclassified) needs no heading
      h += cs.length === 1 && cs[0].name === gr ? chk(cs[0]) : '<fieldset class="cgrp"><legend>' + esc(gr) + '</legend>' + cs.map(chk).join('') + '</fieldset>';
    }
    box.innerHTML = '<div class="catcols">' + h + '</div>';   // columns inside the box, so the box scrolls down, not sideways
    // Focus was on a checkbox that is gone (a non-purchasing category unchecked): move to the one before it
    for (let i = at; i >= 0; i--) { const el = $('fc-' + before[i]); if (el) { el.focus(); break; } }
  }
  function syncPanel(nActive) {
    $('f-from').value = S.from;
    $('f-to').value = S.to;
    fillCategories();
    const sel = new Set(S.cat || []);
    for (const el of $('f-cat-box').querySelectorAll('input')) el.checked = sel.has(el.value);
    $('f-cat-n').innerHTML = sel.size ? '(' + int(sel.size) + '<span class="vh"> selected</span>)' : '';
    $('f-cat-txt').textContent = 'Category: ' + (sel.size ? int(sel.size) + ' selected' : 'All');
    $('f-cat-clear').disabled = !sel.size;
    $('f-vendor').value = S.vendor ? vendorOf(S.vendor).name : '';
    $('f-vendor-msg').textContent = '';
    $('f-agency').value = S.agency != null ? String(S.agency) : '';
    $('f-county').value = S.county;
    $('f-size').value = S.size;
    $('f-np').checked = S.np;
    const txt = S.agency != null ? 'Not applied while one agency is selected.'
      : int(Core.peerIds(ix, S).size) + ' of ' + int(ix.D.agencies.length) + ' agencies match';
    $('f-count').textContent = txt;
    // Announced only after a change to the agency filters, where focus stays on the select
    $('f-live').textContent = announcePeers ? txt : '';
    announcePeers = false;
    $('ftoggle').textContent = nActive ? 'Filters (' + nActive + ' active)' : 'Filters';
  }
  // A category checkbox adds or removes that category. The grouping stays, so grouped by category
  // the table compares the selected ones. A vendor filter is kept (the two intersect).
  function toggleCat(id, on) {
    const ids = (S.cat || []).filter(x => x !== id).concat(on ? [id] : []);
    return withS({ cat: ids.length ? Core.parseCats(ix, ids).ids : null, group: null, purch: null });
  }
  // Filtering on the dimension the table is grouped by moves to the next grouping, as a row click does.
  function setVendor(vid) {
    const n = withS({ vendor: vid });
    if (vid) {
      // A category group or purchasing flag (from older links) that none of the vendor's payments are in is dropped
      const cs = Core.vendorCats(ix, vid).map(id => ix.cat.get(id));
      if (n.group && cs.length && !cs.some(c => c.group === n.group)) n.group = null;
      if (n.purch && cs.length && !cs.some(c => c.purchasing === n.purch)) n.purch = null;
      if (S.g === 'vendor') { n.g = Core.nextGroup(n, 'vendor'); n.q = ''; }
    }
    return n;
  }
  function setAgency(id) {
    const n = withS({ agency: id });

    return n;
  }
  // Vendor box: a pick from the list applies at once; typed text applies on Enter or when leaving the box.
  function vendorCommit() {
    const raw = $('f-vendor').value.trim();
    const msg = $('f-vendor-msg');
    msg.textContent = '';
    if (!raw) { if (S.vendor) go(setVendor(null)); return; }
    const id = vendorByName.get(raw.toLowerCase());
    if (id) { if (id !== S.vendor) go(setVendor(id)); return; }
    const re = Core.searchRe(raw);
    const hits = [];
    if (re) for (let i = 0; i < ix.vendorText.length && hits.length < 2; i++) if (re.test(ix.vendorText[i])) hits.push(i);
    if (hits.length === 1) { go(setVendor(V()[hits[0]].id)); return; }
    msg.textContent = hits.length ? 'Several vendors match. Pick one from the list.' : 'No vendor matches "' + raw + '".';
  }
  // The annual expenses range an agency is in, or undefined without an expense figure

  // Category checkboxes, opened from the Category button. On a phone they open in place, in the panel.

  function bindControls() {

          break;
        }
        case 'f-vendor': vendorCommit(); return;
        case 'f-agency': n = setAgency(el.value ? Number(el.value) : null); break;
        case 'f-county': case 'f-size': n = withS({ [el.id.slice(2)]: el.value }); announcePeers = true; break;

      }

    const vin = $('f-vendor');

    $('f-clear').addEventListener('click', () => go(Core.normState(ix, { g: S.g, years: S.years ? '1' : '' })));
    // Clear categories: focus moves to the first checkbox, since this button is disabled with none selected

      go(withS({ cat: null }));
    });
    // Category button: opens the checkboxes below it. Ticking boxes keeps it open; Escape, a click
    // outside it or moving focus out of it closes it. On a phone the list is part of the filter panel,
    // not a popover: closing it would move everything below it under the finger, so it stays open
    // until the Category button, Escape or Show rows closes it.
    $('f-cat-btn').addEventListener('click', () => catPanel(!catOpen()));
    $('f-cat-wrap').addEventListener('keydown', e => {
      if (e.key !== 'Escape' || !catOpen()) return;
      e.preventDefault();
      catPanel(false, true);
    });
    $('f-cat-wrap').addEventListener('focusout', e => {
      if (narrow()) return;
      if (catOpen() && e.relatedTarget && !$('f-cat-wrap').contains(e.relatedTarget)) catPanel(false);
    });
    // A click on the table region that closes the popover only closes it: the popover covers most of
    // the table, and a click anywhere on a row would otherwise also open that row.
    let swallowClick = false;
    document.addEventListener('pointerdown', e => {
      const t = e.target;
      swallowClick = false;
      if (catOpen() && !narrow() && !$('f-cat-wrap').contains(t)) {
        catPanel(false);
        swallowClick = $('scroller').contains(t);

      if (!(t.closest && t.closest('.vendf'))) $('f-vendor-msg').textContent = '';
    });
    document.addEventListener('click', e => {
      if (!swallowClick) return;
      swallowClick = false;
      if (!e.detail) return;                  // a click from the keyboard (Enter or Space) is never swallowed
      e.preventDefault();
      e.stopImmediatePropagation();
    }, true);
    document.addEventListener('keydown', () => { swallowClick = false; }, true);
    const panel = open => {
      if (!open) catPanel(false);
      $('fpanel').classList.toggle('open', open);
      $('ftoggle').setAttribute('aria-expanded', String(open));
    };
    $('ftoggle').addEventListener('click', () => panel(!$('fpanel').classList.contains('open')));
    // Phone: close the panel and go to the table
    $('fshow').addEventListener('click', () => {
      panel(false);
      $('chips').scrollIntoView({ block: 'start' });

      b.addEventListener('click', () => { if (b.dataset.g !== S.g) go(withS({ g: b.dataset.g, q: '' })); });

    // Table search: filters the rows in place; the URL is updated without a new history entry
    $('area').addEventListener('input', e => {

      rerender(t.id, false);
      toTableTop();
      $('tcount').textContent = countText(t);
      $('fshow').textContent = 'Show ' + countText(t);

  // Buttons anywhere: sort, Show all/more, CSV, drill-down, remove filter, agencies of the same size
  function drillTo(raw) {
    const v = S.g === 'agency' || S.g === 'year' ? Number(raw) : raw;
    openDetails.clear();                                        // a drill-down shows the new table, not sections left open
    go(Core.drill(ix, S, v));

  document.addEventListener('click', e => {
    const tgt = e.target;
    if (!tgt.closest) return;
    const b = tgt.closest('button');
    if (b) {
      const d = b.dataset;
      if (d.t && d.c != null) {                                 // sort
        const t = TABLES[d.t], c = Number(d.c);
        if (!t || !t.cols[c]) return;
        const col = t.cols[c];
        const cur = sortSpec(t)[0] || [-1];
        TSTATE[t.id].sort = cur[0] === c ? [colKey(col), cur[1] === 'asc' ? 'desc' : 'asc']
          : [colKey(col), col.num ? 'desc' : 'asc'];
        rerender(t.id, 'button[data-c="' + c + '"]');
        if (S && t.id === 'main-' + S.g) toTableTop();          // sorted from the sticky header: show the first rows
      } else if (d.all) {                                       // show all rows
        if (!TABLES[d.all]) return;
        TSTATE[d.all].all = true;
        rerender(d.all, '.tw');
      } else if (d.more) {                                      // show more rows
        const st = TSTATE[d.more];
        if (!st || !TABLES[d.more]) return;
        st.limit = (st.limit || TABLES[d.more].page || PAGE) + MORE;
        rerender(d.more, '[data-more], [data-all]');
      } else if (d.csv && TABLES[d.csv]) {
        downloadCsv(TABLES[d.csv]);
      } else if (d.drill != null) {
        drillTo(d.drill);
      } else if (d.rm) {
        go(without(d.rm));
      } else if (d.clear) {
        $('f-clear').click();
      } else if (d.like) {
        go(likeState(Number(d.like)));
      } else if (b.id === 'tpay') {                             // open the single payments below the table
        const dp = $('d-pay');
        if (!dp) return;
        dp.open = true;
        openDetails.add('d-pay');
        dp.scrollIntoView({ block: 'start' });
        dp.querySelector('summary').focus({ preventScroll: true });
      }
      return;
    }
    // Links within the page change the state through nav(), like the controls
    const a = tgt.closest('a[href^="#/"]');
    if (a) {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      nav(a.getAttribute('href'));
      return;
    }
    // A click anywhere on a grouped row does what its button does (unless text is being selected)
    const tr = tgt.closest('tr.dr');
    if (tr && !tgt.closest('a, input, select, label, summary')) {
      const sel = window.getSelection && String(window.getSelection());
      if (sel) return;
      const btn = tr.querySelector('button.drill');
      if (btn) drillTo(btn.dataset.drill);

    if (fs.July) fyParts.push(plural(fs.July, 'runs', 'run') + ' July to June');
    if (fs['']) fyParts.push('for ' + int(fs['']) + ' it is not known');
    h += '<li>FY is each agency\'s own fiscal year as reported to Transparent Utah (for cities, towns and counties, the start month is read from the posting dates). ' +
      cap(andList(fyParts)) +
      (py.length ? '; ' + py.join(' and ') + ' may be incomplete for any agency (calendar-year agencies are mid-year) and ' +
        (py.length === 1 ? 'is' : 'are') + ' marked partial throughout.' : '.') + ' A payment\'s posting date can fall outside the fiscal year it was reported in.</li>';
    h += '<li>People paid counts employee numbers in the compensation reports. Unified Fire Authority reports several of its fire investigations staff under one employee number each year, so its count is a few people low and they appear under one job title.</li>';
    h += '<li>Payee names that look like a person are withheld, and descriptions that may identify a person are not shown. Names of people written another way may still appear.</li>';
    h += '<li>The USFA registry is self-reported and some agencies are missing from it.</li>';
    h += '<li>Some agencies fund others. For example, Unified Fire Service Area pays Unified Fire Authority, and some cities pay a fire district or another city for fire service. Those payments are under Payments to other governments, which is not counted as purchasing.</li>';
    h += '</ul>';
    h += '<h2>Code</h2><p>' + A(REPO, 'github.com/pasha594/utah-fire-procurement') + '. Data built ' + esc(dateText(meta.built)) + '.</p>';
    h += '</div>';
    return h;
  }

  /* ---- Router ---- */
  // Focus after a change: the summary, unless Back or Forward restored a position further down the
  // table; then the first row in view. In the fixed layout the summary is always on screen, so what
  // counts is whether the table region is scrolled past the start of the table.
  function focusMain() {
    const sum = $('summary');
    const tb = $('tb-main-' + S.g);
    const sc = fixed() ? $('scroller') : null;
    let top = 0, bottom = window.innerHeight;
    if (sc) {
      top = sc.getBoundingClientRect().top + sc.clientTop;
      bottom = top + sc.clientHeight;
    }
    const r = sum.getBoundingClientRect();
    const sumOn = r.top >= 0 && r.top < window.innerHeight;
    if (!tb || (sumOn && (!sc || tb.getBoundingClientRect().top >= top - 1))) { sum.focus({ preventScroll: true }); return; }
    // Rows under the sticky header row are hidden (its cells stick; the thead box itself does not move)
    const hc = sc && tb.querySelector('thead th');
    const from = hc ? Math.max(top, hc.getBoundingClientRect().bottom - 1) : top;
    for (const b of tb.querySelectorAll('button.drill')) {
      const q = b.getBoundingClientRect();
      if (q.top > bottom) break;
      if (q.top >= from) { b.focus({ preventScroll: true }); return; }
    }
    // No row button in view: the table itself when it is in view (rows without buttons), otherwise
    // the summary when it is on screen (the region is scrolled to the sections below the table)
    const t = tb.getBoundingClientRect();
    if (sumOn && (t.bottom <= from || t.top >= bottom)) { sum.focus({ preventScroll: true }); return; }
    tb.tabIndex = -1;
    tb.focus({ preventScroll: true });
  }
  // own: the change came from the page (a control, a row or a link); otherwise Back, Forward or a typed URL
  function route(own) {
    const { parts, params } = parseHash();
    const L = Core.fromPath(parts, params);
    const prevView = view;
    const active = document.activeElement;
    const activeId = active && active !== document.body ? active.id : '';
    const inArea = !!(active && $('area').contains(active));
    clearTimeout(scrollTimer);
    try {
      if (L.page === 'about') {
        view = 'about';
        $('explore').hidden = true;
        $('page').hidden = false;
        $('page').innerHTML = viewAbout();
        document.title = 'About – ' + SITE;
      } else {
        view = 'explore';
        S = Core.normState(ix, L.p);
        const notes = S.bad.slice();
        if (L.unknown) notes.unshift('page "' + L.unknown + '"');
        const canon = stateHash(S);
        if (location.hash !== canon) history.replaceState(history.state, '', canon);   // older URL forms
        exploreHash = canon;
        $('home-link').href = canon;                     // the site title returns to this table
        const st = history.state;
        renderExplore(notes, !own && st && Array.isArray(st.all) ? st.all : null);   // Back/Forward: tables shown in full stay so
      }
    } catch (err) {
      console.error(err);
      for (const k in TABLES) delete TABLES[k];
      view = 'error';
      $('explore').hidden = true;
      $('page').hidden = false;
      $('page').innerHTML = '<div class="prose"><h1 tabindex="-1">Something went wrong</h1><p>This view could not be shown. ' + A('#/', 'Start over') + '.</p></div>';
      document.title = 'Error – ' + SITE;
    }
    rendered = location.hash;
    const about = $('about-link');
    if (view === 'about') about.setAttribute('aria-current', 'page'); else about.removeAttribute('aria-current');
    if (view !== 'explore') catPanel(false);

    // Scroll: Back and Forward return to the saved position; other changes show the new table from its
    // start (the table region in the fixed layout; otherwise the page, when it is scrolled past the table)
    const box = scrollBox();
    if (!own && prevView !== null) {
      const st = history.state;
      box.scrollTop = st && typeof st.y === 'number' ? st.y : 0;
      box.scrollLeft = st && typeof st.x === 'number' ? st.x : 0;
    } else if (own && view === 'explore') {
      if (fixed()) { box.scrollTop = 0; box.scrollLeft = 0; }
      else {
        const top = $('area').getBoundingClientRect().top;
        if (top < 0) window.scrollBy(0, top - 8);
      }
    } else if (own && view !== prevView) {
      box.scrollTop = 0;
      box.scrollLeft = 0;
    }
    // Focus: stay on the control that made the change when it is still there; otherwise the summary
    if (view !== 'explore') {
      if (prevView !== view && prevView !== null) { const h1 = $('page').querySelector('h1'); if (h1) h1.focus({ preventScroll: true }); }
    } else if (prevView !== null) {
      const again = activeId && $(activeId);
      if (prevView !== 'explore') focusMain();
      else if (again && document.activeElement !== again && $('area').contains(again)) again.focus({ preventScroll: true });
      else if (inArea && !document.contains(active)) focusMain();
      else if (own && (!active || active === document.body || active === $('main') || active === $('scroller'))) focusMain();   // e.g. a click on a row cell
      else if (!own && inArea) focusMain();
    }
  }

  // Remember the scroll position of each history entry (of the page, or of the table region)
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  document.addEventListener('scroll', e => {
    const b = scrollBox();
    if (e.target !== b && !(e.target === document && b === (document.scrollingElement || document.documentElement))) return;
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(saveEntry, 200);
  }, { passive: true, capture: true });
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { fitRegions($('main')); placeCat(); }, 200);
  });
  // Fixed layout: the page itself does not scroll, so the scroll keys do nothing while focus is outside
  // the region (on the page, or on the summary after a change). They scroll the region instead.
  const SCROLL_KEYS = { PageDown: 1, PageUp: -1, ' ': 1, ArrowDown: 1, ArrowUp: -1, Home: -1, End: 1 };
  document.addEventListener('keydown', e => {
    if (!fixed() || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.isComposing) return;
    const dir = SCROLL_KEYS[e.key];
    if (!dir) return;
    const a = document.activeElement;
    if (a && a !== document.body && a !== $('main') && a !== $('summary')) return;
    const sc = scrollBox();
    if (sc === document.scrollingElement || sc === document.documentElement) return;
    const page = Math.max(40, sc.clientHeight - 40);
    let top;
    if (e.key === 'Home' || e.key === 'End') top = dir * sc.scrollHeight;
    else if (e.key.startsWith('Arrow')) top = dir * 40;
    else top = (e.key === ' ' && e.shiftKey ? -1 : dir) * page;
    e.preventDefault();
    sc.scrollBy({ top });
  });
  $('skip').addEventListener('click', e => {
    e.preventDefault();
    const target = view === 'explore' ? $('summary') : $('page').querySelector('h1');
    (target || $('main')).focus();
  });

  /* ---- Load ---- */
  function fail(err) {
    $('page').innerHTML = '<div class="prose"><h1 tabindex="-1">Data did not load</h1>' +
      '<p>Could not load the data' + (err && err.message ? ': ' + esc(err.message) : '') + '.</p>' +
      (location.protocol === 'file:'
        ? '<p>Opening index.html directly from disk does not work, because the browser blocks the data request. ' +
          'From the project folder run <code>python3 -m http.server</code> and open <a href="http://localhost:8000/">http://localhost:8000/</a>.</p>'
        : '') + '</div>';
  }
  fetch('data/data.json', { cache: 'no-cache' })                // revalidate, so a new page never runs on old cached data
    .then(r => { if (!r.ok) throw new Error('data/data.json returned HTTP ' + r.status); return r.json(); })
    .then(D => {
      ix = Core.buildIndex(D);
      $('asof').textContent = 'Prototype. Data as of ' + dateText(ix.meta.fetched) + '.';
      fillControls();
      bindControls();
      route(false);
      loaded = true;
      // Back and Forward; typed URLs and links outside the page's own handling (each change is rendered once)
      window.addEventListener('popstate', () => route(false));
      window.addEventListener('hashchange', () => { if (location.hash !== rendered) route(false); });
    })
    .catch(err => { console.error(err); if (!loaded) fail(err); });
})();
</script>
